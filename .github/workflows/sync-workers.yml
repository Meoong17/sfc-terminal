name: Sync & Deploy from Workers

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - 'worker/**'
      - '.github/workflows/sync-workers.yml'

permissions:
  contents: write

concurrency:
  group: sfc-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch from Workers
        run: |
          curl -sL "https://sfc-terminal.meoong17.workers.dev/" -o index.html
          echo "Fetched $(wc -c < index.html) bytes"
          # Show first line for verification
          head -1 index.html

      - name: Verify dashboard integrity
        run: |
          if ! grep -q 'SFC Terminal\|Quantitative Stress Intelligence\|Stablecoin Liquidity\|Macro Liquidity' index.html; then
            echo "❌ Fetched file is NOT the dashboard — aborting commit"
            cat index.html | head -5
            exit 1
          fi
          if grep -q 'loginForm' index.html; then
            echo "❌ Fetched file is the LOGIN page — aborting commit"
            exit 1
          fi
          echo "✅ Dashboard verified"

      - name: Check for changes
        id: check
        run: |
          git diff --quiet index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git commit -m "sync: SFC from Workers $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
