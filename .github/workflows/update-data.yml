name: Update SFC Data & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'     # every hour — embedded data refresh (local cron handles 5-min updates)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sfc-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv feedparser beautifulsoup4

    - name: Run data collector
      id: collect
      env:
        CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
      run: |
        python collect.py > data.json
        echo "Data collected at $(date -u)"

    - name: Inject data into HTML
      run: |
        python inject_data.py data.json index.html index.html
        echo "Data injected into index.html"

    - name: Check if data changed
      id: check-data
      run: |
        git diff --quiet data.json && echo "updated=false" >> $GITHUB_OUTPUT || echo "updated=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.check-data.outputs.updated == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json index.html
        git commit -m "auto-update: SFC data $(date -u '+%Y-%m-%d %H:%M:%S')"
        git push

    - name: Configure GitHub Pages (main branch)
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/pages \
          -d '{"source":{"branch":"main","path":"/"}}' \
          -w "\nHTTP %{http_code}"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://meoong17.github.io/sfc-terminal

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
