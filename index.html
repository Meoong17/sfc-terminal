<!DOCTYPE html>
<!-- b=1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com https://sfc-terminal.meoong17.workers.dev;">
<title>SFC Terminal | Quantitative Stress Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   SFC TERMINAL v4 — Redesigned Design System
   Dark-mode, Linear-inspired precision with crypto-accent purple
══════════════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void:      #07080d;
  --bg-base:      #0b0d15;
  --bg-card:      #0e111a;
  --bg-raise:     #131723;
  --bg-float:     #1a1f2e;
  --bg-hover:     #1f2436;

  --border-0:    rgba(255,255,255,0.03);
  --border-1:    rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.09);
  --border-3:    rgba(255,255,255,0.14);

  --text-1: #edf1f7;
  --text-2: #8892a8;
  --text-3: #49536b;
  --text-4: #2a3347;

  --purple:   #7864ff;
  --purple2:  #5d4ae0;
  --purple-dim: rgba(120,100,255,0.12);
  --purple-glow: rgba(120,100,255,0.2);
  --purple-border: rgba(120,100,255,0.3);

  --cyan:     #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.1);
  --green:    #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --red:      #ff4060;
  --red-dim:   rgba(255,64,96,0.1);
  --amber:    #f0b429;
  --amber-dim: rgba(240,180,41,0.1);
  --blue:     #4a9eff;
  --blue-dim:  rgba(74,158,255,0.1);

  --grad-purple:  linear-gradient(135deg,#7864ff,#5d4ae0);
  --grad-cyan:    linear-gradient(135deg,#00d4ff,#0099e6);
  --grad-green:   linear-gradient(135deg,#00f5a0,#00c87b);
  --grad-red:     linear-gradient(135deg,#ff4060,#cc1a35);
  --grad-amber:   linear-gradient(135deg,#f0b429,#d48a00);
  --border-red: #ff4060;
  --border-green: #00f5a0;

  --glow-purple: 0 0 30px rgba(120,100,255,0.15);
  --glow-cyan:   0 0 30px rgba(0,212,255,0.12);
  --glow-green:  0 0 30px rgba(0,245,160,0.12);
  --glow-red:    0 0 30px rgba(255,64,96,0.12);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --nav-h: 52px;
  --band-h: 36px;
}

html { height: 100%; }

body {
  background: var(--bg-void);
  color: var(--text-1);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ══════════════════════════════════════════
   LOADING SCREEN
══════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
.loading-logo {
  width: 56px; height: 56px;
  border-radius: var(--r-md);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.loading-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border-2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: var(--nav-h);
  background: rgba(7,8,13,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-1);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 10px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.nav-wordmark { display: flex; flex-direction: column; }
.nav-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}
.nav-title span { color: var(--purple); }
.nav-sub {
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 1px;
}

.nav-center {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255,255,255,0.03);
  padding: 2px;
  border-radius: 8px;
}
.nav-tab {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text-1); background: rgba(255,255,255,0.04); }
.nav-tab.active { color: #fff; background: var(--purple-dim); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-meta { display: flex; flex-direction: column; align-items: flex-end; }
.nav-meta-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}
.nav-meta-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-1);
}
.nav-pill {
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.pill-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.pill-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--border-red); }

/* ══════════════════════════════════════════
   STATUS BAND
══════════════════════════════════════════ */
.status-band {
  display: flex;
  gap: 6px;
  padding: 6px 24px;
  height: var(--band-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-1);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.status-band::-webkit-scrollbar { display: none; }
.s-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid var(--border-1);
  background: var(--bg-card);
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}
.s-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.dot-g { background: var(--green); box-shadow: 0 0 5px rgba(0,245,160,0.5); }
.dot-r { background: var(--red);   box-shadow: 0 0 5px rgba(255,64,96,0.5); }
.dot-a { background: var(--amber); box-shadow: 0 0 5px rgba(240,180,41,0.5); }
.dot-b { background: var(--blue);  box-shadow: 0 0 5px rgba(74,158,255,0.5); }
.dot-c { background: var(--cyan);  box-shadow: 0 0 5px rgba(0,212,255,0.5); }
.dot-p { background: var(--purple);box-shadow: 0 0 5px rgba(120,100,255,0.5); }

/* ══════════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════════ */
.main {
  padding: 20px 24px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* Section heading bar */
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.section-head-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-2), transparent);
}
.section-head-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}

/* ══════════════════════════════════════════
   KPI ROW
══════════════════════════════════════════ */
.kpi-row {
  display: grid;
  grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.kpi:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

.kpi-hero {
  border-color: var(--purple-border);
  background: linear-gradient(135deg, rgba(120,100,255,0.06) 0%, var(--bg-card) 100%);
}
.kpi-hero:hover {
  border-color: rgba(120,100,255,0.4);
  box-shadow: var(--glow-purple);
}

/* Gradient top accent for all KPIs */
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 2px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  opacity: 0.6;
}
.kpi-hero::before { background: var(--grad-purple); }

.kpi-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.kpi-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 3px;
}
.kpi-hero .kpi-num { font-size: 32px; }
.kpi-aux {
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
}
.kpi-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 3px;
}
.kb-g { background: var(--green-dim); color: var(--green); }
.kb-r { background: var(--red-dim); color: var(--red); }
.kb-a { background: var(--amber-dim); color: var(--amber); }

.chg-p { color: var(--green); }
.chg-n { color: var(--red); }
.chg-z { color: var(--text-2); }

/* ══════════════════════════════════════════
   GRID LAYOUTS
══════════════════════════════════════════ */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.span-full { grid-column: 1 / -1; }

/* ══════════════════════════════════════════
   CARD
══════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.card:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.015);
}

/* Gradient top accent bar for all cards */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 1.5px;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: linear-gradient(90deg, transparent, rgba(120,100,255,0.2), transparent);
  opacity: 0.4;
  z-index: 1;
}

.card-head {
  padding: 12px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-1);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-2);
}
.card-icon {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: var(--bg-raise);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { display: block; }
.card-badge {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
}
.card-body { padding: 18px; }
.card-body-sm { padding: 12px 18px; }

/* ══════════════════════════════════════════
   SFC STRESS HERO (Arc Gauge)
══════════════════════════════════════════ */
.sfc-hero-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 18px;
}
.sfc-arc-container {
  position: relative;
  width: 170px;
  height: 95px;
  margin-bottom: 6px;
}
.sfc-arc-container svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sfc-big-num {
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}
.sfc-desc {
  font-size: 9px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.sfc-zone-pill {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}
.zone-normal   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.zone-elevated { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.zone-critical { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }

/* Progress bar */
.prog-track {
  height: 3px;
  background: var(--bg-raise);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
}
.prog-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.pf-green  { background: var(--grad-green); }
.pf-red    { background: var(--grad-red); }
.pf-amber  { background: var(--grad-amber); }
.pf-cyan   { background: var(--grad-cyan); }
.pf-purple { background: var(--grad-purple); }

/* ══════════════════════════════════════════
   METHOD ENSEMBLE GRID
══════════════════════════════════════════ */
.method-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 12px;
}
.method-cell {
  background: var(--bg-raise);
  border-radius: var(--r-sm);
  padding: 7px 5px;
  text-align: center;
  border: 1px solid var(--border-1);
  transition: border-color 0.15s;
}
.method-cell:hover { border-color: var(--border-2); }
.method-cell-name {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.method-cell-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
}

/* ══════════════════════════════════════════
   CONSENSUS
══════════════════════════════════════════ */
.consensus-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 0;
  border-top: 1px solid var(--border-1);
  margin-top: 6px;
}
.consensus-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.consensus-info { flex: 1; }
.consensus-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 1px;
}
.consensus-sub {
  font-size: 8px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ══════════════════════════════════════════
   CHART
══════════════════════════════════════════ */
.chart-shell {
  position: relative;
  border-radius: var(--r-md);
  padding: 3px;
  background: linear-gradient(135deg, rgba(120,100,255,0.04) 0%, transparent 60%);
  overflow: hidden;
}
.chart-shell canvas {
  display: block;
  width: 100% !important;
  max-height: 220px;
}

/* ══════════════════════════════════════════
   INFO TABLE ROWS
══════════════════════════════════════════ */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
  font-size: 11px;
}
.info-row:last-child { border-bottom: none; }
.info-k {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 500;
}
.info-v {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 11px;
}

/* ══════════════════════════════════════════
   GAUGE RINGS
══════════════════════════════════════════ */
.gauge-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 4px;
}
.gauge-wrap svg { width: 100%; height: 100%; }
.gauge-center-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 16px;
}
.metric-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: center;
  margin-bottom: 6px;
}
.sopr-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 6px 0 3px;
}
.dual-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.metric-center { text-align: center; padding: 4px; }

/* ══════════════════════════════════════════
   SIGNAL BLOCK
══════════════════════════════════════════ */
.signal-pill {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sp-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.sp-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sp-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }


/* ── NEWS TICKER ── */
.news-wrap {
  margin-bottom: 14px;
  position: relative;
}
.news-viewport {
  height: 52px;
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  position: relative;
}
.news-viewport::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent 0%, var(--bg-card) 100%);
  pointer-events: none;
  z-index: 1;
}
.news-track { position: relative; height: 100%; }
.news-item {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 10px;
  color: var(--text-2);
  opacity: 0;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  will-change: transform, opacity;
  line-height: 1.5;
}
.news-item::before {
  content: '';
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--purple);
  flex-shrink: 0;
  margin-right: 8px;
}
.news-item.active  { opacity: 1; transform: translateY(0); }
.news-item.exit    { opacity: 0; transform: translateY(-100%); }
.news-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
}
.news-dot {
  height: 2px;
  width: 10px;
  border-radius: 2px;
  background: var(--text-4);
  cursor: pointer;
  transition: background 0.2s, width 0.2s;
}
.news-dot.active { background: var(--purple); width: 18px; }

/* ══════════════════════════════════════════
   KELLY / BACKTEST PANELS
══════════════════════════════════════════ */
.stat-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat-box {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.stat-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}
.stat-note {
  font-size: 8px;
  color: var(--text-3);
  margin-top: 3px;
}

.stat-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

/* ══════════════════════════════════════════
   XAI FEATURES
══════════════════════════════════════════ */
.xai-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
}
.xai-bar-row:last-child { border-bottom: none; }
.xai-name {
  font-size: 10px;
  font-weight: 600;
  width: 100px;
  flex-shrink: 0;
  color: var(--text-1);
}
.xai-track {
  flex: 1;
  height: 5px;
  background: var(--bg-raise);
  border-radius: 5px;
  overflow: hidden;
}
.xai-fill { height: 100%; border-radius: 5px; }
.xai-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.xai-dir {
  font-size: 10px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.xai-note {
  padding: 6px 10px;
  background: rgba(120,100,255,0.04);
  border-left: 2px solid var(--purple);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
  margin-top: 10px;
}

/* ══════════════════════════════════════════
   PAPER TRADING
══════════════════════════════════════════ */
.paper-stats {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 12px 18px;
}
.paper-stat {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.paper-stat-label {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.paper-stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}
.paper-log {
  background: rgba(0,0,0,0.3);
  border-radius: var(--r-md);
  margin: 0 18px 10px;
  padding: 8px 10px;
  height: 100px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  line-height: 1.6;
  color: var(--text-2);
  border: 1px solid var(--border-1);
}
.paper-log div {
  padding: 1px 0;
  border-bottom: 1px solid rgba(255,255,255,0.015);
}
.paper-controls {
  display: flex;
  gap: 6px;
  padding: 0 18px 12px;
}
.paper-btn {
  padding: 5px 12px;
  border-radius: var(--r-sm);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Space Grotesk', sans-serif;
  border: none;
}
.pb-green {
  background: var(--green-dim);
  border: 1px solid rgba(0,245,160,0.2);
  color: var(--green);
}
.pb-green:hover { background: var(--green); color: #07080d; }
.pb-red {
  background: var(--red-dim);
  border: 1px solid rgba(255,64,96,0.2);
  color: var(--red);
}
.pb-red:hover { background: var(--red); color: #07080d; }

.paper-collapse {
  cursor: pointer;
  padding: 2px 0;
  font-size: 8px;
  color: var(--text-3);
  text-align: center;
  user-select: none;
}
.paper-collapse:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   HELP PANEL
══════════════════════════════════════════ */
.help-panel {
  margin-top: 12px;
  background: var(--bg-base);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  padding: 18px;
}
.help-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.help-card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 12px;
}
.help-card-full { grid-column: 1 / -1; }
.help-card-title {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 6px;
}
.help-body {
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}
.help-body ul, .help-body ol { margin: 3px 0; padding-left: 12px; }
.help-body li { margin-bottom: 1px; }
.help-body code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  background: var(--purple-dim);
  padding: 1px 4px;
  border-radius: 2px;
  color: var(--purple);
}
.help-body strong { color: var(--text-1); font-weight: 600; }

/* ══════════════════════════════════════════
   SECURITY CHIPS
══════════════════════════════════════════ */
.sec-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sc-critical { background: rgba(255,64,96,0.12); color: var(--red); border: 1px solid rgba(255,64,96,0.2); }
.sc-high     { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sc-safe     { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.sec-event-text {
  margin-top: 6px;
  padding: 6px 10px;
  background: rgba(255,64,96,0.03);
  border-left: 2px solid var(--red);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border-1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--text-3);
  flex-wrap: wrap;
  gap: 6px;
}
.footer-links { display: flex; gap: 12px; }
.footer-link {
  cursor: pointer;
  transition: color 0.2s;
  font-weight: 500;
}
.footer-link:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   CALIBRATION NOTE
══════════════════════════════════════════ */
.calib-note {
  padding: 6px 8px;
  background: var(--amber-dim);
  border-left: 2px solid var(--amber);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 8px;
  color: var(--text-2);
  margin-top: 8px;
}

/* ══════════════════════════════════════════
   MISC UTILITIES
══════════════════════════════════════════ */
.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mt-4  { margin-top: 4px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.text-center { text-align: center; }
.mono { font-family: 'JetBrains Mono', monospace; }
.text-sm { font-size: 9px; color: var(--text-3); }
.text-xs { font-size: 8px; color: var(--text-3); }

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media (max-width: 1400px) {
  .kpi-row { grid-template-columns: 2fr 1fr 1fr 1fr; }
}
@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .help-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .nav-center { display: none; }
  .main { padding: 12px; }
  .status-band { padding: 6px 12px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .kpi-hero .kpi-num { font-size: 24px; }
  .kpi-num { font-size: 18px; }
  .kpi-hero { grid-column: 1 / -1; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr; }
  .paper-stats { grid-template-columns: repeat(4, 1fr); }
  .help-grid { grid-template-columns: 1fr; }
  .dual-cols { grid-template-columns: 1fr; }
  .stat-3 { grid-template-columns: 1fr 1fr; }
  .sfc-big-num { font-size: 36px; }
  .stat-4 { grid-template-columns: repeat(2, 1fr); }
  .chart-shell canvas { height: 160px !important; }
}
@media (max-width: 480px) {
  .kpi-hero .kpi-num { font-size: 18px; }
  .kpi-num { font-size: 15px; }
  .kpi-row { gap: 6px; }
  .kpi { padding: 10px; }
}

// Fungsi untuk mengambil state dari KV
async function loadUserState() {
  if (!currentUser) return null;
  try {
    const res = await fetch('/user/' + encodeURIComponent(currentUser) + '/state', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const state = await res.json();
    if (paperTrader) {
      paperTrader.capital = state.capital || paperTrader.capital;
      paperTrader.initial = state.initial_capital || paperTrader.initial;
      paperTrader.peakCapital = state.peak_capital || paperTrader.peakCapital;
      paperTrader.positions = state.positions || [];
      paperTrader.trades = state.trades || [];
      paperTrader.equityHistory = state.equity_history || [];
      paperTrader.dailySnapshots = state.daily_snapshots || {};
      paperTrader.userConfig = state.config || {};
      paperTrader.status = (state.positions || []).length > 0 ? 'IN_MARKET' : 'IDLE';
      paperTrader._initialized = true;
      paperTrader._serverStateLoaded = true;
      paperTrader._serverStateLogged = false;
      addPaperLog('👤 Loaded state for ' + currentUser);
      updatePaperDisplay();
    }
    return state;
  } catch (e) {
    console.warn('Multi-user load failed', e);
    return null;
  }
}

// Fungsi untuk menyimpan state ke KV
async function saveUserState() {
  if (!currentUser || !paperTrader) return;
  const pt = paperTrader;
  const state = {
    user_id: currentUser,
    capital: pt.capital,
    initial_capital: pt.initial,
    peak_capital: pt.peakCapital || pt.capital,
    positions: pt.positions,
    trades: (pt.trades || []).slice(-500),
    equity_history: (pt.equityHistory || []).slice(-1000),
    daily_snapshots: pt.dailySnapshots || {},
    config: pt.userConfig || {},
    last_update: new Date().toISOString(),
  };
  try {
    const res = await fetch('/user/' + encodeURIComponent(currentUser) + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state),
    });
    // Silent fail — no need to bother user
  } catch (e) { /* offline — will retry next tick */ }
}

// Fungsi untuk menyimpan konfigurasi
async function saveUserConfig() {
  if (!currentUser || !paperTrader) return;
  const newModal = parseFloat(document.getElementById('userModal')?.value) || 50000;
  const config = {
    modal: newModal,
    max_allocation_pct: parseFloat(document.getElementById('userMaxAlloc')?.value) || 25,
    take_profit_pct: parseFloat(document.getElementById('userTP')?.value) || 0,
    trailing_stop_pct: parseFloat(document.getElementById('userTrail')?.value) || 15,
    stop_loss_pct: parseFloat(document.getElementById('userSL')?.value) || 0,
    risk_per_trade: parseFloat(document.getElementById('userRisk')?.value) || 2,
  };
  paperTrader.userConfig = { ...(paperTrader.userConfig || {}), ...config };

  // If modal changed, reset paper trader with new capital
  if (newModal !== paperTrader.initial) {
    paperTrader = new PaperTrader(newModal);
    paperTrader.userConfig = config;
    updatePaperDisplay();
    addPaperLog('🔄 Capital reset to $' + fmtNum(newModal, 0) + ' — old history cleared');
  }

  await saveUserState();
  addPaperLog('⚙️ Strategy saved: $' + fmtNum(newModal, 0) + ' · TP ' + config.take_profit_pct + '% · SL ' + config.stop_loss_pct + '% · Trail ' + config.trailing_stop_pct + '%');
}

  const canvas = document.getElementById('priceChart');
  if (!canvas) return;
  if (priceChart) priceChart.destroy();

  const labels = historyPoints.map(p => new Date(p.t).toLocaleTimeString());

  const btcGrad = ctx.createLinearGradient(0, 0, 0, 240);

let historyPoints = [];
function loadHistory() {
  try { const s = sessionStorage.getItem('sfc_history'); if (s) historyPoints = JSON.parse(s); } catch(e) {}
}
function pushHistory(btc, floor) {
  // Skip exact duplicates (same btc + same floor as last point)
  const last = historyPoints[historyPoints.length - 1];
  if (last && last.btc === btc && last.floor === floor) return;
  historyPoints.push({ t: Date.now(), btc, floor });
  if (historyPoints.length > 200) historyPoints = historyPoints.slice(-200);
  try { sessionStorage.setItem('sfc_history', JSON.stringify(historyPoints)); } catch(e) {}
}

/* ── NEWS SLIDESHOW ── */
let newsSlideIndex = 0;
let newsSlideTimer = null;
function startNewsSlide() {
  clearInterval(newsSlideTimer);
  const items = document.querySelectorAll('.news-item');
  const dots  = document.querySelectorAll('.news-dot');
  if (!items.length) return;
  function showSlide(i) {
    items.forEach((el, idx) => {
      el.classList.remove('active','exit');
      if (idx === i) el.classList.add('active');
      else if (idx === (i - 1 + items.length) % items.length) el.classList.add('exit');
    });
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    newsSlideIndex = i;
  }
  showSlide(0);
  newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000);
  dots.forEach((d, i) => d.addEventListener('click', () => { clearInterval(newsSlideTimer); showSlide(i); newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000); }));
}

function render(d) {
  currentData = d;
  const sfcEff  = d.sfc_effective || 0;
  const btcChg  = d.btc_24h || 0;
  const agree   = d.method_agreement || 0;
  const conf    = d.composite_confidence || 0.5;
  const rsi     = d.rsi_14 || 50;
  const signal  = d.signal || 'Standard allocation';
  const state   = d.state || 'NORMAL OSCILLATION';

  // Compute ADV regime label with condition context
  const isExtremeFear = (d.fng||50) < 15;
  const hasCascade = (d.cascade_risk||0) > 0.5;
  const advRegime = d.adv_regime || 'BULL';
  let advLabel = advRegime;
  let advDotColor = (advRegime === 'BEAR' || advRegime === 'CRISIS' || advRegime === 'CAPITULATION') ? 'dot-r' : 'dot-g';
  if (isExtremeFear && advRegime === 'BULL') {
    advLabel = 'BULL (CAUTIOUS)';
    advDotColor = 'dot-a';
  } else if (hasCascade && advRegime === 'BULL') {
    advLabel = 'BULL (CASCADE)';
    advDotColor = 'dot-r';
  }
  // Pill reason subtitle
  let pillReason = '';
  if ((d.kelly_fraction||0) <= 0) {
    if (d.kelly_override_reason === 'TRANSITION_RISK_OVER_60') pillReason = 'Transition Risk >60% · Forced CASH';
    else if (isExtremeFear) pillReason = 'FNG ' + d.fng + ' · ' + (d.fng_cls||'EXTREME FEAR');
    else if (hasCascade) pillReason = 'Cascade Risk ' + ((d.cascade_risk||0)*100).toFixed(0) + '%';
    else pillReason = 'No edge';
  } else {
    pillReason = 'Kelly ' + ((d.kelly_fraction||0)*100).toFixed(1) + '%';
  }

  // Determine signal class
  let sigClass = 'sp-watch';
  if ((d.kelly_fraction || 0) > 0 && sfcEff < 25) sigClass = 'sp-buy';
  else if (sfcEff >= 50 || (d.kelly_fraction || 0) <= 0) sigClass = 'sp-cash';

  let topPillClass = 'pill-watch', topPillText = 'WATCH';
  if (sigClass === 'sp-buy')  { topPillClass = 'pill-buy';  topPillText = 'BUY'; }
  else if (sigClass === 'sp-cash') { topPillClass = 'pill-cash'; topPillText = 'CASH'; }

  const regimeColor = d.regime === 'CAPITULATION' ? 'var(--red)' : d.regime === 'STRESS' ? 'var(--amber)' : 'var(--green)';
  const liqLabel = d.liq_pressure === 'LONG_SQUEEZE' ? 'Long Squeeze' : d.liq_pressure === 'SHORT_SQUEEZE' ? 'Short Squeeze' : 'Balanced';
  const liqColor = d.liq_pressure === 'LONG_SQUEEZE' ? 'var(--red)' : d.liq_pressure === 'SHORT_SQUEEZE' ? 'var(--green)' : 'var(--amber)';

  // Gauges
  const rsiCirc = 2 * Math.PI * 38;
  const rsiOff  = rsiCirc * (1 - rsi / 100);
  const rsiColor = rsi >= 70 ? 'var(--red)' : rsi <= 30 ? 'var(--green)' : 'var(--amber)';

  var el = document.getElementById('regimeDisplay_xyz');

    el.style.color = val === 'CAPITULATION' ? 'var(--red)' : val === 'STRESS' ? 'var(--amber)' : 'var(--green)';

}, 200);

async function fetchPaperTrackRecord() {
  try {
    const r = await fetch('paper_history.json?t=' + Date.now(), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const cur = data.current || {};
    const el = id => document.getElementById(id);
    if (el('paperEquity')) {
      el('paperEquity').textContent = '$' + fmtNum(cur.equity || 50000, 2);
      el('paperEquity').style.color = (cur.total_return || 0) >= 0 ? 'var(--green)' : 'var(--red)';
    }
    if (el('paperReturn')) {
      el('paperReturn').textContent = (cur.total_return_pct || 0).toFixed(2) + '%';
      el('paperReturn').style.color = (cur.total_return_pct || 0) >= 0 ? 'var(--green)' : 'var(--red)';
    }
    if (el('paperSharpe')) el('paperSharpe').textContent = (cur.sharpe || 0).toFixed(2);
    if (el('paperSharpe')) el('paperSharpe').style.color = cur.sharpe > 1.5 ? 'var(--green)' : cur.sharpe > 0.5 ? 'var(--amber)' : 'var(--red)';
    if (el('paperWinRate')) el('paperWinRate').textContent = (cur.win_rate_pct || 0).toFixed(0) + '%';
    if (el('paperWinRate')) el('paperWinRate').style.color = (cur.win_rate_pct || 0) > 60 ? 'var(--green)' : 'var(--amber)';
    if (el('paperDD')) el('paperDD').textContent = (cur.max_dd_pct || 0).toFixed(1) + '%';
    if (el('paperDD')) el('paperDD').style.color = (cur.max_dd_pct || 0) < 10 ? 'var(--green)' : (cur.max_dd_pct || 0) < 20 ? 'var(--amber)' : 'var(--red)';
    if (el('paperPnL')) {
      const pnl = cur.unrealized_pnl || 0;
      el('paperPnL').textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
      el('paperPnL').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    }
    if (el('paperTradeCount')) el('paperTradeCount').textContent = cur.total_trades || 0;

    // Track record text
    const days = data.daily ? data.daily.length : 0;
    let recordHtml = '<span style="color:var(--text-2)">Server-side paper trader</span>';
    if (data.daily && data.daily.length >= 1) {
      const first = data.daily[0];
      const last = data.daily[data.daily.length - 1];
      recordHtml += '<br><span style="color:var(--text-2)">' + days + ' day' + (days>1?'s':'') + ' tracked &middot; ';
      recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
      recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
    }
    if (el('paperTrackRecord')) el('paperTrackRecord').innerHTML = recordHtml;
    if (el('paperLastUpdate')) el('paperLastUpdate').textContent = new Date().toLocaleTimeString();
    return data;
  } catch (e) {
    const el = document.getElementById('paperTrackRecord');
    if (el) el.innerHTML = '<span style="color:var(--text-3)">Server track record not available yet</span>';
    return null;
  }
}

/* ── SSE CONNECTION ── */
let sseSource = null;
let sseReconnectTimer = null;

function startSSE() {
  // Close existing connection if any
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  if (sseReconnectTimer) {
    clearTimeout(sseReconnectTimer);
    sseReconnectTimer = null;
  }

  try {
    sseSource = new EventSource('/events');

    sseSource.addEventListener('btc_ticker', function(e) {
      try {
        const data = JSON.parse(e.data);
        partialUpdate(data);
      } catch (err) {
        console.log('[SSE] btc_ticker parse error:', err);
      }
    });

    sseSource.addEventListener('sfc_update', function(e) {
      try {
        const data = JSON.parse(e.data);
        if (data.btc != null || data.sfc_effective != null) {
          // Merge BTC ticker data from btc_ticker event into sfc data
          // to avoid stale BTC in the full render
          if (currentData) {
            Object.assign(data, { btc: data.btc || currentData.btc });
          }
          currentData = data;
          render(data);
          startNewsSlide();
          // Restore config panel after SSE render
          if (currentUser && paperTrader) {
            loadConfigToForm(paperTrader.userConfig || {});
            updatePaperDisplay();
          }
        }
      } catch (err) {
        console.log('[SSE] sfc_update parse error:', err);
      }
    });

    sseSource.onerror = function() {
      console.log('[SSE] Connection lost — will retry');
      if (sseSource) {
        sseSource.close();
        sseSource = null;
      }
      // Reconnect after 5s
      sseReconnectTimer = setTimeout(startSSE, 5000);
    };
  } catch (e) {
    console.log('[SSE] Failed to create EventSource:', e);
    // Fallback: start polling after a delay
    sseReconnectTimer = setTimeout(startSSE, 10000);
  }
}

async function fetchLiveData() {

    // Restore exact scroll position (not activeTab section)

    console.log('Fetch failed:', e);
    return false;
  }
}

const PAPER_INITIAL_CAPITAL = 50000;
const PAPER_MAX_POSITION_PCT = 0.25;

class PaperTrader {
  constructor(capital = PAPER_INITIAL_CAPITAL, state = null) {
    if (state) {
      // Load from server state
      this.capital = state.capital || capital;
      this.initial = state.initial_capital || capital;
      this.peakCapital = state.peak_capital || capital;
      this.positions = state.positions || [];
      this.trades = state.trades || [];
      this.equityHistory = state.equity_history || [];
      this.dailySnapshots = state.daily_snapshots || {};
      this._initialized = true;
      this._serverStateLoaded = true;
      this._serverStateLogged = false;
    } else {
      this.capital = capital;
      this.initial = capital;
      this.peakCapital = capital;
      this.positions = [];        // open positions [{type,entry_price,size,entry_date,reason,sfc_at_entry,confidence_at_entry}]
      this.trades = [];            // all trades [{id,type,date,price,size,...}]
      this.equityHistory = [];     // [{ts,btc,equity,capital,unrealized}]
      this.dailySnapshots = {};    // date -> {equity,return_pct,sharpe,win_rate,max_dd_pct,total_trades,open_positions,status}
      this._initialized = false;
      this._serverStateLoaded = false;
    }
    this.status = this.positions.length > 0 ? 'IN_MARKET' : 'IDLE';
    this._lastSignalTs = 0;
    this._unrealized = 0;
    this._trailingStopTriggered = false;
  }

  evaluateSignal(d) {
    const sfc = (d.sfc_effective || 0) / 100;
    const conf = d.composite_confidence || 0.3;
    const kelly = d.kelly_fraction || 0;
    const fng = d.fng || 50;
    const cascade = d.cascade_risk || 0;
    const regime = d.regime || 'NORMAL';
    const zone = d.zone || 'NORMAL';
    const btc = d.btc || 0;
    const signalType = d.signal_type || 'CALM';

    const isExtremeFear = fng < 15;
    const hasCascade = cascade > 0.5;

    let action, reason;
    if (kelly <= 0) {
      action = 'CASH';
      reason = 'No edge';
      if (d.kelly_override_reason === 'TRANSITION_RISK_OVER_60') reason = 'Transition Risk >60% · Forced CASH';
      else if (isExtremeFear) reason = `FNG ${fng} · Extreme Fear`;
      else if (hasCascade) reason = `Cascade Risk ${(cascade*100).toFixed(0)}%`;
    } else if (sfc < 0.25 && conf > 0.15) {
      action = 'BUY';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Conf ${(conf*100).toFixed(0)}%`;
    } else if (sfc >= 0.45) {
      action = 'CASH';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Stress too high`;
    } else {
      action = 'HOLD';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Neutral zone`;
    }

    let sizePct = 0;
    if (action === 'BUY') {
      sizePct = Math.min(kelly, PAPER_MAX_POSITION_PCT);
      sizePct *= Math.min(conf * 2, 1.0);
    }

    const size = Math.round(this.capital * sizePct * 100) / 100;

    return {
      action,
      size: action === 'BUY' ? size : 0,
      reason,
      btc_price: btc,
      sfc_pct: Math.round(sfc * 1000) / 10,
      confidence: Math.round(conf * 100),
      kelly_pct: Math.round(kelly * 1000) / 10,
      regime,
      zone,
      signal_type: signalType,
    };
  }

  execute(decision) {
    const price = decision.btc_price || 0;
    if (!price || price <= 0) return;

    // Get user's TP/SL config
    const tpPct = (this.userConfig?.take_profit_pct || 0) / 100;
    const slPct = (this.userConfig?.stop_loss_pct || 0) / 100;

    // Check TAKE PROFIT for each position
    if (tpPct > 0 && this.positions.length > 0) {
      const tpTarget = this.positions[0].entry_price * (1 + tpPct);
      if (price >= tpTarget) {
        this._closeAllPositions(price, 'Take Profit ' + (tpPct * 100).toFixed(0) + '% · Hit $' + Math.round(price));
      }
    }

    // Check STOP LOSS for each position
    if (slPct > 0 && this.positions.length > 0) {
      const slTarget = this.positions[0].entry_price * (1 - slPct);
      if (price <= slTarget) {
        this._closeAllPositions(price, 'Stop Loss ' + (slPct * 100).toFixed(0) + '% · Hit $' + Math.round(price));
      }
    }

    // Close positions if signal says CASH and we have positions
    if (decision.action === 'CASH' && this.positions.length > 0) {
      this._closeAllPositions(price, 'Signal CASH');
    }

    // Open new position if signal says BUY and we're flat
    if (decision.action === 'BUY' && this.positions.length === 0 && decision.size >= 10) {
      this._openPosition(decision.size, price, decision);
    }

    // Update PnL for reporting
    this._updatePnL(price);
    this._updatePeak();
    // Trailing stop check — uses user's configured trailing stop %
    this._checkTrailingStop(price);
    this._dailySnapshot();
  }

  _openPosition(size, price, decision) {
    this.positions.push({
      type: 'LONG',
      entry_price: price,
      highest_price: price,
      size: size,
      entry_date: new Date().toISOString(),
      reason: decision.reason || '',
      sfc_at_entry: decision.sfc_pct,
      confidence_at_entry: decision.confidence,
    });
    this.capital -= size;
    this.trades.push({
      id: this.trades.length + 1,
      type: 'OPEN',
      date: new Date().toISOString(),
      price: price,
      size: size,
      reason: decision.reason || '',
    });
    this.status = 'IN_MARKET';
  }

  _closeAllPositions(price, reason) {
    for (const pos of this.positions) {
      const pnl = (price - pos.entry_price) / pos.entry_price * pos.size;
      this.capital += pos.size + pnl;
      this.trades.push({
        id: this.trades.length + 1,
        type: 'CLOSE',
        date: new Date().toISOString(),
        price: price,
        size: pos.size,
        pnl: Math.round(pnl * 100) / 100,
        pnl_pct: Math.round((price - pos.entry_price) / pos.entry_price * 10000) / 100,
        reason: reason,
      });
    }
    this.positions = [];
    this.status = 'IDLE';
  }

  _checkTrailingStop(price) {
    const TRAILING_PCT = (this.userConfig?.trailing_stop_pct || 15) / 100; // From user config, default 15%
    const toClose = [];
    for (const pos of this.positions) {
      // Update highest price seen
      if (price > pos.highest_price) {
        pos.highest_price = price;
      }
      // Check if price dropped from peak
      const dropPct = (pos.highest_price - price) / pos.highest_price;
      if (dropPct >= TRAILING_PCT) {
        toClose.push(pos);
      }
    }
    if (toClose.length > 0) {
      this._trailingStopTriggered = true;
      this._closeAllPositions(price, `Trailing Stop ${(TRAILING_PCT*100).toFixed(0)}% · Drop ${Math.round(toClose[0].highest_price)}→${Math.round(price)}`);
    }
  }

  _updatePnL(price) {
    let unrealized = 0;
    for (const pos of this.positions) {
      if (pos.type === 'LONG') {
        unrealized += (price - pos.entry_price) / pos.entry_price * pos.size;
      }
    }
    this._unrealized = unrealized;
    const equity = this.capital + this.positions.reduce((s,p) => s + p.size, 0) + unrealized;
    this.equityHistory.push({
      ts: new Date().toISOString(),
      btc: price,
      equity: Math.round(equity * 100) / 100,
      capital: Math.round(this.capital * 100) / 100,
      unrealized: Math.round(unrealized * 100) / 100,
    });
    return equity;
  }

  // Real-time PnL update — no new history entry, just updates the last one
  _updatePnLRealtime(price) {
    if (this.positions.length === 0) return this.capital;
    let unrealized = 0;
    for (const pos of this.positions) {
      if (pos.type === 'LONG') {
        unrealized += (price - pos.entry_price) / pos.entry_price * pos.size;
      }
    }
    this._unrealized = unrealized;
    const equity = this.capital + this.positions.reduce((s,p) => s + p.size, 0) + unrealized;
    const rounded = Math.round(equity * 100) / 100;
    // Update the last history entry in-place
    if (this.equityHistory.length > 0) {
      const last = this.equityHistory[this.equityHistory.length - 1];
      last.btc = price;
      last.equity = rounded;
      last.unrealized = Math.round(unrealized * 100) / 100;
    }
    return equity;
  }

  _updatePeak() {
    const equity = this.getEquity();
    if (equity > this.peakCapital) this.peakCapital = equity;
  }

  _dailySnapshot() {
    const today = new Date().toISOString().slice(0, 10);
    const perf = this.getPerformance();
    this.dailySnapshots[today] = {
      date: today,
      equity: Math.round(perf.equity * 100) / 100,
      return_pct: Math.round(perf.total_return * 10000) / 100,
      sharpe: Math.round(perf.sharpe * 100) / 100,
      win_rate: Math.round(perf.win_rate * 10000) / 10000,
      max_dd_pct: Math.round(perf.max_dd * 10000) / 100,
      total_trades: perf.total_trades,
      open_positions: this.positions.length,
      status: this.positions.length > 0 ? 'IN_MARKET' : 'CASH',
    };
  }

  getEquity() {
    if (this.positions.length === 0) return this.capital;
    return this.equityHistory.length > 0 ? this.equityHistory[this.equityHistory.length - 1].equity : this.capital;
  }

  getPerformance() {
    const equity = this.getEquity();
    const totalReturn = (equity - this.initial) / this.initial;

    const closed = this.trades.filter(t => t.pnl !== undefined);
    const wins = closed.filter(t => t.pnl > 0);
    const winRate = closed.length > 0 ? wins.length / closed.length : 0;

    // Sharpe from equity history — only meaningful with 2+ entries
    const rets = [];
    if (this.equityHistory.length >= 2) {
      for (let i = 1; i < this.equityHistory.length; i++) {
        const prev = this.equityHistory[i - 1].equity;
        const cur = this.equityHistory[i].equity;
        if (prev > 0) rets.push((cur - prev) / prev);
      }
    }
    const mean = rets.length > 0 ? rets.reduce((a, b) => a + b, 0) / rets.length : 0;
    const std = rets.length > 1 ? Math.sqrt(rets.map(r => (r - mean) ** 2).reduce((a, b) => a + b, 0) / rets.length) : 1;
    const sharpe = std > 0 && rets.length > 1 ? mean / std * Math.sqrt(252) : 0;

    // Max drawdown
    let mdd = 0;
    let peak = this.initial;
    for (const h of this.equityHistory) {
      const eq = h.equity;
      if (eq > peak) peak = eq;
      const dd = peak > 0 ? (peak - eq) / peak : 0;
      if (dd > mdd) mdd = dd;
    }

    return {
      initial_capital: this.initial,
      capital: Math.round(this.capital * 100) / 100,
      equity: Math.round(equity * 100) / 100,
      peak_equity: Math.round(this.peakCapital * 100) / 100,
      total_return: Math.round(totalReturn * 10000) / 10000,
      total_return_pct: Math.round(totalReturn * 10000) / 100,
      sharpe: Math.round(sharpe * 100) / 100,
      win_rate: Math.round(winRate * 10000) / 10000,
      win_rate_pct: Math.round(winRate * 10000) / 100,
      max_dd: Math.round(mdd * 10000) / 10000,
      max_dd_pct: Math.round(mdd * 10000) / 100,
      total_trades: this.trades.length,
      closed_trades: closed.length,
      open_positions: this.positions.length,
      unrealized_pnl: Math.round((this._unrealized || 0) * 100) / 100,
      status: this.positions.length > 0 ? 'IN_MARKET' : 'CASH',
    };
  }
}

let paperTrader = null;

async function initPaperTrading() {
  // Multi-user mode: load from KV
  if (currentUser) {
    try {
      const res = await fetch('/user/' + encodeURIComponent(currentUser) + '/state', { cache: 'no-cache' });
      if (res.ok) {
        const kvState = await res.json();
        // Create PaperTrader FROM KV state — preserves user's own trades/positions
        const kvCapital = kvState.capital || PAPER_INITIAL_CAPITAL;
        paperTrader = new PaperTrader(kvCapital, {
          capital: kvState.capital,
          peak_capital: kvState.peak_capital,
          positions: kvState.positions,
          trades: kvState.trades,
          equity_history: kvState.equity_history,
          daily_snapshots: kvState.daily_snapshots,
        });
        paperTrader.userConfig = kvState.config || {};

        // Validate equity_history — if first entry doesn't match capital, clear it
        // (legacy data from before multi-user fix, see Q8 implementation)
        if (paperTrader.equityHistory.length > 0) {
          const firstEq = paperTrader.equityHistory[0].equity;
          if (Math.abs(firstEq - kvCapital) > 1) {
            paperTrader.equityHistory = [];
            paperTrader.dailySnapshots = {};
          }
        }

        // Patch for auto-save
        const origExecute = paperTrader.execute;
        const origCloseAll = paperTrader.closeAll;
        paperTrader.execute = function(decision, price) {
          const result = origExecute.call(this, decision, price);
          saveUserState().catch(() => {});
          return result;
        };
        paperTrader.closeAll = function(price, reason) {
          const result = origCloseAll.call(this, price, reason);
          saveUserState().catch(() => {});
          return result;
        };

        loadConfigToForm(paperTrader.userConfig || {});
        addPaperLog('👤 Multi-user: loaded state for ' + currentUser);
        return;
      }
    } catch (e) {
      console.warn('KV load failed, falling back', e);
    }
  }

  // Fallback: server-side paper_trades.json (single-user VPS mode)
  try {
    const r = await fetch('paper_trades.json?t=' + Date.now(), { cache: 'no-cache' });
    if (r.ok) {
      const state = await r.json();
      paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL, state);
      return;
    }
  } catch (e) {}
  paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL);
}

function processSignalFromSFC(d) {
  if (!paperTrader) return;

  // Restore paper log if render() wiped it — check if only placeholder remains
  const _log = document.getElementById('paperLog');
  if (_log && _log.children.length <= 1 && paperTrader._initialized) {
    _log.innerHTML = '';
    // Allow server state logging to re-run if it was already logged
    if (paperTrader._serverStateLoaded) {
      paperTrader._serverStateLogged = false;
    } else {
      addPaperLog('🟢 Paper trading initialized with $50,000 capital');
      addPaperLog('⏳ Waiting for first trade signal from SFC...');
    }
  }

  // Log server state on first processSignalFromSFC after server-load
  if (paperTrader._serverStateLoaded && !paperTrader._serverStateLogged) {
    paperTrader._serverStateLogged = true;
    const l = document.getElementById('paperLog');
    if (l) {
      l.innerHTML = '';
      addPaperLog('🟢 Paper trading — loaded server state');
      if (paperTrader.positions.length > 0) {
        const p = paperTrader.positions[0];
        addPaperLog(`🟢 [OPEN] LONG $${fmtNum(p.size,2)} at $${fmtNum(p.entry_price,2)} — ${p.reason}`);
      }
      const dayCount = Object.keys(paperTrader.dailySnapshots).length;
      addPaperLog(`📊 Day ${dayCount || 1} tracked · Equity: $${fmtNum(paperTrader.getEquity(), 2)}`);
    }
    updatePaperDisplay();
  }

  // First-call init: seed equityHistory so subsequent calls work
  if (!paperTrader._initialized) {
    paperTrader._initialized = true;
    paperTrader.equityHistory.push({
      ts: new Date().toISOString(),
      btc: d.btc || 0,
      equity: paperTrader.capital,
      capital: paperTrader.capital,
      unrealized: 0,
    });
    updatePaperDisplay();
    addPaperLog('🟢 Paper trading initialized with $50,000 capital');
    addPaperLog('⏳ Waiting for first trade signal from SFC...');
    return;
  }

  // 5s debounce — avoid double-processing when BTC+SFC arrive near-simultaneously
  const now = Date.now();
  if (now - paperTrader._lastSignalTs < 5000) return;
  paperTrader._lastSignalTs = now;

  // Evaluate signal (mirrors paper_trader.py evaluate_signal)
  const decision = paperTrader.evaluateSignal(d);

  // Execute trade decision (mirrors paper_trader.py execute)
  const tradesBefore = paperTrader.trades.length;
  paperTrader.execute(decision);

  // Log any trades that happened
  if (paperTrader.trades.length > tradesBefore) {
    const lastTrade = paperTrader.trades[paperTrader.trades.length - 1];
    if (lastTrade.type === 'OPEN') {
      addPaperLog(`🟢 [OPEN] LONG $${fmtNum(decision.size,0)} at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
    } else if (lastTrade.type === 'CLOSE') {
      if (lastTrade.reason && lastTrade.reason.startsWith('Trailing Stop')) {
        addPaperLog(`🔴 [TRAILING STOP] $${fmtNum(decision.btc_price,0)} — ${lastTrade.reason}`);
      } else {
        addPaperLog(`🔴 [CLOSE] All at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
      }
    }
    // Auto-save to KV after any trade
    if (currentUser) saveUserState().catch(() => {});
  } else if (decision.action === 'HOLD' && paperTrader.positions.length === 0 && Math.random() < 0.05) {
    addPaperLog(`👀 Watching — ${decision.reason}`);
  }

  updatePaperDisplay();
}

function updatePaperDisplay(perf) {
  if (!paperTrader) return;
  if (!perf) perf = paperTrader.getPerformance();
  const el = id => document.getElementById(id);
  if (!el('paperEquity')) return;

  el('paperEquity').textContent = '$' + fmtNum(perf.equity, 2);
  el('paperEquity').style.color = perf.total_return >= 0 ? 'var(--green)' : 'var(--red)';
  el('paperReturn').textContent = perf.total_return_pct.toFixed(2) + '%';
  el('paperReturn').style.color = perf.total_return >= 0 ? 'var(--green)' : 'var(--red)';
  el('paperSharpe').textContent = perf.sharpe.toFixed(2);
  el('paperSharpe').style.color = perf.sharpe > 1.5 ? 'var(--green)' : perf.sharpe > 0.5 ? 'var(--amber)' : 'var(--red)';
  el('paperWinRate').textContent = perf.win_rate_pct.toFixed(0) + '%';
  el('paperWinRate').style.color = perf.win_rate_pct > 60 ? 'var(--green)' : 'var(--amber)';
  el('paperDD').textContent = perf.max_dd_pct.toFixed(1) + '%';
  el('paperDD').style.color = perf.max_dd_pct < 10 ? 'var(--green)' : perf.max_dd_pct < 20 ? 'var(--amber)' : 'var(--red)';
  if (el('paperPnL')) {
    const pnl = perf.unrealized_pnl || 0;
    el('paperPnL').textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
    el('paperPnL').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
  }
  el('paperTradeCount').textContent = perf.total_trades;

  const ps = document.getElementById('paperStatus');
  if (ps) ps.textContent = perf.open_positions > 0 ? '● IN MARKET' : '● CASH';
  if (el('paperLastUpdate')) el('paperLastUpdate').textContent = new Date().toLocaleTimeString();

  // Track record text from server-backed state
  const dailyKeys = Object.keys(paperTrader.dailySnapshots).sort();
  let recordHtml = '<span style="color:var(--text-2)">Server-backed paper trader</span>';
  if (dailyKeys.length >= 1) {
    const first = paperTrader.dailySnapshots[dailyKeys[0]];
    const last = paperTrader.dailySnapshots[dailyKeys[dailyKeys.length - 1]];
    recordHtml += '<br><span style="color:var(--text-2)">' + dailyKeys.length + ' day' + (dailyKeys.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else if (paperTrader.equityHistory.length > 0) {
    const first = paperTrader.equityHistory[0];
    const last = paperTrader.equityHistory[paperTrader.equityHistory.length - 1];
    recordHtml += '<br><span style="color:var(--text-2)">' + paperTrader.equityHistory.length + ' tick' + (paperTrader.equityHistory.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else {
    recordHtml += '<br><span style="color:var(--text-2)">Initialized &middot; Capital: $' + fmtNum(paperTrader.capital, 2) + '</span>';
  }
  if (el('paperTrackRecord')) el('paperTrackRecord').innerHTML = recordHtml;
}

function addPaperLog(msg) {
  const log = document.getElementById('paperLog');
  if (!log) return;
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
}

function resetPaperTrading() {
  paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL);
  const log = document.getElementById('paperLog');
  if (log) log.innerHTML = '<div>🟢 Paper trading reset to $' + PAPER_INITIAL_CAPITAL.toLocaleString() + ' capital</div>';
  updatePaperDisplay();
  // Reset KV state for multi-user
  if (currentUser) {
    paperTrader.userConfig = {};
    saveUserState().catch(() => {});
    addPaperLog('💾 KV state reset saved');
  }
}

function exportPaperTrades() {
  if (!paperTrader || paperTrader.trades.length === 0) { addPaperLog('⚠ No trades to export'); return; }
  const blob = new Blob([JSON.stringify(paperTrader.trades, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'sfc_paper_trades_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  addPaperLog('📥 Exported ' + paperTrader.trades.length + ' trades');
}

function manualBuy() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length > 0) { addPaperLog('⚠ Already have an open position. Close it first or wait.'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  // Get buy amount: user input or from config's max_allocation_pct
  const amountInput = document.getElementById('manualBuyAmount');
  let size = 0;
  if (amountInput?.value && parseFloat(amountInput.value) > 0) {
    size = parseFloat(amountInput.value);
  } else {
    const allocPct = (paperTrader.userConfig?.max_allocation_pct || 25) / 100;
    size = Math.round(paperTrader.capital * allocPct * 100) / 100;
  }

  // Cap at available capital
  size = Math.min(size, paperTrader.capital);
  if (size < 10) { addPaperLog('⚠ Insufficient capital (min $10)'); return; }

  const decision = {
    reason: 'Manual Buy',
    btc_price: price,
    sfc_pct: currentData?.sfc_effective || 0,
    confidence: currentData?.composite_confidence || 0,
  };

  paperTrader._openPosition(size, price, decision);
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🟢 [MANUAL BUY] LONG $${fmtNum(size,0)} at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Clear the input
  if (amountInput) amountInput.value = '';

  // Save to KV
  if (currentUser) saveUserState().catch(() => {});
}

function manualCloseAll() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length === 0) { addPaperLog('⚠ No open positions to close'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  paperTrader._closeAllPositions(price, 'Manual Close');
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🔴 [MANUAL CLOSE] All at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Save to KV
  if (currentUser) saveUserState().catch(() => {});
}

// Load initial data from SSE snapshot — full render ONCE
let _sseAvailable = false;

async function bootSFC() {
  // Init paper trader from server state BEFORE render
  await initPaperTrading();

  // PRIORITY 1: Render from embedded data INSTANTLY (no network wait)
  if (typeof __EMBEDDED_DATA !== 'undefined' && __EMBEDDED_DATA) {
    currentData = __EMBEDDED_DATA;
    render(__EMBEDDED_DATA);
  } else if (window.__EMBEDDED_DATA) {
    currentData = window.__EMBEDDED_DATA;
    render(window.__EMBEDDED_DATA);
  }

  // PRIORITY 2: Try /snapshot in background for SSE connection
  // (embedded data already rendered, so user sees dashboard immediately)
  let initial = null;
  try {
    const r = await fetch('/snapshot');
    if (r.ok) initial = await r.json();
  } catch (e) { /* snapshot not available */ }

  if (initial && (initial.sfc || initial.btc)) {
    _sseAvailable = true;  // SSE server detected
    const merged = Object.assign({}, initial.sfc || {}, {
      btc: initial.btc?.btc ?? initial.sfc?.btc,
      btc_24h: initial.btc?.change_pct ?? initial.sfc?.btc_24h,
    });
    currentData = merged;
    render(merged);
  } else if (!currentData) {
    // No embedded data AND no snapshot — fallback fetch data.json
    await fetchLiveData();
  }

  // Ensure config panel visible and values set after any render path
  setTimeout(function() {
    if (currentUser && paperTrader) {
      loadConfigToForm(paperTrader.userConfig || {});
      updatePaperDisplay();
    }
  }, 200);
  setTimeout(startNewsSlide, 100);
  setTimeout(restoreScrollPos, 200);
  // Start SSE only if server was detected (/snapshot responded)
  if (_sseAvailable) {
    startSSE();
  } else {
    // No SSE server — fall back to polling data.json every 30s
    setInterval(fetchLiveData, 30000);
  }
}
bootSFC();

// SSE handles real-time updates when available.
// On static (GitHub Pages / Workers), polling data.json every 30s is used instead.

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW failed:', e));
  // When a new SW takes over, force a reload to pick up fresh index.html —
  // otherwise the page is stuck on the old cached HTML until next manual refresh.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (navigator.serviceWorker.controller) {
      console.log('[SW] New controller — reloading');
      window.location.reload();
    }
  });
}
</script>
</body>
</html>
