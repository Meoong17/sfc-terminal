<!DOCTYPE html>
<html lang="en">
<head>

<title>SFC Terminal — Quantitative Stress Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

  :root {
    --bg: #0a0d14; --panel: #10141d; --panel-2: #141924; --border: #1f2531;
    --text: #e6e9ef; --muted: #8b93a5; --green: #2ecc71; --red: #e74c3c;
    --yellow: #f1c40f; --orange: #e67e22; --blue: #3498db; --purple: #7c5cff;
  }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:400; src:url(fonts/Inter-Regular.woff2) format("woff2"); font-display:swap; }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:500; src:url(fonts/Inter-Medium.woff2) format("woff2"); font-display:swap; }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:600; src:url(fonts/Inter-SemiBold.woff2) format("woff2"); font-display:swap; }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:700; src:url(fonts/Inter-Bold.woff2) format("woff2"); font-display:swap; }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:800; src:url(fonts/Inter-Bold.woff2) format("woff2"); font-display:swap; }
  * { box-sizing: border-box; }
  html, body { overflow-x: auto; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px; font-feature-settings:"cv11","ss01"; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  /* Numeric values use tabular figures so digits align vertically (fintech standard) */
  .stat-val, .exec-big, .exec-mid, .gauge-big, .cs-value-big, .cs-value,
  .li-value, .flow-change, .badge-value, .mo-price, .kv-row b, .bar-track,
  .prog-fill { font-variant-numeric: tabular-nums; }

  /* ---- entrance + micro-animations ----
     Gated behind #app.anim: the class is present only on initial load and tab
     switches. Background updates (sfc_update every ~5 min, btc_ticker every ~1s)
     render WITHOUT .anim so cards swap instantly with no fade/blink. */
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  @keyframes barGrow { from { width:0 !important; } }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes ringIn { from { stroke-dashoffset:var(--ring-max);} }
  @keyframes countGlow { 0%{ opacity:.4;} 100%{ opacity:1;} }
  #app.anim .card { animation:fadeUp .45s ease both; }
  #app.anim .prog-fill { animation:barGrow .9s cubic-bezier(.25,.8,.25,1) both; }
  #app.anim .tab-panel.active { animation:fadeUp .35s ease; }
  .live-dot, .market-open .dot { animation:pulse 2.4s ease-in-out infinite; }
  .card:hover { box-shadow:0 0 0 1px rgba(124,92,255,.25), 0 8px 30px rgba(0,0,0,.35); border-color:rgba(124,92,255,.4); }
  .card { transition:box-shadow .25s ease, border-color .25s ease, transform .2s ease; }
  .nav-item { transition:background .15s ease,color .15s ease; }
  .tab { transition:color .15s ease,border-color .2s ease; }
  .layout { display:flex; min-height:100vh; min-width:1180px; }

  /* Sidebar */
  .sidebar { width:200px; background:var(--panel); border-right:1px solid var(--border);
    padding:18px 12px; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:8px; padding:4px 8px 18px; }
  .brand-mark { font-size:22px; color:var(--purple); }
  .brand-name { font-weight:700; font-size:17px; letter-spacing:.5px; }
  .brand-sub { font-size:9px; color:var(--muted); letter-spacing:1px; margin-left:30px; margin-top:-6px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:var(--muted); cursor:pointer; margin-bottom:2px; font-size:12.5px; user-select:none; }
  .nav-item.active { background:linear-gradient(90deg,rgba(124,92,255,0.18),transparent);
    color:var(--text); border-left:2px solid var(--purple); }
  .nav-item:hover { background:rgba(124,92,255,0.08); color:var(--text); }
  .nav-ic { width:18px; display:flex; align-items:center; justify-content:center; opacity:.9; color:var(--muted); }
  .nav-item.active .nav-ic { color:var(--purple); opacity:1; }
  .sidebar-foot { margin-top:24px; padding-top:14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }
  .live-dot { color:var(--green); }

  /* Main */
  .main { flex:1; min-width:0; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px; border-bottom:1px solid var(--border); }
  .topbar-left { display:flex; align-items:baseline; gap:10px; }
  .topbar-title { font-size:17px; font-weight:700; }
  .topbar-sub { font-size:12px; color:var(--muted); }
  .topbar-right { display:flex; gap:20px; align-items:center; font-size:12px; color:var(--muted); }
  .tb-date { display:flex; align-items:center; gap:6px; }
  .market-open { color:var(--green); display:flex; align-items:center; gap:6px; }
  .market-open .dot { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; }

  .tabs { display:flex; gap:4px; padding:0 26px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { padding:12px 12px; color:var(--muted); font-size:11.5px; letter-spacing:.4px;
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; user-select:none; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); border-bottom-color:var(--purple); font-weight:600; }

  .badges { display:flex; flex-wrap:wrap; gap:10px; padding:16px 26px 4px; }
  .badge { background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:11.5px; display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .badge-label { color:var(--muted); }
  .badge-value { font-weight:700; }

  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .grid { display:grid; gap:14px; padding:14px 26px; }
  .grid-1-1-1 { grid-template-columns:1.5fr 1.2fr 1fr 1.1fr; }
  .grid-2 { grid-template-columns:2.1fr 1fr; }
  .grid-3 { grid-template-columns:1.3fr 1.1fr 1.2fr 1.1fr; }
  .grid-4 { grid-template-columns:1.6fr 1fr 1.1fr 1fr; }

  .card { background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .card-title { font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.6px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .card-title a { color:var(--purple); text-decoration:none; font-weight:600; }

  /* Executive summary */
  .exec-row { display:flex; gap:26px; flex-wrap:wrap; }
  .exec-col { min-width:90px; }
  .exec-label { color:var(--muted); font-size:11px; margin-bottom:4px; }
  .exec-big { font-size:26px; font-weight:800; color:var(--green); }
  .exec-mid { font-size:22px; font-weight:800; color:var(--green); }
  .exec-action { font-size:20px; font-weight:800; color:var(--yellow); }
  .bar-track { width:90px; height:5px; background:#232a38; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--green); border-radius:3px; }
  .exec-note { color:var(--muted); font-size:11.5px; margin-top:10px; }
  .exec-updated { color:var(--muted); font-size:10.5px; margin-top:14px; }

  /* AI analyst */
  .ai-beta { background:var(--purple); color:#fff; font-size:9px; padding:1px 6px; border-radius:4px; margin-left:6px; }
  .ai-bias { font-weight:700; margin-bottom:6px; }
  .ai-summary { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .ai-check { font-size:11.5px; color:#b7e4c7; margin-bottom:6px; }
  .ai-link { color:var(--purple); font-size:11.5px; margin-top:6px; }
  .ai-llm-label { color:var(--purple); font-size:10px; font-weight:700; letter-spacing:.5px; margin-bottom:4px; }
  .ai-llm-bias { font-weight:700; font-size:14px; margin-bottom:6px; }
  .ai-llm-summary { color:var(--muted); font-size:11.5px; line-height:1.55; margin-bottom:10px; }
  .ai-llm-risk { font-size:11px; color:var(--text); margin-bottom:6px; line-height:1.45; }
  .ai-llm-risk b { color:var(--yellow); }
  .ai-llm-meta { color:var(--muted); font-size:9.5px; margin-top:10px; border-top:1px solid var(--border); padding-top:8px; line-height:1.5; }
  .ai-pending { color:var(--muted); font-size:11px; line-height:1.5; }
  /* compact mini-tabs inside the AI Analyst card */
  .ai-tabs { display:flex; gap:2px; margin:6px 0 8px; border-bottom:1px solid var(--border); }
  .ai-tab { padding:5px 10px; font-size:10px; letter-spacing:.5px; color:var(--muted);
    cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0;
    background:transparent; user-select:none; font-family:inherit; }
  .ai-tab:hover { color:var(--text); background:rgba(124,92,255,.06); }
  .ai-tab.active { color:var(--purple); border-color:var(--border); background:var(--panel-2); font-weight:600; }
  .ai-pane { display:none; }
  .ai-pane.active { display:block; }
  .ai-bias-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .ai-bias-pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px;
    border:1px solid currentColor; }

  /* gauge */
  .gauge-wrap { text-align:center; }
  .gauge-big { font-size:26px; font-weight:800; color:var(--green); margin-top:-8px; }
  .gauge-sub { color:var(--muted); font-size:11px; }
  .gauge-legend { display:flex; justify-content:space-between; margin-top:10px; font-size:11px; }
  .gl-bull { color:var(--green); text-align:left; }
  .gl-neu { color:var(--yellow); text-align:center; }
  .gl-bear { color:var(--red); text-align:right; }
  .gl-val { font-weight:800; font-size:15px; display:block; }

  /* flow engine */
  .flow-row { display:flex; align-items:center; overflow-x:auto; padding:6px 0 2px; gap:4px; }
  .flow-node { text-align:center; min-width:78px; }
  .flow-circle { width:46px; height:46px; border-radius:50%; background:var(--panel);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    margin:0 auto 6px; font-size:18px; }
  .flow-name { font-size:10.5px; color:var(--muted); }
  .flow-change { font-size:11.5px; font-weight:700; }
  .flow-period { font-size:9.5px; color:var(--muted); }
  .flow-arrow { color:var(--muted); padding:0 4px; }
  .flow-impact { display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--muted);
    border-left:1px solid var(--border); padding-left:14px; }
  .flow-impact-title { color:var(--text); font-weight:700; margin-bottom:2px; }
  .impact-row { display:flex; align-items:center; gap:6px; }

  /* liquidity indicators */
  .li-row { display:flex; align-items:center; padding:7px 0; font-size:11.5px; border-bottom:1px solid #171c27; }
  .li-row:last-child { border-bottom:none; }
  .li-ic { width:22px; }
  .li-name { flex:1; color:var(--muted); }
  .li-value { font-weight:700; }

  /* composite stress */
  .cs-value-big { font-size:30px; font-weight:800; color:var(--green); }
  .cs-zone { color:var(--muted); font-size:11px; margin-left:6px; }
  .cs-months { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:10px; }
  .cs-cols { display:flex; justify-content:space-between; gap:6px; }
  .cs-col { text-align:center; flex:1; background:var(--panel); border-radius:8px; padding:8px 4px; }
  .cs-name { font-size:10px; color:var(--muted); }
  .cs-value { font-size:15px; font-weight:800; margin:2px 0; }
  .cs-state { font-size:9.5px; color:var(--muted); }

  /* stress bars */
  .stress-row { display:grid; grid-template-columns:70px 1fr; align-items:center; gap:10px; margin-bottom:12px; }
  .stress-label { font-size:11px; color:var(--muted); }
  .stress-track { position:relative; height:14px; background:#171c27; border-radius:4px; }
  .stress-track::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:#333c4d; }
  .stress-fill { position:absolute; top:0; bottom:0; border-radius:4px; }
  .stress-axis { display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-left:80px; }

  /* market overview */
  .mo-row { display:grid; grid-template-columns:1.3fr 1fr 1fr; align-items:center; padding:7px 0;
    font-size:11.5px; border-bottom:1px solid #171c27; }
  .mo-row:last-child { border-bottom:none; }
  .mo-name { display:flex; align-items:center; gap:8px; }
  .mo-ic { width:18px; text-align:center; color:var(--muted); }
  .mo-price { text-align:right; color:var(--text); }
  .mo-change { text-align:right; font-weight:700; }

  /* forecast */
  .fc-summary { color:var(--muted); font-size:11.5px; margin-bottom:12px; }
  .fc-summary b { color:var(--text); }
  .fc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .fc-box { background:var(--panel); border-radius:10px; padding:10px 12px; }
  .fc-box-label { font-size:10px; color:var(--muted); margin-bottom:6px; }
  .fc-box-value { font-size:19px; font-weight:800; color:var(--yellow); }
  .fc-box-note { font-size:10px; color:var(--muted); margin-top:4px; }

  /* momentum / liquidation / confidence */
  .dial { text-align:center; }
  .dial-value { font-size:24px; font-weight:800; color:var(--yellow); }
  .dial-label { font-size:10.5px; color:var(--muted); }
  .row-2col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .kv-row { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); padding:4px 0; }
  .kv-row b { color:var(--text); }
  .signal-badge { background:var(--red); color:#fff; font-weight:800; padding:6px 14px; border-radius:8px; text-align:center; }

  /* news */
  .news-row { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #171c27; }
  .news-row:last-child { border-bottom:none; }
  .news-tag { width:26px; height:26px; border-radius:6px; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:11px; flex-shrink:0; }
  .news-text { font-size:11.5px; line-height:1.4; }
  .news-meta { font-size:10px; color:var(--muted); margin-top:4px; }

  /* stat boxes (liquidity/macro/onchain/stress tabs) */
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .stat-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .stat-label { font-size:10px; color:var(--muted); letter-spacing:.4px; margin-bottom:6px; text-transform:uppercase; }
  .stat-val { font-size:22px; font-weight:800; color:var(--text); }
  .stat-note { font-size:10px; color:var(--muted); margin-top:4px; }
  .prog-track { height:6px; background:#171c27; border-radius:3px; margin-top:8px; overflow:hidden; }
  .prog-fill { height:100%; border-radius:3px; }
  .pf-green { background:var(--green); } .pf-amber { background:var(--yellow); }
  .pf-red { background:var(--red); } .pf-blue { background:var(--blue); }
  .pf-purple { background:var(--purple); } .pf-cyan { background:#00d4ff; }

  .footer { text-align:center; color:var(--muted); font-size:10.5px; padding:16px;
    border-top:1px solid var(--border); }
  /* interactive charts */
  .chart-box { position:relative; width:100%; height:180px; }
  .chart-box.tall { height:230px; }
  .chart-box canvas { width:100% !important; height:100% !important; }
  .ensemble-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:10px; color:var(--muted); }
  .ensemble-legend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px; }
  .xi-row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .xi-label { width:96px; font-size:11px; color:var(--text); }
  .xi-track { flex:1; height:7px; background:#171c27; border-radius:4px; overflow:hidden; }
  .xi-fill { height:100%; border-radius:4px; animation:barGrow .9s cubic-bezier(.25,.8,.25,1) both; }
  .xi-val { width:34px; text-align:right; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .xi-dir { width:12px; text-align:center; }


</style>

  // Toggle active pane + tab within an AI Analyst card (no full re-render).
  window.aiPane = function(id, pane) {

    if (root) {
      var parent = root.parentElement;
      var tabs = parent.querySelectorAll('.ai-tab');
      for (var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-pane')===pane);

      for (var j=0;j<panes.length;j++) panes[j].classList.toggle('active', panes[j].id==='pane-'+id+'-'+pane);

  function panelLiquidity(d) {

    var sli = statBox('SLI — Stablecoin Index', (d.sli_score!=null?fmtNum(d.sli_score,1):'—'), (d.sli_label||'—')+' · stress '+(d.sli_stress!=null?fmtNum(d.sli_stress,2):'—'), (d.sli_score||50)>60?'var(--green)':(d.sli_score||50)>40?'var(--yellow)':'var(--red)', d.sli_score||50, (d.sli_score||50)>60?'pf-green':(d.sli_score||50)>40?'pf-amber':'pf-red');
    var mpi = statBox('MPI — Market Positioning', (d.mpi_score!=null?fmtNum(d.mpi_score,1):'—'), (d.mpi_label||'—')+' · stress '+(d.mpi_stress!=null?fmtNum(d.mpi_stress,2):'—'), (d.mpi_score||50)>60?'var(--green)':(d.mpi_score||50)>40?'var(--yellow)':'var(--red)', d.mpi_score||50, (d.mpi_score||50)>60?'pf-green':(d.mpi_score||50)>40?'pf-amber':'pf-red');
    var lm = statBox('LM — Liquidity Momentum', (d.lm_score!=null?fmtNum(d.lm_score,1)+'pts':'—'), (d.lm_label||'—'), (d.lm_score||0)>=2?'var(--green)':(d.lm_score||0)>-2?'var(--yellow)':'var(--red)');
    var dfs = statBox('DFS — Feature Selector', (d.dfs_regime||'—'), (d.dfs_n_groups||0)+' groups · '+(d.dfs_n_features||0)+' features', (d.dfs_regime==='CRISIS')?'var(--red)':(d.dfs_regime==='STRESS'||d.dfs_regime==='BEAR')?'var(--yellow)':'var(--green)');
    var dw = statBox('DW — Dynamic Weight', (d.dw_z_score!=null?fmtNum(d.dw_z_score*100,0):'—'), (d.dw_regime||'—')+' · adj '+(d.dw_sfc_adjustment!=null?fmtNum(d.dw_sfc_adjustment,1):'—')+'pp', (d.dw_regime==='CRISIS')?'var(--red)':'var(--green)');
    // M72-M75 macro liquidity
    var m72 = statBox('M72 M2 Growth', (d.m72_m2_growth!=null?fmtNum(d.m72_m2_growth*100,0):'—'), 'M2 YoY '+(d.m72_detail&&d.m72_detail.m2_yoy_pct!=null?fmtNum(d.m72_detail.m2_yoy_pct,1)+'%':'—'), (d.m72_m2_growth||0)<0.4?'var(--green)':(d.m72_m2_growth||0)<0.7?'var(--yellow)':'var(--red)', (d.m72_m2_growth||0)*100, (d.m72_m2_growth||0)<0.4?'pf-green':(d.m72_m2_growth||0)<0.7?'pf-amber':'pf-red');
    var m73 = statBox('M73 M2 Momentum', (d.m73_m2_momentum!=null?fmtNum(d.m73_m2_momentum*100,0):'—'), (d.m73_detail&&d.m73_detail.label?String(d.m73_detail.label).replace(/_/g,' '):'—'), (d.m73_m2_momentum||0)<0.3?'var(--green)':(d.m73_m2_momentum||0)<0.6?'var(--yellow)':'var(--red)');
    var m74 = statBox('M74 Fed Balance', (d.m74_fed_balance!=null?fmtNum(d.m74_fed_balance*100,0):'—'), (d.m74_detail&&d.m74_detail.label?String(d.m74_detail.label).replace(/_/g,' '):'—'), (d.m74_fed_balance||0)<0.3?'var(--green)':(d.m74_fed_balance||0)<0.6?'var(--yellow)':'var(--red)');
    var m75 = statBox('M75 Liquidity Composite', (d.m75_liquidity_composite!=null?fmtNum(d.m75_liquidity_composite*100,0):'—'), (d.m75_detail&&d.m75_detail.regime?String(d.m75_detail.regime).toLowerCase():'—'), (d.m75_liquidity_composite||0)<0.3?'var(--green)':(d.m75_liquidity_composite||0)<0.6?'var(--yellow)':'var(--red)');
    return '<div class="grid"><div class="card"><div class="card-title">LIQUIDITY INTELLIGENCE ⓘ <span style="color:var(--muted);font-weight:500">GLF · SLI · MPI · LM · DFS · DW</span></div>' +
      '<div class="stat-grid">'+glf+sli+mpi+lm+dfs+dw+'</div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">LIQUIDITY GAUGE <span style="color:var(--muted);font-weight:500">index vs neutral</span></div>' +
      '<div class="chart-box tall"><canvas data-chart="liquidity"></canvas></div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">MACRO LIQUIDITY <span style="color:var(--muted);font-weight:500">M72–M75 · Layer 1</span></div>' +
      '<div class="stat-grid">'+m72+m73+m74+m75+'</div></div></div>';
  }

  function panelMacro(d) {
    var exp = d.expectation_gap;
    var expCol = exp==null?'var(--text-3)': exp<-1?'var(--red)': exp>1.5?'var(--yellow)':'var(--green)';
    return '<div class="grid"><div class="card"><div class="card-title">MACRO LIQUIDITY &amp; GROWTH</div>' +
      '<div class="stat-grid">' +
        statBox('GLF Score', (d.glf_score!=null?fmtNum(d.glf_score,1):'—'), (d.glf_regime||'—')) +
        statBox('M2 YoY', (d.m2_yoy!=null?fmtNum(d.m2_yoy,2)+'%':'—'), 'US money supply') +
        statBox('DXY', (d.dxy!=null?fmtNum(d.dxy,2):'—'), 'US Dollar Index') +
        statBox('Fed Balance YoY', (d.m74_detail&&d.m74_detail.fed_yoy_pct!=null?fmtNum(d.m74_detail.fed_yoy_pct,1)+'%':'—'), (d.m74_detail&&d.m74_detail.label?String(d.m74_detail.label).replace(/_/g,' '):'—')) +
      '</div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">EXPECTATION GAP (L6)</div>' +
      '<div class="stat-grid">' +
        statBox('Expectation Gap', (exp==null?'—':(exp>0?'+':'')+fmtNum(exp,2)+' pp'), (d.expectation_label||'—'), expCol) +
        statBox('CPI YoY', (d.expectation_details&&d.expectation_details.cpi_yoy_pct!=null?fmtNum(d.expectation_details.cpi_yoy_pct,1)+'%':'—'), 'Realized inflation') +
        statBox('10Y Breakeven', (d.expectation_details&&d.expectation_details.breakeven_inflation!=null?fmtNum(d.expectation_details.breakeven_inflation,2):'—'), 'Market-priced inflation') +
        statBox('Real Yield 10Y', (d.expectation_details&&d.expectation_details.real_yield_10y!=null?fmtNum(d.expectation_details.real_yield_10y,2):'—'), 'TIPS') +
      '</div>' +
      '<div class="chart-box"><canvas data-chart="macro"></canvas></div>' +
      '</div></div>';
  }

  function panelOnchain(d) {
    var q = d.q10_details || {};
    function sub(name, label, format) {
      var m = q[name];
      if (!m || m.status !== 'ok') return statBox(label, '—', 'unavailable');
      var v = m.value;
      return statBox(label, format ? format(v) : fmtNum(v), (m.date||''));
    }
    var floor = d.floor_total; // realized price floor (from floor_realized)
    return '<div class="grid"><div class="card"><div class="card-title">Q10 ON-CHAIN INTELLIGENCE <span style="color:var(--muted);font-weight:500">whale pressure · value · buying power · structure</span></div>' +
      '<div class="stat-grid">' +
        statBox('Whale Pressure', (d.q10_whale_pressure!=null?fmtNum(d.q10_whale_pressure,1):'—'), '0-100, >60 supportive', (d.q10_whale_pressure||50)>=60?'var(--green)':(d.q10_whale_pressure||50)>=40?'var(--yellow)':'var(--red)', d.q10_whale_pressure||50, (d.q10_whale_pressure||50)>=60?'pf-green':(d.q10_whale_pressure||50)>=40?'pf-amber':'pf-red') +
        statBox('On-Chain Value', (d.q10_onchain_value!=null?fmtNum(d.q10_onchain_value,1):'—'), '0-100', (d.q10_onchain_value||50)>=60?'var(--green)':(d.q10_onchain_value||50)>=40?'var(--yellow)':'var(--red)', d.q10_onchain_value||50, (d.q10_onchain_value||50)>=60?'pf-green':(d.q10_onchain_value||50)>=40?'pf-amber':'pf-red') +
        statBox('Buying Power', (d.q10_buying_power!=null?fmtNum(d.q10_buying_power,1):'—'), 'Stablecoin dry powder', (d.q10_buying_power||50)>=60?'var(--green)':(d.q10_buying_power||50)>=40?'var(--yellow)':'var(--red)', d.q10_buying_power||50, (d.q10_buying_power||50)>=60?'pf-green':(d.q10_buying_power||50)>=40?'pf-amber':'pf-red') +
        statBox('Market Structure', (d.q10_market_structure!=null?fmtNum(d.q10_market_structure,1):'—'), 'Derivatives positioning', (d.q10_market_structure||50)>=60?'var(--green)':(d.q10_market_structure||50)>=40?'var(--yellow)':'var(--red)', d.q10_market_structure||50, (d.q10_market_structure||50)>=60?'pf-green':(d.q10_market_structure||50)>=40?'pf-amber':'pf-red') +
      '</div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">ON-CHAIN METRICS</div>' +
      '<div class="stat-grid">' +
        statBox('Realized Price (Floor)', (floor?'$'+fmtNum(floor):'—'), 'BTC above/below cost basis') +
        statBox('BTC / USD', '$'+fmtNum(d.btc), 'Spot price') +
        statBox('SOPR Proxy', (d.sopr_proxy!=null?fmtNum(d.sopr_proxy,4):'—'), (d.sopr_signal||'—').replace(/_/g,' ')) +
        statBox('MVRV (Q10)', (q.mvrv_ratio&&q.mvrv_ratio.status==='ok'?fmtNum(q.mvrv_ratio.value,3):'—'), (q.mvrv_ratio&&q.mvrv_ratio.date||'')) +
      '</div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">Q10 SUB-METRICS</div>' +
      '<div class="stat-grid">' +
        sub('exchange_supply_ratio','Exchange Supply Ratio') + sub('whale_ratio','Whale Ratio') +
        sub('puell_multiple','Puell Multiple') + sub('miners_position','Miners Position') +
        sub('stablecoin_reserve','Stablecoin Reserve', function(v){return '$'+(v/1e9).toFixed(1)+'B';}) +
        sub('taker_buy_sell','Taker Buy/Sell') +
      '</div>' +
      '<div class="chart-box tall"><canvas data-chart="onchain"></canvas></div>' +
      '</div></div>';
  }

  function panelStress(d) {
    var sfcEff = d.sfc_effective != null ? d.sfc_effective : (d.sfc_base || 0);
    var zone = sfcZone(sfcEff), zoneCol = sfcColor(sfcEff);
    var f = d.factors || {};
    var stressBars = [['Liquidity',f.Lt],['Structural',f.St],['Sentiment',f.Rt],['Systemic',f.Ft],['External',f.Sc]].map(function(c){
      var v = c[1]||0; var w = Math.min(Math.abs(v)/3.0*50,50);
      var col = v<0?'var(--red)':'var(--green)';
      var st = v>=0 ? 'left:50%; width:'+w+'%; background:'+col+';' : 'left:'+(50-w)+'%; width:'+w+'%; background:'+col+';';
      return '<div class="stress-row"><div class="stress-label">'+c[0]+'</div><div class="stress-track"><div class="stress-fill" style="'+st+'"></div></div></div>';
    }).join('');
    var tr = d.tail_risk_score||0;
    var rc = d.regime_consensus;
    return '<div class="grid"><div class="card"><div class="card-title">COMPOSITE STRESS INDEX <span style="color:var(--text);font-weight:600">LIVE</span></div>' +
      '<span class="cs-value-big" style="color:'+zoneCol+'">'+sfcEff.toFixed(1)+'%</span><span class="cs-zone">'+zone+' ZONE</span>' +
      '<div class="kv-row" style="margin-top:8px"><span>Base</span><b>'+(d.sfc_base!=null?fmtNum(d.sfc_base,2)+'%':'—')+'</b></div>' +
      '<div class="kv-row"><span>Regime</span><b style="color:'+zoneCol+'">'+(d.regime||'—')+'</b></div>' +
      '<div class="kv-row"><span>Regime Probability</span><b>'+(d.regime_prob!=null?(d.regime_prob*100).toFixed(0)+'%':'—')+'</b></div>' +
      '<div class="kv-row"><span>Transition Risk</span><b style="color:'+((d.transition_risk||0)>0.5?'var(--red)':'var(--green)')+'">'+(d.transition_risk!=null?(d.transition_risk*100).toFixed(0)+'%':'—')+'</b></div>' +
      '</div>' +
      '<div class="chart-box" style="margin-top:6px"><canvas data-chart="stress"></canvas></div>' +
      '</div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">STRESS COMPONENTS</div>'+stressBars+
        '<div class="stress-axis"><span>-3.0</span><span>-1.5</span><span>0</span><span>1.5</span><span>3.0</span></div></div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">TAIL RISK &amp; CONSENSUS</div>' +
      '<div class="stat-grid">' +
        statBox('Tail Risk (L8)', (d.tail_risk_available?(tr).toFixed(0):'—'), (d.tail_risk_severity||'—'), tr>=60?'var(--red)':tr>=40?'var(--yellow)':'var(--green)', tr, tr>=60?'pf-red':tr>=40?'pf-amber':'pf-green') +
        statBox('Regime Consensus', (rc||'—'), 'agreement '+(d.regime_consensus_agreement!=null?(d.regime_consensus_agreement*100).toFixed(0)+'%':'—')) +
        statBox('Behavior State', (d.behavior_state||'—'), (d.behavior_state_available?'signals active':'unavailable')) +
        statBox('Transmission', (d.transmission_status||'—'), (d.transmission_available?(d.transmission_liquidity_state||'—')+' liq · '+(d.transmission_btc_state||'—')+' BTC':'unavailable')) +
      '</div></div></div>';
  }

  function panelForecast(d) {
    var ts = d.trend_strength_score||0;
    var tsCol = ts>=65?'var(--green)':ts>=45?'var(--yellow)':ts>=25?'var(--cyan)':'var(--red)';
    return '<div class="grid"><div class="card"><div class="card-title">WEEKLY / MONTHLY FORECAST ⓘ <span style="color:var(--muted);font-weight:500">Walk-forward validated · display-only</span></div>' +
      '<div class="fc-summary">Continuation odds: <b>1W '+(d.cont_prob_30d!=null?(d.cont_prob_30d*100).toFixed(1)+'%':'—')+'</b> · <b>3M '+(d.cont_prob_90d!=null?(d.cont_prob_90d*100).toFixed(1)+'%':'—')+'</b> · <b>6M '+(d.cont_prob_180d!=null?(d.cont_prob_180d*100).toFixed(1)+'%':'—')+'</b></div>' +
      '<div class="fc-grid">' +
        '<div class="fc-box"><div class="fc-box-label">WEEKLY (7D) STRESS GAP</div><div class="fc-box-value">'+(d.wfv_gap_7d!=null?(d.wfv_gap_7d>0?'+':'')+d.wfv_gap_7d.toFixed(2):'—')+'</div><div class="fc-box-note">'+(d.wfv_gap_7d_significant?'Significant':'Not significant')+'</div></div>' +
        '<div class="fc-box"><div class="fc-box-label">MONTHLY (30D) STRESS GAP</div><div class="fc-box-value">'+(d.wfv_gap_30d!=null?(d.wfv_gap_30d>0?'+':'')+d.wfv_gap_30d.toFixed(2):'—')+'</div><div class="fc-box-note">'+(d.wfv_gap_30d_significant?'Significant':'Not significant')+'</div></div>' +
        '<div class="fc-box"><div class="fc-box-label">CONTINUATION ODDS (3M)</div><div class="fc-box-value">'+(d.cont_prob_90d!=null?(d.cont_prob_90d*100).toFixed(0):'—')+'%</div><div class="fc-box-note">vs baseline '+(d.cont_rel_90d!=null?((d.cont_rel_90d>0?'+':'')+(d.cont_rel_90d*100).toFixed(0)+'pp'):'—')+'</div></div>' +
      '</div>' +
      '<div class="chart-box"><canvas data-chart="forecast"></canvas></div>' +
      '</div></div>' +
      '<div class="grid"><div class="card"><div class="card-title">TREND &amp; POSITION SIZING</div>' +
      '<div class="stat-grid">' +
        statBox('Trend Strength', (d.trend_strength_available?(ts).toFixed(0):'—'), (d.trend_strength_label||'—'), tsCol, ts, ts>=65?'pf-green':ts>=45?'pf-amber':'pf-red') +
        statBox('Kelly Fraction', (d.kelly_fraction!=null?(d.kelly_fraction*100).toFixed(1)+'%':'—'), (d.kelly_fraction||0)>0?'Positive edge':'No edge — cash') +
        statBox('Readiness', (d.readiness_score!=null?(d.readiness_score*100).toFixed(0)+'%':'—'), 'Entry/exit conditions') +
        statBox('Alert Window', (d.alert_window_days!=null?Math.round(d.alert_window_days)+'d':'—'), (d.timing_precision||'')+' precision') +
      '</div></div></div>';
  }

  function panelResearch(d) {
    var xai = d.xai_top_features || [];
    var xaiHtml = (xai.length ? xai.map(function(f){
      var col = f.direction==='positive'?'var(--red)':'var(--green)';
      var dir = f.direction==='positive'?'↑':f.direction==='negative'?'↓':'→';
      var pct = f.importance_pct!=null?f.importance_pct:0;
      return '<div class="xi-row"><div class="xi-label">'+f.name+'</div><div class="xi-track"><div class="xi-fill" style="width:'+pct+'%;background:'+col+'"></div></div><div class="xi-val">'+pct+'%</div><div class="xi-dir" style="color:'+col+'">'+dir+'</div></div>';
    }).join('') : '<div class="exec-note">No XAI data available this cycle.</div>');
    var consensus = d.method_agreement!=null?(d.method_agreement*100).toFixed(0)+'%':'—';
    return '<div class="grid"><div class="card"><div class="card-title">6-METHOD ENSEMBLE <span style="color:var(--muted);font-weight:500">consensus '+consensus+'</span></div>' +
      '<div class="chart-box tall"><canvas data-chart="ensemble"></canvas></div>' +
      '<div class="ensemble-legend">' +
        '<span><i style="background:'+(d.m1_klr!=null&&d.m1_klr>=60?'#2ecc71':(d.m1_klr!=null&&d.m1_klr<=40?'#e74c3c':'#f1c40f'))+'"></i>KLR</span>' +
        '<span><i style="background:'+(d.m2_logit!=null&&d.m2_logit>=60?'#2ecc71':(d.m2_logit!=null&&d.m2_logit<=40?'#e74c3c':'#f1c40f'))+'"></i>Logit</span>' +
        '<span><i style="background:'+(d.m3_bayes!=null&&d.m3_bayes>=60?'#2ecc71':(d.m3_bayes!=null&&d.m3_bayes<=40?'#e74c3c':'#f1c40f'))+'"></i>Bayes</span>' +
        '<span><i style="background:'+(d.m4_ewc!=null&&d.m4_ewc>=60?'#2ecc71':(d.m4_ewc!=null&&d.m4_ewc<=40?'#e74c3c':'#f1c40f'))+'"></i>EWC</span>' +
        '<span><i style="background:'+(d.m5_qreg!=null&&d.m5_qreg>=60?'#2ecc71':(d.m5_qreg!=null&&d.m5_qreg<=40?'#e74c3c':'#f1c40f'))+'"></i>QREG</span>' +
        '<span><i style="background:'+(d.m6_regime_score!=null&&d.m6_regime_score>=60?'#2ecc71':(d.m6_regime_score!=null&&d.m6_regime_score<=40?'#e74c3c':'#f1c40f'))+'"></i>Regime</span>' +
      '</div></div></div>' +
      '<div class="grid" style="grid-template-columns:1fr 1fr">' +
      '<div class="card"><div class="card-title">QLSTM / HYBRID</div>' +
      '<div class="stat-grid">' +
        statBox('Hybrid Pred', (d.m32_hybrid_pred!=null?fmtNum(d.m32_hybrid_pred,2)+'%':'—'), 'ProAdapt '+(d.m32_proadapt_weight!=null?(d.m32_proadapt_weight*100).toFixed(0)+'%':'—')) +
        statBox('ML Ensemble', (d.ml_ensemble_score!=null?fmtNum(d.ml_ensemble_score,2):'—'), (d.ml_ensemble_msg||'')) +
      '</div>' +
      '<div class="chart-box"><canvas data-chart="qlstm"></canvas></div>' +
      '</div>' +
      '<div class="card"><div class="card-title">XAI — SHAP / LIME</div>' +
      '<div class="stat-grid">' +
        statBox('SHAP Top', (d.m70_shap_top_3||'—'), (d.m70_shap_top_1||'')) +
        statBox('LIME Top', (d.m71_lime_top_3||'—'), (d.m71_lime_top_1||'')) +
      '</div>' +
      '<div style="margin-top:10px">'+xaiHtml+'</div>' +
      '</div>' +
      '</div>';
  }

  var PANELS = {
    overview: panelOverview, market: panelMarket, liquidity: panelLiquidity,
    macro: panelMacro, onchain: panelOnchain, stress: panelStress,
    forecast: panelForecast, research: panelResearch
  };

  function badges(d) {
    var rsi = d.rsi_14 || 50;
    var arr = [
      {label:'REGIME', value:d.regime||'—', color:(d.regime==='STRESS'||d.regime==='CRISIS')?'var(--red)':(d.regime==='ELEVATED')?'var(--yellow)':'var(--green)'},
      {label:'LIQUIDITY', value:liqLabel(d).toUpperCase(), color:liqColor(d)},
      {label:'MOMENTUM', value:(d.rsi_regime||'—').replace(/_/g,' '), color:rsi>70?'var(--red)':rsi<30?'var(--green)':'var(--yellow)'},
      {label:'STRUCTURE', value:(d.q10_market_structure!=null)?(d.q10_market_structure>=40?'HEALTHY':'RISK'):'—', color:(d.q10_market_structure!=null&&d.q10_market_structure>=40)?'var(--green)':'var(--yellow)'},
      {label:'FEAR & GREED', value:(d.fng!=null?d.fng+' ('+(d.fng_cls||'')+')':'—'), color:(d.fng||50)<20?'var(--red)':(d.fng||50)>70?'var(--green)':'var(--orange)'},
      {label:'BTC DOM', value:(d.dom!=null?d.dom.toFixed(1)+'%':'—'), color:'var(--blue)'},
    ];
    return arr.map(function(b){
      return '<div class="badge"><span class="dot" style="background:'+b.color+'"></span><span class="badge-label">'+b.label+':</span> <span class="badge-value" style="color:'+b.color+'">'+b.value+'</span></div>';
    }).join('');
  }

  function render(d) {
    d = d || {};
    var active = (window.__activeTab) || DEFAULT_TAB;
    if (!TABS.indexOf) { /* noop */ }
    if (TABS.indexOf(active) < 0) active = DEFAULT_TAB;
    var nav = '<div class="nav-items">' + NAV_ITEMS.map(function(n){
      return '<div class="nav-item'+(n[2]===active?' active':'')+'" data-tab="'+n[2]+'" onclick="switchTab(\''+n[2]+'\')">' +
        '<span class="nav-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+n[1]+'"/></svg></span>' +
        n[0] + '</div>';
    }).join('') + '</div>';
    var tabs = TABS.map(function(t){
      return '<div class="tab'+(t===active?' active':'')+'" data-tab="'+t+'" onclick="switchTab(\''+t+'\')">'+TAB_LABELS[t]+'</div>';
    }).join('');
    var panels = TABS.map(function(t){
      var fn = PANELS[t] || function(){return '';};
      return '<div class="tab-panel'+(t===active?' active':'')+'" data-tabpanel="'+t+'">'+fn(d)+'</div>';
    }).join('');

    return '' +
    '<div class="layout">' +
      '<div class="sidebar">' +
        '<div class="brand"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4z"/></svg></span><span class="brand-name">SFC</span></div>' +
        '<div class="brand-sub">TERMINAL</div><div style="height:12px"></div>' +
        nav +
        '<div class="sidebar-foot">' +
          '<div><span class="live-dot">●</span> DATA STATUS: Live</div>' +
          '<div style="margin-top:6px;color:var(--green)">All systems operational</div>' +
          '<div style="margin-top:10px">LAST UPDATE<br><span id="lastUpdate">'+(d.ts?new Date(d.ts).toLocaleString():'—')+'</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="main">' +
        '<div class="topbar">' +
          '<div class="topbar-left"><div class="topbar-title">SFC Terminal</div><div class="topbar-sub">Quantitative Stress Intelligence</div></div>' +
          '<div class="topbar-right">' +
            '<div class="market-open"><span class="dot"></span>Market Open</div>' +
            '<div class="tb-date"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="todayDate">'+(d.ts?new Date(d.ts).toLocaleDateString():'—')+'</span></div>' +
            '<div class="tb-date"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span id="todayTime">'+(d.ts?new Date(d.ts).toLocaleTimeString():'—')+'</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="tabs">'+tabs+'</div>' +
        '<div class="badges">'+badges(d)+'</div>' +
        panels +
        '<div class="footer">SFC Terminal provides data and analysis for informational purposes only and does not constitute financial advice. &nbsp;·&nbsp; Sources: FRED · CoinGecko · Glassnode · TradingView · SFC Models</div>' +
      '</div>' +
    '</div>';
  }

  window.__render = render;
  // Animate numeric values (count-up) + stagger card entrance after each render.
  function animateNumbers(root) {
    var els = root.querySelectorAll ? root.querySelectorAll('.exec-big,.exec-mid,.gauge-big,.cs-value-big,.stat-val') : [];
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var text = el.textContent || '';
        var m = text.match(/[\d.,]+/);
        if (!m) return;
        var target = parseFloat(m[0].replace(/,/g, '')) || 0;
        var suffix = text.replace(m[0], '');
        var prefix = text.substring(0, text.indexOf(m[0]));
        if (isNaN(target) || target <= 0 || target >= 1e12) { el.textContent = text; return; }
        var dur = 700, t0 = null;
        function step(ts) {
          if (!t0) t0 = ts;
          var p = Math.min((ts - t0) / dur, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          var val = (target * eased);
          el.textContent = prefix + (target >= 1000 ? val.toLocaleString(undefined,{maximumFractionDigits:0}) : val.toFixed(1)) + suffix;
          if (p < 1) requestAnimationFrame(step); else el.textContent = text;
        }
        requestAnimationFrame(step);
      })(els[i]);
    }
    // stagger cards fade
    var cards = root.querySelectorAll ? root.querySelectorAll('.tab-panel.active .card') : [];
    for (var c = 0; c < cards.length; c++) {
      cards[c].style.animationDelay = Math.min(c * 45, 450) + 'ms';
    }
  }
  function renderAll(animated) {
    var el = document.getElementById('app');
    if (!el) return;
    el.innerHTML = render(window.__EMBEDDED_DATA || {});
    // Toggle .anim so entrance animations play only on load / tab switch,
    // never on background updates (prevents the flicker/refresh feel).
    if (el.classList) {
      if (animated !== false) el.classList.add('anim'); else el.classList.remove('anim');
    }
    if (animated !== false) animateNumbers(el);
    initCharts(el, animated);
  }

  /* ---------- Interactive charts (Chart.js) ---------- */
  window.__charts = window.__charts || [];
  function destroyCharts() {
    var c = window.__charts;
    for (var i = 0; i < c.length; i++) { try { c[i].destroy(); } catch (_) {} }
    window.__charts = [];
  }
  function registerChart(ch) { if (ch) window.__charts.push(ch); }
  var CHART_COLORS = { green:'#2ecc71', red:'#e74c3c', yellow:'#f1c40f', blue:'#3498db', purple:'#7c5cff', cyan:'#00d4ff', grid:'rgba(143,147,165,0.10)' };
  function chartText() { return { color:'#8b93a5' }; }
  function chartGrid() { return { color:'rgba(143,147,165,0.10)' }; }
  function initCharts(root, animated) {
    if (typeof Chart === 'undefined') return;   // CDN not loaded yet -> charts skipped gracefully
    destroyCharts();
    var d = window.__EMBEDDED_DATA || {};
    // --- Composite Stress radar (5 factors) ---
    var radar = root.querySelector ? root.querySelector('canvas[data-chart="stress"]') : null;
    if (radar) {
      var f = d.factors || {};
      registerChart(new Chart(radar.getContext('2d'), {
        type: 'radar',
        data: { labels: ['Liquidity','Structural','Sentiment','Systemic','External'],
          datasets: [{
            label: 'Factor z-score', data: [f.Lt||0, f.St||0, f.Rt||0, f.Ft||0, f.Sc||0],
            backgroundColor:'rgba(124,92,255,0.18)', borderColor:'#7c5cff', borderWidth:1.6, pointBackgroundColor:'#7c5cff', pointRadius:3
          }]
        },
        options: { responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1 } },
          scales: { r: { min:-3, max:3, ticks:{ stepSize:1, color:'#8b93a5', backdropColor:'transparent' }, angleLines:{ color:CHART_COLORS.grid }, grid:{ color:CHART_COLORS.grid }, pointLabels:{ color:'#aab2c0', font:{ size:10 } } } }
        }
      }));
    }
    // --- 6-method ensemble bar ---
    var ens = root.querySelector ? root.querySelector('canvas[data-chart="ensemble"]') : null;
    if (ens) {
      var ed = [d.m1_klr, d.m2_logit, d.m3_bayes, d.m4_ewc, d.m5_qreg, d.m6_regime_score];
      var enLabels = ['KLR','Logit','Bayes','EWC','QREG','Regime'];
      var enColors = ed.map(function(v){ return (v==null)?CHART_COLORS.grid : v>=60 ? CHART_COLORS.green : v<=40 ? CHART_COLORS.red : CHART_COLORS.yellow; });
      registerChart(new Chart(ens.getContext('2d'), {
        type: 'bar',
        data: { labels: enLabels, datasets: [{ label:'Regime probability %', data: ed, backgroundColor:enColors, borderRadius:4, maxBarThickness:30 }] },
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1, callbacks:{ label:function(c){ return (c.parsed.x!=null?c.parsed.x.toFixed(1)+'%':'—'); } } } },
          scales: { x:{ min:0, max:100, ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } }, y:{ ticks:{ color:'#aab2c0', font:{ size:11 } }, grid:{ display:false } } }
        }
      }));
    }
    // --- QLSTM train/val loss line ---
    var ql = root.querySelector ? root.querySelector('canvas[data-chart="qlstm"]') : null;
    if (ql) {
      var tl = d.qlstm_train || [], vl = d.qlstm_val || [];
      var maxLen = Math.max(tl.length, vl.length);
      var labels = [];
      for (var li = 0; li < maxLen; li++) labels.push(String(li));
      registerChart(new Chart(ql.getContext('2d'), {
        type: 'line',
        data: { labels: labels, datasets: [
          { label:'Train loss', data: tl, borderColor:CHART_COLORS.purple, backgroundColor:'rgba(124,92,255,0.08)', fill:true, tension:.3, borderWidth:1.6, pointRadius:0 },
          { label:'Val loss', data: vl, borderColor:CHART_COLORS.cyan, backgroundColor:'transparent', tension:.3, borderWidth:1.6, pointRadius:0 }
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ labels:{ color:'#aab2c0', boxWidth:12, font:{ size:10 } }, position:'top' }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1 } },
          scales: { x:{ display:false }, y:{ ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } } }
        }
      }));
    }
    // --- Forecast: continuation odds (1W / 3M / 6M) ---
    var fc = root.querySelector ? root.querySelector('canvas[data-chart="forecast"]') : null;
    if (fc) {
      var fcD = [ d.cont_prob_30d!=null?d.cont_prob_30d*100:null, d.cont_prob_90d!=null?d.cont_prob_90d*100:null, d.cont_prob_180d!=null?d.cont_prob_180d*100:null ];
      var fcCols = fcD.map(function(v){ return v==null?CHART_COLORS.grid : v>=60?CHART_COLORS.green : v>=45?CHART_COLORS.cyan : CHART_COLORS.yellow; });
      registerChart(new Chart(fc.getContext('2d'), {
        type: 'bar',
        data: { labels: ['1 Week','3 Months','6 Months'], datasets: [{ label:'Continuation odds %', data: fcD, backgroundColor:fcCols, borderRadius:4, maxBarThickness:38 }] },
        options: { responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1, callbacks:{ label:function(c){ return (c.parsed.y!=null?c.parsed.y.toFixed(1)+'%':'—'); } } } },
          scales: { y:{ min:0, max:100, ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } }, x:{ ticks:{ color:'#aab2c0' }, grid:{ display:false } } }
        }
      }));
    }
    // --- Liquidity gauge: GLF / SLI / MPI vs neutral 50 ---
    var lq = root.querySelector ? root.querySelector('canvas[data-chart="liquidity"]') : null;
    if (lq) {
      var lqD = [ d.glf_score!=null?d.glf_score:null, d.sli_score!=null?d.sli_score:null, d.mpi_score!=null?d.mpi_score:null ];
      var lqCols = lqD.map(function(v){ return v==null?CHART_COLORS.grid : v>60?CHART_COLORS.green : v>=40?CHART_COLORS.yellow : CHART_COLORS.red; });
      registerChart(new Chart(lq.getContext('2d'), {
        type: 'bar',
        data: { labels: ['GLF','SLI','MPI'], datasets: [{ label:'Liquidity index', data: lqD, backgroundColor:lqCols, borderRadius:4, maxBarThickness:44 }] },
        options: { responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1, callbacks:{ label:function(c){ return 'index '+(c.parsed.y!=null?c.parsed.y.toFixed(1):'—'); } } } },
          scales: { y:{ min:0, max:100, ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } }, x:{ ticks:{ color:'#aab2c0' }, grid:{ display:false } } }
        }
      }));
    }
    // --- On-chain: Q10 indicator scores (horizontal bar) ---
    var oc = root.querySelector ? root.querySelector('canvas[data-chart="onchain"]') : null;
    if (oc) {
      var ocD = [ d.q10_whale_pressure!=null?d.q10_whale_pressure:null, d.q10_onchain_value!=null?d.q10_onchain_value:null, d.q10_buying_power!=null?d.q10_buying_power:null, d.q10_market_structure!=null?d.q10_market_structure:null ];
      var ocCols = ocD.map(function(v){ return v==null?CHART_COLORS.grid : v>=60?CHART_COLORS.green : v>=40?CHART_COLORS.yellow : CHART_COLORS.red; });
      registerChart(new Chart(oc.getContext('2d'), {
        type: 'bar',
        data: { labels: ['Whale Pressure','On-Chain Value','Buying Power','Market Structure'], datasets: [{ label:'Q10 score', data: ocD, backgroundColor:ocCols, borderRadius:4, maxBarThickness:26 }] },
        options: { indexAxis:'y', responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1, callbacks:{ label:function(c){ return (c.parsed.x!=null?c.parsed.x.toFixed(1):'—'); } } } },
          scales: { x:{ min:0, max:100, ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } }, y:{ ticks:{ color:'#aab2c0', font:{ size:10 } }, grid:{ display:false } } }
        }
      }));
    }
    // --- Macro: DXY / M2 / Fed (horizontal bar) ---
    var mc = root.querySelector ? root.querySelector('canvas[data-chart="macro"]') : null;
    if (mc) {
      var m2v = d.m2_yoy!=null?d.m2_yoy:null;
      var fedv = d.m74_detail&&d.m74_detail.fed_yoy_pct!=null?d.m74_detail.fed_yoy_pct:null;
      var expv = d.expectation_gap!=null?d.expectation_gap:null;
      var mcD = [ m2v, fedv, expv ];
      var mcCols = mcD.map(function(v){ return v==null?CHART_COLORS.grid : v>=0?CHART_COLORS.green : CHART_COLORS.red; });
      registerChart(new Chart(mc.getContext('2d'), {
        type: 'bar',
        data: { labels: ['M2 YoY','Fed Balance YoY','Expectation Gap'], datasets: [{ label:'% change', data: mcD, backgroundColor:mcCols, borderRadius:4, maxBarThickness:40 }] },
        options: { responsive:true, maintainAspectRatio:false,
          animation: animated===false ? false : { duration: 800 },
          plugins: { legend:{ display:false }, tooltip:{ backgroundColor:'#141924', titleColor:'#e6e9ef', bodyColor:'#8b93a5', borderColor:'#1f2531', borderWidth:1, callbacks:{ label:function(c){ return (c.parsed.y!=null?c.parsed.y.toFixed(2)+'%':'—'); } } } },
          scales: { y:{ ticks:{ color:'#8b93a5' }, grid:{ color:CHART_COLORS.grid } }, x:{ ticks:{ color:'#aab2c0' }, grid:{ display:false } } }
        }
      }));
    }
  }
  window.switchTab = function(name) {
    if (TABS.indexOf(name) < 0) return;
    window.__activeTab = name;
    renderAll(true);
  };
  document.addEventListener('DOMContentLoaded', function(){ renderAll(true); });

  // Load weekly Hermes LLM analysis (separate file, survives data.json overwrites)
  function loadAIAnalysis() {
    try {
      fetch('/ai_analysis.json', { cache: 'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(a){
          if (a && (a.bias || a.summary)) {
            window.__AI_ANALYSIS = a;
            renderAll(false);
          }
        })
        .catch(function(){ /* keep fallback; no analysis available */ });
    } catch (e) { /* fetch unsupported */ }
  }
  loadAIAnalysis();

  // Real-time topbar clock — updates only the time/date text every second,
  // never re-renders the DOM (so it ticks without any flicker). Re-queries the
  // elements each tick because renderAll() swaps out the whole #app subtree.
  (function () {
    function tick() {
      var t = document.getElementById ? document.getElementById('todayTime') : null;
      var d = document.getElementById ? document.getElementById('todayDate') : null;
      if (!t && !d) return;
      var now = new Date();
      if (t) t.textContent = now.toLocaleTimeString();
      if (d) d.textContent = now.toLocaleDateString();
    }
    tick();
    setInterval(tick, 1000);
  })();

  // ---- SSE ----
  (function () {
    // Patch only the BTC price row on high-frequency ticker updates — avoids a
    // full DOM re-render every second (which caused a visible flicker).
    function updatePrice(p) {
      window.__EMBEDDED_DATA = Object.assign({}, window.__EMBEDDED_DATA || {}, { btc: p.price, btc_24h: p.change_pct, ts: p.ts });
      if (!document.querySelectorAll) return;
      var rows = document.querySelectorAll('.mo-row');
      for (var i = 0; i < rows.length; i++) {
        var nameEl = rows[i].querySelector('.mo-name');
        if (nameEl && /BTC/.test(nameEl.textContent)) {
          var priceEl = rows[i].querySelector('.mo-price');
          var chgEl = rows[i].querySelector('.mo-change');
          if (priceEl && p.price != null) priceEl.textContent = '$' + Number(p.price).toLocaleString();
          if (chgEl && p.change_pct != null) {
            chgEl.textContent = (p.change_pct >= 0 ? '↑ +' : '↓ ') + Math.abs(p.change_pct).toFixed(2) + '%';
            chgEl.style.color = (p.change_pct >= 0) ? 'var(--green)' : 'var(--red)';
          }
        }
      }
    }
    function update(payload) {
      if (!payload) return;
      try {
        window.__EMBEDDED_DATA = Object.assign({}, window.__EMBEDDED_DATA || {}, payload);
        renderAll(false);
      } catch (e) {}
    }
    var src = null, timer = null;
    function connect() {
      if (typeof EventSource === 'undefined') return;
      src = new EventSource('/events');
      src.addEventListener('btc_ticker', function (e) { try { updatePrice(JSON.parse(e.data)); } catch (_) {} });
      src.addEventListener('sfc_update', function (e) { try { update(JSON.parse(e.data)); } catch (_) {} });
      src.onerror = function () {
        if (src) { src.close(); src = null; }
        if (timer) clearTimeout(timer);
        timer = setTimeout(connect, 5000);
      };
    }
    connect();
  })();
})();

</script>
</body>
