<!DOCTYPE html>
<!-- b=1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com https://sfc-terminal.meoong17.workers.dev;">
<title>SFC Terminal | Quantitative Stress Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   SFC TERMINAL v4 — Redesigned Design System
   Dark-mode, Linear-inspired precision with crypto-accent purple
══════════════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void:      #07080d;
  --bg-base:      #0b0d15;
  --bg-card:      #0e111a;
  --bg-raise:     #131723;
  --bg-float:     #1a1f2e;
  --bg-hover:     #1f2436;

  --border-0:    rgba(255,255,255,0.03);
  --border-1:    rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.09);
  --border-3:    rgba(255,255,255,0.14);

  --text-1: #edf1f7;
  --text-2: #8892a8;
  --text-3: #49536b;
  --text-4: #2a3347;

  --purple:   #7864ff;
  --purple2:  #5d4ae0;
  --purple-dim: rgba(120,100,255,0.12);
  --purple-glow: rgba(120,100,255,0.2);
  --purple-border: rgba(120,100,255,0.3);

  --cyan:     #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.1);
  --green:    #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --red:      #ff4060;
  --red-dim:   rgba(255,64,96,0.1);
  --amber:    #f0b429;
  --amber-dim: rgba(240,180,41,0.1);
  --blue:     #4a9eff;
  --blue-dim:  rgba(74,158,255,0.1);

  --grad-purple:  linear-gradient(135deg,#7864ff,#5d4ae0);
  --grad-cyan:    linear-gradient(135deg,#00d4ff,#0099e6);
  --grad-green:   linear-gradient(135deg,#00f5a0,#00c87b);
  --grad-red:     linear-gradient(135deg,#ff4060,#cc1a35);
  --grad-amber:   linear-gradient(135deg,#f0b429,#d48a00);
  --border-red: #ff4060;
  --border-green: #00f5a0;

  --glow-purple: 0 0 30px rgba(120,100,255,0.15);
  --glow-cyan:   0 0 30px rgba(0,212,255,0.12);
  --glow-green:  0 0 30px rgba(0,245,160,0.12);
  --glow-red:    0 0 30px rgba(255,64,96,0.12);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --nav-h: 52px;
  --band-h: 36px;
}

html { height: 100%; }

body {
  background: var(--bg-void);
  color: var(--text-1);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ══════════════════════════════════════════
   LOADING SCREEN
══════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
.loading-logo {
  width: 56px; height: 56px;
  border-radius: var(--r-md);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.loading-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border-2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: var(--nav-h);
  background: rgba(7,8,13,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-1);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 10px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.nav-wordmark { display: flex; flex-direction: column; }
.nav-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}
.nav-title span { color: var(--purple); }
.nav-sub {
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 1px;
}

.nav-center {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255,255,255,0.03);
  padding: 2px;
  border-radius: 8px;
}
.nav-tab {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text-1); background: rgba(255,255,255,0.04); }
.nav-tab.active { color: #fff; background: var(--purple-dim); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-meta { display: flex; flex-direction: column; align-items: flex-end; }
.nav-meta-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}
.nav-meta-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-1);
}
.nav-pill {
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.pill-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.pill-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--border-red); }

/* ══════════════════════════════════════════
   STATUS BAND
══════════════════════════════════════════ */
.status-band {
  display: flex;
  gap: 6px;
  padding: 6px 24px;
  height: var(--band-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-1);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.status-band::-webkit-scrollbar { display: none; }
.s-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid var(--border-1);
  background: var(--bg-card);
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}
.s-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.dot-g { background: var(--green); box-shadow: 0 0 5px rgba(0,245,160,0.5); }
.dot-r { background: var(--red);   box-shadow: 0 0 5px rgba(255,64,96,0.5); }
.dot-a { background: var(--amber); box-shadow: 0 0 5px rgba(240,180,41,0.5); }
.dot-b { background: var(--blue);  box-shadow: 0 0 5px rgba(74,158,255,0.5); }
.dot-c { background: var(--cyan);  box-shadow: 0 0 5px rgba(0,212,255,0.5); }
.dot-p { background: var(--purple);box-shadow: 0 0 5px rgba(120,100,255,0.5); }

/* ══════════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════════ */
.main {
  padding: 20px 24px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* Section heading bar */
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.section-head-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-2), transparent);
}
.section-head-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}

/* ══════════════════════════════════════════
   KPI ROW
══════════════════════════════════════════ */
.kpi-row {
  display: grid;
  grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.kpi:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

.kpi-hero {
  border-color: var(--purple-border);
  background: linear-gradient(135deg, rgba(120,100,255,0.06) 0%, var(--bg-card) 100%);
}
.kpi-hero:hover {
  border-color: rgba(120,100,255,0.4);
  box-shadow: var(--glow-purple);
}

/* Gradient top accent for all KPIs */
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 2px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  opacity: 0.6;
}
.kpi-hero::before { background: var(--grad-purple); }

.kpi-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.kpi-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 3px;
}
.kpi-hero .kpi-num { font-size: 32px; }
.kpi-aux {
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
}
.kpi-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 3px;
}
.kb-g { background: var(--green-dim); color: var(--green); }
.kb-r { background: var(--red-dim); color: var(--red); }
.kb-a { background: var(--amber-dim); color: var(--amber); }

.chg-p { color: var(--green); }
.chg-n { color: var(--red); }
.chg-z { color: var(--text-2); }

/* ══════════════════════════════════════════
   GRID LAYOUTS
══════════════════════════════════════════ */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.span-full { grid-column: 1 / -1; }

/* ══════════════════════════════════════════
   CARD
══════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.card:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.015);
}

/* Gradient top accent bar for all cards */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 1.5px;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: linear-gradient(90deg, transparent, rgba(120,100,255,0.2), transparent);
  opacity: 0.4;
  z-index: 1;
}

.card-head {
  padding: 12px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-1);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-2);
}
.card-icon {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: var(--bg-raise);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { display: block; }
.card-badge {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
}
.card-body { padding: 18px; }
.card-body-sm { padding: 12px 18px; }

/* ══════════════════════════════════════════
   SFC STRESS HERO (Arc Gauge)
══════════════════════════════════════════ */
.sfc-hero-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 18px;
}
.sfc-arc-container {
  position: relative;
  width: 170px;
  height: 95px;
  margin-bottom: 6px;
}
.sfc-arc-container svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sfc-big-num {
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}
.sfc-desc {
  font-size: 9px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.sfc-zone-pill {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}
.zone-normal   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.zone-elevated { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.zone-critical { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }

/* Progress bar */
.prog-track {
  height: 3px;
  background: var(--bg-raise);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
}
.prog-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.pf-green  { background: var(--grad-green); }
.pf-red    { background: var(--grad-red); }
.pf-amber  { background: var(--grad-amber); }
.pf-cyan   { background: var(--grad-cyan); }
.pf-purple { background: var(--grad-purple); }

/* ══════════════════════════════════════════
   METHOD ENSEMBLE GRID
══════════════════════════════════════════ */
.method-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 12px;
}
.method-cell {
  background: var(--bg-raise);
  border-radius: var(--r-sm);
  padding: 7px 5px;
  text-align: center;
  border: 1px solid var(--border-1);
  transition: border-color 0.15s;
}
.method-cell:hover { border-color: var(--border-2); }
.method-cell-name {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.method-cell-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
}

/* ══════════════════════════════════════════
   CONSENSUS
══════════════════════════════════════════ */
.consensus-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 0;
  border-top: 1px solid var(--border-1);
  margin-top: 6px;
}
.consensus-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.consensus-info { flex: 1; }
.consensus-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 1px;
}
.consensus-sub {
  font-size: 8px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ══════════════════════════════════════════
   CHART
══════════════════════════════════════════ */
.chart-shell {
  position: relative;
  border-radius: var(--r-md);
  padding: 3px;
  background: linear-gradient(135deg, rgba(120,100,255,0.04) 0%, transparent 60%);
  overflow: hidden;
}
.chart-shell canvas {
  display: block;
  width: 100% !important;
  max-height: 220px;
}

/* ══════════════════════════════════════════
   INFO TABLE ROWS
══════════════════════════════════════════ */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
  font-size: 11px;
}
.info-row:last-child { border-bottom: none; }
.info-k {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 500;
}
.info-v {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 11px;
}

/* ══════════════════════════════════════════
   GAUGE RINGS
══════════════════════════════════════════ */
.gauge-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 4px;
}
.gauge-wrap svg { width: 100%; height: 100%; }
.gauge-center-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 16px;
}
.metric-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: center;
  margin-bottom: 6px;
}
.sopr-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 6px 0 3px;
}
.dual-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.metric-center { text-align: center; padding: 4px; }

/* ══════════════════════════════════════════
   SIGNAL BLOCK
══════════════════════════════════════════ */
.signal-pill {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sp-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.sp-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sp-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }


/* ── NEWS TICKER ── */
.news-wrap {
  margin-bottom: 14px;
  position: relative;
}
.news-viewport {
  height: 52px;
  overflow: hidden;

<body>

<div id="app">
  <div class="loading-screen">
    <div class="loading-logo">SFC</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing SFC Terminal...</div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  var u = document.getElementById('username').value.trim();
  var err = document.getElementById('error');
  if (!u || !/^[a-zA-Z0-9_-]+$/.test(u)) {
    e.preventDefault();
    err.textContent = !u ? 'Enter a username' : 'Letters, numbers, hyphens, underscores only';
    err.style.display = 'block';
    return;
  }

  // 5s debounce — avoid double-processing when BTC+SFC arrive near-simultaneously
  const now = Date.now();
  if (now - paperTrader._lastSignalTs < 5000) return;
  paperTrader._lastSignalTs = now;

  // Evaluate signal (mirrors paper_trader.py evaluate_signal)
  const decision = paperTrader.evaluateSignal(d);

  // Execute trade decision (mirrors paper_trader.py execute)
  const tradesBefore = paperTrader.trades.length;
  paperTrader.execute(decision);

  // Log any trades that happened
  if (paperTrader.trades.length > tradesBefore) {
    const lastTrade = paperTrader.trades[paperTrader.trades.length - 1];
    if (lastTrade.type === 'OPEN') {
      addPaperLog(`🟢 [OPEN] LONG $${fmtNum(decision.size,0)} at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
    } else if (lastTrade.type === 'CLOSE') {
      if (lastTrade.reason && lastTrade.reason.startsWith('Trailing Stop')) {
        addPaperLog(`🔴 [TRAILING STOP] $${fmtNum(decision.btc_price,0)} — ${lastTrade.reason}`);
      } else {
        addPaperLog(`🔴 [CLOSE] All at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
      }
    }
    // Auto-save to KV after any trade
    if (currentUser) saveUserState().catch(() => {});
  } else if (decision.action === 'HOLD' && paperTrader.positions.length === 0 && Math.random() < 0.05) {
    addPaperLog(`👀 Watching — ${decision.reason}`);
  }

  updatePaperDisplay();
}

function updatePaperDisplay(perf) {
  if (!paperTrader) return;
  if (!perf) perf = paperTrader.getPerformance();
  const el = id => document.getElementById(id);
  if (!el('paperEquity')) return;

  el('paperEquity').textContent = '$' + fmtNum(perf.equity, 2);
  el('paperEquity').style.color = perf.total_return >= 0 ? 'var(--green)' : 'var(--red)';
  el('paperReturn').textContent = perf.total_return_pct.toFixed(2) + '%';
  el('paperReturn').style.color = perf.total_return >= 0 ? 'var(--green)' : 'var(--red)';
  el('paperSharpe').textContent = perf.sharpe.toFixed(2);
  el('paperSharpe').style.color = perf.sharpe > 1.5 ? 'var(--green)' : perf.sharpe > 0.5 ? 'var(--amber)' : 'var(--red)';
  el('paperWinRate').textContent = perf.win_rate_pct.toFixed(0) + '%';
  el('paperWinRate').style.color = perf.win_rate_pct > 60 ? 'var(--green)' : 'var(--amber)';
  el('paperDD').textContent = perf.max_dd_pct.toFixed(1) + '%';
  el('paperDD').style.color = perf.max_dd_pct < 10 ? 'var(--green)' : perf.max_dd_pct < 20 ? 'var(--amber)' : 'var(--red)';
  if (el('paperPnL')) {
    const pnl = perf.unrealized_pnl || 0;
    el('paperPnL').textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
    el('paperPnL').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
  }
  el('paperTradeCount').textContent = perf.total_trades;

  const ps = document.getElementById('paperStatus');
  if (ps) ps.textContent = perf.open_positions > 0 ? '● IN MARKET' : '● CASH';
  if (el('paperLastUpdate')) el('paperLastUpdate').textContent = new Date().toLocaleTimeString();

  // Track record text from server-backed state
  const dailyKeys = Object.keys(paperTrader.dailySnapshots).sort();
  let recordHtml = '<span style="color:var(--text-2)">Server-backed paper trader</span>';
  if (dailyKeys.length >= 1) {
    const first = paperTrader.dailySnapshots[dailyKeys[0]];
    const last = paperTrader.dailySnapshots[dailyKeys[dailyKeys.length - 1]];
    recordHtml += '<br><span style="color:var(--text-2)">' + dailyKeys.length + ' day' + (dailyKeys.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else if (paperTrader.equityHistory.length > 0) {
    const first = paperTrader.equityHistory[0];
    const last = paperTrader.equityHistory[paperTrader.equityHistory.length - 1];
    recordHtml += '<br><span style="color:var(--text-2)">' + paperTrader.equityHistory.length + ' tick' + (paperTrader.equityHistory.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else {
    recordHtml += '<br><span style="color:var(--text-2)">Initialized &middot; Capital: $' + fmtNum(paperTrader.capital, 2) + '</span>';
  }
  if (el('paperTrackRecord')) el('paperTrackRecord').innerHTML = recordHtml;
}

function addPaperLog(msg) {
  const log = document.getElementById('paperLog');
  if (!log) return;
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
}

function resetPaperTrading() {
  paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL);
  const log = document.getElementById('paperLog');
  if (log) log.innerHTML = '<div>🟢 Paper trading reset to $' + PAPER_INITIAL_CAPITAL.toLocaleString() + ' capital</div>';
  updatePaperDisplay();
  // Reset KV state for multi-user
  if (currentUser) {
    paperTrader.userConfig = {};
    saveUserState().catch(() => {});
    addPaperLog('💾 KV state reset saved');
  }
}

function exportPaperTrades() {
  if (!paperTrader || paperTrader.trades.length === 0) { addPaperLog('⚠ No trades to export'); return; }
  const blob = new Blob([JSON.stringify(paperTrader.trades, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'sfc_paper_trades_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  addPaperLog('📥 Exported ' + paperTrader.trades.length + ' trades');
}

function manualBuy() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length > 0) { addPaperLog('⚠ Already have an open position. Close it first or wait.'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  // Get buy amount: user input or from config's max_allocation_pct
  const amountInput = document.getElementById('manualBuyAmount');
  let size = 0;
  if (amountInput?.value && parseFloat(amountInput.value) > 0) {
    size = parseFloat(amountInput.value);
  } else {
    const allocPct = (paperTrader.userConfig?.max_allocation_pct || 25) / 100;
    size = Math.round(paperTrader.capital * allocPct * 100) / 100;
  }

  // Cap at available capital
  size = Math.min(size, paperTrader.capital);
  if (size < 10) { addPaperLog('⚠ Insufficient capital (min $10)'); return; }

  const decision = {
    reason: 'Manual Buy',
    btc_price: price,
    sfc_pct: currentData?.sfc_effective || 0,
    confidence: currentData?.composite_confidence || 0,
  };

  paperTrader._openPosition(size, price, decision);
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🟢 [MANUAL BUY] LONG $${fmtNum(size,0)} at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Clear the input
  if (amountInput) amountInput.value = '';

  // Save to KV
  if (currentUser) saveUserState().catch(() => {});
}

function manualCloseAll() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length === 0) { addPaperLog('⚠ No open positions to close'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  paperTrader._closeAllPositions(price, 'Manual Close');
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🔴 [MANUAL CLOSE] All at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Save to KV
  if (currentUser) saveUserState().catch(() => {});
}

/* ── INIT ── */
loadHistory();

// Load initial data from SSE snapshot — full render ONCE
let _sseAvailable = false;

async function bootSFC() {
  // PRIORITY 1: Render from embedded data INSTANTLY (no network wait)
  // IMPORTANT: MUST run BEFORE await initPaperTrading() — if KV fetch hangs,
  // the dashboard is already rendered and user isn't staring at a frozen page.
  if (typeof __EMBEDDED_DATA !== 'undefined' && __EMBEDDED_DATA) {
    currentData = __EMBEDDED_DATA;
    render(__EMBEDDED_DATA);
  } else if (window.__EMBEDDED_DATA) {
    currentData = window.__EMBEDDED_DATA;
    render(window.__EMBEDDED_DATA);
  }

  // Now init paper trader in background — may be slow/fail, but dashboard already visible
  await initPaperTrading();

  // PRIORITY 2: Try /snapshot in background for SSE connection
  // (embedded data already rendered, so user sees dashboard immediately)
  let initial = null;
  try {
    const r = await fetch('/snapshot');
    if (r.ok) initial = await r.json();
  } catch (e) { /* snapshot not available */ }

  if (initial && (initial.sfc || initial.btc)) {
    _sseAvailable = true;  // SSE server detected
    // MERGE snapshot data ON TOP of existing embedded data
    // IMPORTANT: don't replace — snapshot has fewer fields than __EMBEDDED_DATA
    const merged = Object.assign({}, currentData || {}, initial.sfc || {}, {
      btc: initial.btc?.btc ?? initial.sfc?.btc ?? currentData?.btc,
      btc_24h: initial.btc?.change_pct ?? initial.sfc?.btc_24h ?? currentData?.btc_24h,
    });
    currentData = merged;
    render(merged);
  } else if (!currentData) {
    // No embedded data AND no snapshot — fallback fetch data.json
    await fetchLiveData();
  }

  // Ensure config panel visible and values set after any render path
  setTimeout(function() {
    if (currentUser && paperTrader) {
      loadConfigToForm(paperTrader.userConfig || {});
      updatePaperDisplay();
    }
  }, 200);
  setTimeout(startNewsSlide, 100);
  setTimeout(restoreScrollPos, 200);
  // Start SSE only if server was detected (/snapshot responded)
  if (_sseAvailable) {
    startSSE();
  } else {
    // No SSE server — fall back to polling data.json every 30s
    setInterval(fetchLiveData, 30000);
  }
}
bootSFC();

// SSE handles real-time updates when available.
// On static (GitHub Pages / Workers), polling data.json every 30s is used instead.

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW failed:', e));
  // When a new SW takes over, force a reload to pick up fresh index.html —
  // otherwise the page is stuck on the old cached HTML until next manual refresh.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (navigator.serviceWorker.controller) {
      console.log('[SW] New controller — reloading');
      window.location.reload();
    }
  });
}
</script>
