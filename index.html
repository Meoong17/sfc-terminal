    <div class="tab-panel" data-tab="help">
    <div class="help-panel">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">How to Read SFC Terminal</div>
        <div style="font-size:10px;color:var(--text-3)">Complete reference for every dashboard component &mdash; all indicators, signals, and tools explained</div>
        <div class="help-grid">

          <!-- 1. NAVIGATION & LAYOUT -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--cyan)">Navigation &amp; Layout</div>
            <div class="help-body"><strong>Dashboard tabs</strong> organise the main content:<ul><li><strong>Overview</strong> — SFC gauge, factor chart, momentum, confidence, price chart</li><li><strong>Risk</strong> — liquidation, cascade, transition risk, on-chain panels</li><li><strong>Ensemble</strong> — 6-method bar chart, consensus ring, model scores, walk-forward backtest</li><li><strong>Macro</strong> — liquidity intelligence, global macro &amp; stablecoin flows</li><li><strong>On-Chain</strong> — behavioral signals, ML models, XAI breakdown</li></ul>The <strong>Status Band</strong> at top shows live chips: Regime, Liquidation Pressure, SOPR Signal, RSI, DVOL, ADV, Shock alerts. The <strong>KPI Row</strong> below gives BTC price, SFC %, DVOL, Fear &amp; Greed, Confidence, and BTC Dominance.</div>
          </div>

          <!-- 2. SFC STRESS INDEX -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--cyan)">SFC Stress Index</div>
            <div class="help-body"><strong>0&ndash;100% composite stress probability.</strong> Combines 6 core methods + 22+ institutional models into a single score.<ul><li><span style="color:var(--green)">Normal</span> (0-25%) &mdash; calm, standard allocation</li><li><span style="color:var(--amber)">Elevated</span> (25-50%) &mdash; caution warranted</li><li><span style="color:var(--red)">Critical</span> (50-100%) &mdash; hedge or move to cash</li></ul>Effective SFC = Base + News Stress&Delta; + Liquidation Modifier. The arc gauge and progress bar give a quick visual read. Below the gauge, the <strong>Factor Chart</strong> breaks down stress into its underlying components (Lt/St/Rt/Ft/Sc).</div>
          </div>

          <!-- 3. 6-METHOD ENSEMBLE -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--green)">6-Method Ensemble</div>
            <div class="help-body">Six independent models, each estimating stress probability from different angles:<ul><li><strong>KLR</strong> &mdash; Kernel Logistic Regression</li><li><strong>Logit</strong> &mdash; Logistic regression z-score</li><li><strong>Bayes</strong> &mdash; Bayesian prior + multiplier</li><li><strong>EWC</strong> &mdash; Equal-Weighted Composite</li><li><strong>QREG</strong> &mdash; Quantile Regression (tail behaviour)</li><li><strong>Regime</strong> &mdash; Extreme condition detector</li></ul><strong>Consensus</strong> shows how many methods agree: &gt;60% = strong signal, &lt;30% = unreliable. The consensus ring and bar chart update in real time. Also displays active method count (M7&ndash;M31 institutional stack).</div>
          </div>

          <!-- 4. SIGNAL & ACTION PILL -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Signal &amp; Action Pill</div>
            <div class="help-body"><strong>The coloured pill in the nav bar and Signal card shows the recommended action.</strong><ul><li><span style="color:var(--green)">BUY</span> &mdash; positive edge, Kelly &gt; 0</li><li><span style="color:var(--amber)">WATCH</span> &mdash; neutral zone, no strong signal</li><li><span style="color:var(--red)">CASH</span> &mdash; Kelly &le; 0 or negative edge, stay out</li></ul>Underlying metrics: <strong>Transition Risk</strong> (&gt;50% = regime shift likely), <strong>Readiness Score</strong> (how favourable conditions are for entry/exit), and <strong>BTC vs Floor %</strong> (distance from dynamic floor &mdash; closer = safer entry zone).</div>
          </div>

          <!-- 5. BTC PRICE & DYNAMIC FLOOR -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--blue)">BTC Price &amp; Dynamic Floor</div>
            <div class="help-body"><strong>Dynamic Floor</strong> = Price &times; (1 &minus; SFC% &times; 0.6).<ul><li>0% stress: floor = price (no discount)</li><li>50% stress: floor = price &times; 0.70</li><li>Price approaching the floor signals a risk-off zone &mdash; potential buying opportunity</li></ul>The <strong>Price Chart</strong> plots BTC vs Floor over recent history. ATH and current floor values are shown in the KPI row. Toggle chart visibility with the Show/Hide button in the status band.</div>
          </div>

          <!-- 6. MOMENTUM & ON-CHAIN -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--purple)">Momentum &amp; On-Chain</div>
            <div class="help-body"><strong>RSI-14M (monthly):</strong> <span style="color:var(--green)">&lt;30</span> Oversold &middot; <span style="color:var(--text-2)">30-70</span> Neutral &middot; <span style="color:var(--red)">&gt;70</span> Overbought<br><strong>SOPR Proxy:</strong> <span style="color:var(--green)">&lt;0.97</span> Capitulation (potential bottom) &middot; <span style="color:var(--red)">&gt;1.03</span> Distribution (potential top)<br><strong>DVOL</strong> = Deribit implied volatility index.<br><strong>On-Chain panel:</strong> GARCH volatility, Value-at-Risk (VaR 95%), Expected Shortfall (ES 95%), Jump Risk probability, and Order Book Imbalance (OBI). OBI &lt; &minus;0.3 = sell pressure, &gt; +0.3 = buy pressure.</div>
          </div>

          <!-- 7. LIQUIDATION & RISK -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--red)">Liquidation &amp; Cascade Risk</div>
            <div class="help-body"><strong>Pressure direction:</strong><ul><li><span style="color:var(--red)">Long Squeeze</span> &mdash; shorts pressing longs, cascading liquidations likely</li><li><span style="color:var(--green)">Short Squeeze</span> &mdash; longs pressing shorts, sharp upside possible</li><li><span style="color:var(--amber)">Balanced</span> &mdash; no directional pressure</li></ul><strong>Cascade Risk</strong> &gt;50% = systemic liquidation chain possible. <strong>P/C OI &amp; Vol</strong> &gt;1.0 signals bearish options positioning. 24-hour liquidation volume from OKX broken into Long/Short sides.</div>
          </div>

          <!-- 8. COMPOSITE CONFIDENCE -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--green)">Composite Confidence</div>
            <div class="help-body"><strong>How much to trust the SFC signal.</strong> Formula: <em>Macro Confidence &times; (1 &minus; Execution Risk)</em>.<ul>
              <li><strong>METHOD AGREE</strong> &mdash; how many of the 90+ analysis methods point the same direction</li>
              <li><strong>LOW STRESS BOOST</strong> &mdash; confidence bonus when market conditions are calm</li>
              <li><strong>RSI</strong> &mdash; short-term price momentum (overbought/oversold)</li>
              <li><strong>SOPR</strong> &mdash; whether holders are selling at a profit or a loss on average</li>
              <li><strong>DVOL</strong> &mdash; implied volatility from BTC options pricing</li>
              <li><strong>MACRO PENALTY</strong> &mdash; combined reduction from extreme RSI/SOPR/FNG/news/volatility</li>
              <li><strong>MACRO CONFIDENCE</strong> &mdash; directional conviction BEFORE execution risk is applied</li>
              <li><strong>EXECUTION RISK</strong> &mdash; risk of getting trapped if the market moves fast (cascade + squeeze + funding). Reduces position SIZE, not direction</li>
              <li><strong>CASCADE RISK RAW</strong> &mdash; raw estimate of chain-liquidation risk</li>
              <li><strong>FUNDING IMBALANCE</strong> &mdash; how skewed funding rates are between longs and shorts</li>
              <li><strong>SQUEEZE MAGNITUDE</strong> &mdash; how much short/long squeeze pressure is currently building</li>
              <li><strong>CASCADE PENALTY</strong> &mdash; the portion of Execution Risk coming from Cascade Risk</li>
              <li><strong>FEAR PENALTY</strong> &mdash; reduction when Fear &amp; Greed hits an extreme (very fearful or very greedy)</li>
              <li><strong>NEWS PENALTY</strong> &mdash; reduction from negative news sentiment</li>
              <li><strong>VOL PENALTY</strong> &mdash; reduction when implied volatility (DVOL) is very high</li>
              <li><strong>TRANSITION PENALTY</strong> &mdash; reduction when a regime change looks likely</li>
            </ul>The number on each row (e.g. <span style="color:var(--green)">+18.9%</span> or <span style="color:var(--red)">&minus;7.4%</span>) shows how strongly and in which direction that component pushes the final confidence. Below 30% = extreme caution; above 60% = high conviction.</div>
          </div>

          <!-- 9. KELLY POSITION SIZING -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Kelly Position Sizing</div>
            <div class="help-body"><strong>Translates confidence &rarr; position size.</strong><ul><li><strong>Max Allocation</strong> = full Kelly fraction (aggressive)</li><li><strong>Safe Allocation</strong> = &frac12; Kelly (conservative, reduced variance)</li><li><strong>0%</strong> = no edge, stay cash</li></ul><strong>Alert Window:</strong> ~48h advance notice before stress events. <strong>Timing Precision:</strong> HIGH or LOW based on signal consistency. Never exceed the max allocation recommendation &mdash; it is derived from the Kelly criterion for optimal long-term growth.</div>
          </div>

          <!-- 10. BACKTEST METRICS (ESTIMATED) -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Backtest Metrics (Estimated)</div>
            <div class="help-body">⚠ <strong>These are heuristic estimates, not a walk-forward validated backtest.</strong> They're derived from current signal quality (method agreement, confidence, implied volatility) rather than a simulated trade history &mdash; see the amber warning banner on the card itself for the full caveat.<ul><li><strong>Sharpe Ratio</strong> (labeled with ~) &mdash; higher generally better, but treat as directional only</li><li><strong>Win Rate</strong> (~) &mdash; estimated proportion of favorable outcomes, not from actual trade simulation</li><li><strong>Max Drawdown</strong> &mdash; derived from implied volatility (DVOL), not observed portfolio history</li><li><strong>Stability</strong> &mdash; signal consistency proxy</li></ul>The <strong>calibration note</strong> under the numbers explicitly states these are upper-bound estimates due to limited stress events in the training window. Use these for rough directional reference only — SFC Terminal is an analysis tool, not a trade execution or simulation platform.</div>
          </div>

          <!-- 11. ADVANCED ML MODELS -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--purple)">Advanced ML Models</div>
            <div class="help-body"><strong>Five complementary ML layers that refine the SFC stress estimate.</strong><ul><li><strong>Feature Engineering (AFE)</strong> &mdash; 14 quality technical indicators computed from daily BTC klines: RSI-14, MACD, EMA crossover, Bollinger Bands width, ATR, VWAP, OBV, Chaikin Money Flow. Hovering near extremes confirms stress signals.</li><li><strong>XGBoost Meta-Ensemble</strong> &mdash; a gradient-boosted tree trained on 31 method scores from git history. It learns which methods best predict stress in different conditions and blends into the final SFC at 0-30% weight.</li><li><strong>HMM Regime Detection</strong> &mdash; Hidden Markov Model with 4 states (BULL, BEAR, SIDEWAYS, CRISIS) trained on BTC returns, DVOL, SFC, RSI, and F&G. Overrides the rule-based regime when it detects CRISIS or BEAR conditions that the rules miss.</li><li><strong>Multi-Timeframe Fusion (MTF)</strong> &mdash; fetches 1h, 4h, 1d, and 1w klines from Binance. Computes EMA cross, momentum, and RSI per timeframe. Alignment score (&minus;1 to +1) shows cross-timeframe consensus. Divergence (1h/4h vs 1d/1w) warns of conflicting trends.</li><li><strong>Online Learning (EWMA)</strong> &mdash; Exponentially Weighted Moving Average that adaptively corrects the stress estimate each cycle. Persisted between runs via models/ewma_state.json. Blends past baseline with new observations for smooth adaptation.</li></ul>All five modules are displayed in the <strong>Advanced ML Signals</strong> card on the Risk tab. Each shows its current value and availability status.</div>
          </div>

          <!-- 12. QLSTM, XAI & LEGACY ML -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--purple)">QLSTM, XAI &amp; Legacy ML</div>
            <div class="help-body"><strong>Quantum LSTM prediction + explainability.</strong><ul><li><span style="color:var(--red)">&uarr; positive</span> = this feature raises SFC stress</li><li><span style="color:var(--green)">&darr; negative</span> = this feature lowers SFC stress</li><li><strong>Hybrid</strong> = QLSTM + GARCH residual blend</li><li><strong>ProAdapt</strong> = adaptive weight, updated online</li></ul><strong>Mamba SSM:</strong> <span style="color:var(--red)">DISABLED</span> — state-space model output collapsed to zero (numerical explosion in selective scan), no longer contributes to the ensemble as of model v4.0.0. Kept in the data for transparency (shows 0.0) but does not affect SFC score. <strong>Legacy methods:</strong> DRL signal, SHAP top-1 driver, LIME top-3 drivers are available in the data but have been superseded by the newer ML ensemble.</div>
          </div>

          <!-- 12. MACRO & BEHAVIORAL CONTEXT -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--blue)">Macro &amp; Behavioral Context</div>
            <div class="help-body"><strong>Macro Context panel:</strong> DXY (dollar index), M2 YoY (money supply growth), Real Rate, Fed Rate, CPI YoY, Yield Curve Slope (inverted = recession signal).<br><br><strong>Behavioral panel:</strong> <strong>Minsky Stage</strong> (credit cycle position), <strong>Loss Aversion</strong> (trader fear gauge), <strong>Tail Danger</strong> (extreme event warning), <strong>Debt/GDP</strong> (national leverage), <strong>Altman-Z</strong> (corporate distress score &gt;4 = healthy), <strong>Reddit Sentiment</strong> (crowd bias from social media).</div>
          </div>

          <!-- 12b. GLOBAL LIQUIDITY FACTOR -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--blue)">Global Liquidity Factor (GLF)</div>
            <div class="help-body"><strong>The primary liquidity signal this model is built around.</strong> A weighted composite of central bank balance sheet growth and USD strength: <strong>Fed</strong> (30%), <strong>ECB</strong> (15%), <strong>China M2</strong> (4%), <strong>BOJ</strong> (3%), <strong>US M2</strong> (15%), <strong>TGA</strong> (10%), <strong>RRP</strong> (10%), <strong>DXY inverted</strong> (13%). Each component is converted to a year-over-year z-score before weighting, so GLF reflects how expansionary or contractionary global liquidity is <em>relative to its own recent history</em>, not an absolute level.<br><br><strong>Reading it:</strong> GLF &gt; 50 = liquidity expanding faster than usual (generally bullish for risk assets including BTC). GLF &lt; 50 = contracting (bearish). <strong>Regime label</strong> (EXPANSIVE / NEUTRAL / CONTRACTIVE) gives a quick read without needing to parse the raw score.<br><br><em>Known limitation:</em> the mean/std used for each component's z-score are periodically re-verified against real FRED history (see the <code>liquidity_zscore_calibration.py</code> tool) rather than assumed — if a component looks stuck at an extreme z-score for a long stretch, that's worth rechecking.</div>
          </div>

          <!-- 12c. REPO MARKET STRESS -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--red)">Repo Market Stress (M86)</div>
            <div class="help-body"><strong>SOFR&ndash;EFFR spread</strong> &mdash; measures whether short-term dollar funding markets are transmitting liquidity smoothly <em>right now</em>, as distinct from GLF's slower-moving central-bank-balance-sheet signal. SOFR (Secured Overnight Financing Rate, collateralized) and EFFR (Effective Fed Funds Rate, unsecured) normally trade within a few basis points of each other.<br><br>When SOFR spikes <strong>above</strong> EFFR, it means demand for overnight cash against safe collateral has outstripped supply &mdash; a genuine funding stress signal, historically most visible during the <strong>September 2019 repo crisis</strong> (spread reached ~300bp, forcing emergency Fed intervention). <br><br><strong>Why this matters even when GLF looks healthy:</strong> ample central-bank liquidity can coexist with a funding-market seizure at the transmission layer &mdash; Sept 2019 is the textbook case. This is why M86 feeds the <strong>Ft (systemic/funding)</strong> factor separately from GLF's Lt contribution, rather than being folded into the same score.</div>
          </div>

          <!-- 13. ADVANCED ML SIGNALS CARD -->

/* ── KPI ROW COUNT-UP ──
   After a full re-render, the KPI numbers are already painted with the new value.
   This rewinds each tracked KPI to its previous value then animates up to the new one,
   skipping entirely on first load (prevData is null). */
function animateKpiRow(prevData, d) {
  if (!prevData) return; // first render — no baseline, leave static
  const sfcEffNew = d.sfc_effective || 0;
  const sfcEffOld = prevData.sfc_effective || 0;
  const confNew = (d.composite_confidence ?? 0.5) * 100;
  const confOld = (prevData.composite_confidence ?? 0.5) * 100;

  const targets = [
    { sel: '#btcPriceKpi', from: prevData.btc, to: d.btc, fmt: v => '$' + fmtNum(v) },
    { sel: '.kpi-row .kpi:nth-child(2) .kpi-num', from: sfcEffOld, to: sfcEffNew, fmt: v => v.toFixed(1) + '%' },
    { sel: '.kpi-row .kpi:nth-child(3) .kpi-num', from: prevData.dvol, to: d.dvol, fmt: v => fmtNum(v,1) + '%' },
    { sel: '.kpi-row .kpi:nth-child(4) .kpi-num', from: prevData.fng, to: d.fng, fmt: v => Math.round(v).toString() },
    { sel: '.kpi-row .kpi:nth-child(5) .kpi-num', from: confOld, to: confNew, fmt: v => Math.round(v) + '%' },
    { sel: '.kpi-row .kpi:nth-child(6) .kpi-num', from: prevData.dom, to: d.dom, fmt: v => fmtNum(v,1) + '%' },
  ];
  targets.forEach(t => {
    const el = document.querySelector(t.sel);
    if (!el || typeof t.to !== 'number' || isNaN(t.to)) return;
    if (typeof t.from === 'number' && !isNaN(t.from)) {
      el.dataset.rawValue = t.from; // seed baseline so animateNumber animates instead of snapping
    }
    animateNumber(el, t.to, t.fmt);
  });
}

/* ── SSE CONNECTION ── */
let sseSource = null;
let sseReconnectTimer = null;

function startSSE() {
  // Close existing connection if any
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  if (sseReconnectTimer) {
    clearTimeout(sseReconnectTimer);
    sseReconnectTimer = null;
  }

  try {
    sseSource = new EventSource('/events');

    sseSource.addEventListener('btc_ticker', function(e) {
      try {
        const data = JSON.parse(e.data);
        partialUpdate(data);
      } catch (err) {
        console.log('[SSE] btc_ticker parse error:', err);
      }
    });

    sseSource.addEventListener('sfc_update', function(e) {
      try {
        const data = JSON.parse(e.data);
        if (data.btc != null || data.sfc_effective != null) {
          // Merge BTC ticker data from btc_ticker event into sfc data
          // to avoid stale BTC in the full render
          if (currentData) {
            Object.assign(data, { btc: data.btc || currentData.btc });
          }
          currentData = data;
          render(data);
          startNewsSlide();
          // Restore config panel after SSE render
          if (paperTrader) {
            updatePaperDisplay();
          }
        }
      } catch (err) {
        console.log('[SSE] sfc_update parse error:', err);
      }
    });

    sseSource.onerror = function() {
      console.log('[SSE] Connection lost — will retry');
      if (sseSource) {
        sseSource.close();
        sseSource = null;
      }
      // Reconnect after 5s
      sseReconnectTimer = setTimeout(startSSE, 5000);
    };
  } catch (e) {
    console.log('[SSE] Failed to create EventSource:', e);
    // Fallback: start polling after a delay
    sseReconnectTimer = setTimeout(startSSE, 10000);
  }
}

/* ── FETCH (fallback polling — used only if SSE fails) ── */
async function fetchLiveData() {
  const dot = document.getElementById('syncDot');
  if (dot) dot.classList.add('is-syncing');
  try {
    // Save actual scroll position before DOM rebuild
    const savedScrollY = window.scrollY;
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    currentData = data;
    window.__EMBEDDED_DATA = data;
    render(data);
    // Restore exact scroll position (not activeTab section)
    window.scrollTo({ top: savedScrollY, behavior: 'instant' });
    startNewsSlide();
    // Restore config panel values after render
    if (paperTrader) {
      updatePaperDisplay();
    }
    return true;
  } catch (e) {
    console.log('Fetch failed:', e);
    return false;
  } finally {
    const dotAfter = document.getElementById('syncDot');
    if (dotAfter) dotAfter.classList.remove('is-syncing');
  }
}

/* ── PAPER TRADING ENGINE (mirrors server paper_trader.py) ── */
const PAPER_INITIAL_CAPITAL = 50000;
const PAPER_MAX_POSITION_PCT = 0.25;
// Mirrors paper_trader.py's MAX_HOLDING_HOURS and BID_ASK_SPREAD_PCT —
// see that file's comments for the full reasoning (24h ≈ 4x the model's
// own 6h prediction horizon; spread is a real per-trade cost previously
// unmodeled on the JS side).
const PAPER_MAX_HOLDING_HOURS = 24;
const PAPER_BID_ASK_SPREAD_PCT = 0.0005;

class PaperTrader {
  constructor(capital = PAPER_INITIAL_CAPITAL, state = null) {
    if (state) {
      // Load from server state
      this.capital = state.capital || capital;
      this.initial = state.initial_capital || capital;
      this.peakCapital = state.peak_capital || capital;
      this.positions = state.positions || [];
      this.trades = state.trades || [];
      this.equityHistory = state.equity_history || [];
      this.dailySnapshots = state.daily_snapshots || {};
      this._initialized = true;
      this._serverStateLoaded = true;
      this._serverStateLogged = false;
    } else {
      this.capital = capital;
      this.initial = capital;
      this.peakCapital = capital;
      this.positions = [];        // open positions [{type,entry_price,size,entry_date,reason,sfc_at_entry,confidence_at_entry}]
      this.trades = [];            // all trades [{id,type,date,price,size,...}]
      this.equityHistory = [];     // [{ts,btc,equity,capital,unrealized}]
      this.dailySnapshots = {};    // date -> {equity,return_pct,sharpe,win_rate,max_dd_pct,total_trades,open_positions,status}
      this._initialized = false;
      this._serverStateLoaded = false;
    }
    this.status = this.positions.length > 0 ? 'IN_MARKET' : 'IDLE';
    this._lastSignalTs = 0;
    this._unrealized = 0;
    this._trailingStopTriggered = false;
  }

  evaluateSignal(d) {
    const sfc = (d.sfc_effective || 0) / 100;
    const conf = d.composite_confidence || 0.3;
    // Switched from d.kelly_fraction (Full Kelly) to d.kelly_half — matches
    // the same change made in paper_trader.py (server-side). Full Kelly
    // combined with confidence_calibration.py's own measured ECE=0.216
    // ("poorly calibrated") compounds two sources of risk: an aggressive
    // bet size on top of an edge estimate that isn't reliably accurate.
    // Falls back to computing half manually if kelly_half is missing from
    // an older/cached data.json (defensive, shouldn't trigger normally).
    const kelly = (d.kelly_half !== undefined && d.kelly_half !== null)
      ? d.kelly_half
      : (d.kelly_fraction || 0) / 2;
    const fng = d.fng || 50;
    const cascade = d.cascade_risk || 0;
    const regime = d.regime || 'NORMAL';
    const zone = d.zone || 'NORMAL';
    const btc = d.btc || 0;
    const signalType = d.signal_type || 'CALM';

    const isExtremeFear = fng < 15;
    const hasCascade = cascade > 0.5;
    const bearConf = d.prob_stress || 0;  // matches Python's bear_conf (prob_stress)

    let action, reason;
    if (kelly <= 0) {
      action = 'CASH';
      reason = 'No edge';
      if (d.kelly_override_reason === 'TRANSITION_RISK_OVER_60') reason = 'Transition Risk >60% · Forced CASH';
      else if (isExtremeFear) reason = `FNG ${fng} · Extreme Fear`;
      else if (hasCascade) reason = `Cascade Risk ${(cascade*100).toFixed(0)}%`;
    } else if (sfc < 0.25 && conf > 0.15) {
      action = 'BUY';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Conf ${(conf*100).toFixed(0)}%`;
    } else if (sfc >= 0.45 && bearConf > 0.4) {
      // Strong bearish signal + bearish confidence → SHORT — mirrors
      // paper_trader.py's SELL branch (uses prob_stress as bear_conf).
      action = 'SELL';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Bear ${(bearConf*100).toFixed(0)}%`;
    } else if (sfc >= 0.45) {
      action = 'CASH';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Stress too high`;
    } else {
      action = 'HOLD';
      reason = `SFC ${(sfc*100).toFixed(0)}% · Neutral zone`;
    }

    let sizePct = 0;
    if (action === 'BUY' || action === 'SELL') {
      sizePct = Math.min(kelly, PAPER_MAX_POSITION_PCT);
      sizePct *= Math.min(conf * 2, 1.0);
    }

    const size = Math.round(this.capital * sizePct * 100) / 100;

    return {
      action,
      size: (action === 'BUY' || action === 'SELL') ? size : 0,
      reason,
      btc_price: btc,
      sfc_pct: Math.round(sfc * 1000) / 10,
      confidence: Math.round(conf * 100),
      kelly_pct: Math.round(kelly * 1000) / 10,
      regime,
      zone,
      signal_type: signalType,
      is_short: action === 'SELL',
    };
  }

  execute(decision) {
    const price = decision.btc_price || 0;
    if (!price || price <= 0) return;

    const isShort = decision.is_short || false;

    // Get user's TP/SL config
    const tpPct = (this.userConfig?.take_profit_pct || 0) / 100;
    const slPct = (this.userConfig?.stop_loss_pct || 0) / 100;

    // Check TAKE PROFIT for each position — direction depends on LONG vs
    // SHORT (previously assumed LONG only: `price >= tpTarget` is only
    // correct for LONG, where profit comes from price rising; a SHORT
    // profits from price FALLING, so its TP target must be BELOW entry).
    if (tpPct > 0 && this.positions.length > 0) {
      const pos = this.positions[0];
      const tpTarget = pos.type === 'SHORT'
        ? pos.entry_price * (1 - tpPct)
        : pos.entry_price * (1 + tpPct);
      const tpHit = pos.type === 'SHORT' ? (price <= tpTarget) : (price >= tpTarget);
      if (tpHit) {
        this._closeAllPositions(price, 'Take Profit ' + (tpPct * 100).toFixed(0) + '% · Hit $' + Math.round(price));
      }
    }

    // Check STOP LOSS for each position — same LONG/SHORT direction fix as TP above.
    if (slPct > 0 && this.positions.length > 0) {
      const pos = this.positions[0];
      const slTarget = pos.type === 'SHORT'
        ? pos.entry_price * (1 + slPct)
        : pos.entry_price * (1 - slPct);
      const slHit = pos.type === 'SHORT' ? (price >= slTarget) : (price <= slTarget);
      if (slHit) {
        this._closeAllPositions(price, 'Stop Loss ' + (slPct * 100).toFixed(0) + '% · Hit $' + Math.round(price));
      }
    }

    // ── Max holding period (NEW) — mirrors paper_trader.py's
    // MAX_HOLDING_HOURS=24. Previously a position could stay open
    // indefinitely if neither the signal flipped nor TP/SL/trailing-stop
    // triggered; given the model's own prediction horizon is 6 hours
    // (ml_ensemble.py's LABEL_LOOKAHEAD_MINUTES), 24h is ~4x that as a hard cap.
    if (this.positions.length > 0) {
      const pos = this.positions[0];
      const heldHours = (Date.now() - new Date(pos.entry_date).getTime()) / 3600000;
      if (heldHours >= PAPER_MAX_HOLDING_HOURS) {
        this._closeAllPositions(price, `Max holding period reached (${Math.round(heldHours)}h)`);
      }
    }

    // Close positions if signal says CASH or opposite direction
    if (this.positions.length > 0 && (
      decision.action === 'CASH'
      || (decision.action === 'BUY' && this.positions[0].type === 'SHORT')
      || (decision.action === 'SELL' && this.positions[0].type === 'LONG')
    )) {
      this._closeAllPositions(price, decision.action === 'CASH' ? 'Signal CASH' : 'Signal reversed');
    }

    // Open new position if signal says BUY/SELL and we're flat
    if ((decision.action === 'BUY' || decision.action === 'SELL') && this.positions.length === 0 && decision.size >= 10) {
      this._openPosition(decision.size, price, decision, isShort ? 'SHORT' : 'LONG');
    }

    // Update PnL for reporting
    this._updatePnL(price);
    this._updatePeak();
    // Trailing stop check — uses user's configured trailing stop %
    this._checkTrailingStop(price);
    this._dailySnapshot();
  }

  _openPosition(size, price, decision, posType = 'LONG') {
    // Bid-ask spread cost (NEW) — mirrors paper_trader.py's
    // BID_ASK_SPREAD_PCT. Previously no spread cost was modeled at all
    // on the JS side; net_size reduces the effective position size the
    // same way the Python engine does.
    const spreadCost = size * PAPER_BID_ASK_SPREAD_PCT;
    const netSize = size - spreadCost;
    if (netSize <= 0) return; // spread ate the whole position — skip

    this.positions.push({
      type: posType,
      entry_price: price,
      highest_price: price,
      lowest_price: price,
      size: netSize,
      entry_date: new Date().toISOString(),
      reason: decision.reason || '',
      sfc_at_entry: decision.sfc_pct,
      confidence_at_entry: decision.confidence,
      spread_cost_entry: Math.round(spreadCost * 100) / 100,
    });
    this.capital -= size;
    this.trades.push({
      id: this.trades.length + 1,
      type: 'OPEN',
      direction: posType,
      date: new Date().toISOString(),
      price: price,
      size: netSize,
      slippage: Math.round(spreadCost * 100) / 100,
      reason: decision.reason || '',
    });
    this.status = 'IN_MARKET';
  }

  _closeAllPositions(price, reason) {
    for (const pos of this.positions) {
      // Bid-ask spread cost on exit too.
      const spreadCost = pos.size * PAPER_BID_ASK_SPREAD_PCT;
      const grossPnl = pos.type === 'SHORT'
        ? (pos.entry_price - price) / pos.entry_price * pos.size
        : (price - pos.entry_price) / pos.entry_price * pos.size;
      const pnl = grossPnl - spreadCost;
      this.capital += pos.size + pnl;
      this.trades.push({
        id: this.trades.length + 1,
        type: 'CLOSE',
        direction: pos.type,
        date: new Date().toISOString(),
        price: price,
        size: pos.size,
        pnl: Math.round(pnl * 100) / 100,
        pnl_pct: Math.round((pos.type === 'SHORT'
          ? (pos.entry_price - price) / pos.entry_price
          : (price - pos.entry_price) / pos.entry_price) * 10000) / 100,
        slippage_exit: Math.round(spreadCost * 100) / 100,
        reason: reason,
      });
    }
    this.positions = [];
    this.status = 'IDLE';
  }

  _checkTrailingStop(price) {
    const TRAILING_PCT = (this.userConfig?.trailing_stop_pct || 15) / 100; // From user config, default 15%
    const toClose = [];
    for (const pos of this.positions) {
      if (pos.type === 'SHORT') {
        // SHORT profits from price falling — track the LOWEST price seen,
        // trigger if price rises back up from that low by TRAILING_PCT
        // (previously this function only handled LONG direction, tracking
        // highest_price and triggering on drops — silently wrong/inactive
        // for SHORT positions, which didn't exist in this file before).
        if (pos.lowest_price === undefined || price < pos.lowest_price) {
          pos.lowest_price = price;
        }
        const risePct = (price - pos.lowest_price) / pos.lowest_price;
        if (risePct >= TRAILING_PCT) {
          toClose.push(pos);
        }
      } else {
        // Update highest price seen
        if (price > pos.highest_price) {
          pos.highest_price = price;
        }
        // Check if price dropped from peak
        const dropPct = (pos.highest_price - price) / pos.highest_price;
        if (dropPct >= TRAILING_PCT) {
          toClose.push(pos);
        }
      }
    }
    if (toClose.length > 0) {
      this._trailingStopTriggered = true;
      const pos = toClose[0];
      const refPrice = pos.type === 'SHORT' ? pos.lowest_price : pos.highest_price;
      const arrow = pos.type === 'SHORT' ? '→' : '→';
      this._closeAllPositions(price, `Trailing Stop ${(TRAILING_PCT*100).toFixed(0)}% · ${pos.type === 'SHORT' ? 'Rise' : 'Drop'} ${Math.round(refPrice)}${arrow}${Math.round(price)}`);
    }
  }

  _updatePnL(price) {
    let unrealized = 0;
    for (const pos of this.positions) {
      if (pos.type === 'SHORT') {
        unrealized += (pos.entry_price - price) / pos.entry_price * pos.size;
      } else {
        unrealized += (price - pos.entry_price) / pos.entry_price * pos.size;
      }
    }
    this._unrealized = unrealized;
    const equity = this.capital + this.positions.reduce((s,p) => s + p.size, 0) + unrealized;
    this.equityHistory.push({
      ts: new Date().toISOString(),
      btc: price,
      equity: Math.round(equity * 100) / 100,
      capital: Math.round(this.capital * 100) / 100,
      unrealized: Math.round(unrealized * 100) / 100,
    });
    return equity;
  }

  // Real-time PnL update — no new history entry, just updates the last one
  _updatePnLRealtime(price) {
    if (this.positions.length === 0) return this.capital;
    let unrealized = 0;
    for (const pos of this.positions) {
      if (pos.type === 'SHORT') {
        unrealized += (pos.entry_price - price) / pos.entry_price * pos.size;
      } else {
        unrealized += (price - pos.entry_price) / pos.entry_price * pos.size;
      }
    }
    this._unrealized = unrealized;
    const equity = this.capital + this.positions.reduce((s,p) => s + p.size, 0) + unrealized;
    const rounded = Math.round(equity * 100) / 100;
    // Update the last history entry in-place
    if (this.equityHistory.length > 0) {
      const last = this.equityHistory[this.equityHistory.length - 1];
      last.btc = price;
      last.equity = rounded;
      last.unrealized = Math.round(unrealized * 100) / 100;
    }
    return equity;
  }

  _updatePeak() {
    const equity = this.getEquity();
    if (equity > this.peakCapital) this.peakCapital = equity;
  }

  _dailySnapshot() {
    const today = new Date().toISOString().slice(0, 10);
    const perf = this.getPerformance();
    this.dailySnapshots[today] = {
      date: today,
      equity: Math.round(perf.equity * 100) / 100,
      return_pct: Math.round(perf.total_return * 10000) / 100,
      sharpe: Math.round(perf.sharpe * 100) / 100,
      win_rate: Math.round(perf.win_rate * 10000) / 10000,
      max_dd_pct: Math.round(perf.max_dd * 10000) / 100,
      total_trades: perf.total_trades,
      open_positions: this.positions.length,
      status: this.positions.length > 0 ? 'IN_MARKET' : 'CASH',
    };
  }

  getEquity() {
    if (this.positions.length === 0) return this.capital;
    return this.equityHistory.length > 0 ? this.equityHistory[this.equityHistory.length - 1].equity : this.capital;
  }

  getPerformance() {
    const equity = this.getEquity();
    const totalReturn = (equity - this.initial) / this.initial;

    const closed = this.trades.filter(t => t.pnl !== undefined);
    const wins = closed.filter(t => t.pnl > 0);
    const winRate = closed.length > 0 ? wins.length / closed.length : 0;

    // Sharpe from equity history — only meaningful with 2+ entries
    const rets = [];
    if (this.equityHistory.length >= 2) {
      for (let i = 1; i < this.equityHistory.length; i++) {
        const prev = this.equityHistory[i - 1].equity;
        const cur = this.equityHistory[i].equity;
        if (prev > 0) rets.push((cur - prev) / prev);
      }
    }
    const mean = rets.length > 0 ? rets.reduce((a, b) => a + b, 0) / rets.length : 0;
    const std = rets.length > 1 ? Math.sqrt(rets.map(r => (r - mean) ** 2).reduce((a, b) => a + b, 0) / rets.length) : 1;
    const sharpe = std > 0 && rets.length > 1 ? mean / std * Math.sqrt(252) : 0;

    // Max drawdown
    let mdd = 0;
    let peak = this.initial;
    for (const h of this.equityHistory) {
      const eq = h.equity;
      if (eq > peak) peak = eq;
      const dd = peak > 0 ? (peak - eq) / peak : 0;
      if (dd > mdd) mdd = dd;
    }

    // ── Professional metrics (mirrors paper_trader.py) ──
    const losses = closed.filter(t => t.pnl <= 0);
    const downsideRets = rets.filter(r => r < 0);
    const downsideStd = downsideRets.length > 0
      ? Math.sqrt(downsideRets.map(r => r * r).reduce((a, b) => a + b, 0) / downsideRets.length) : 0;
    const sortino = downsideStd > 0 && rets.length > 1 ? mean / downsideStd * Math.sqrt(252) : sharpe;

    const grossProfit = wins.reduce((a, t) => a + t.pnl, 0);
    const grossLoss = Math.abs(losses.reduce((a, t) => a + t.pnl, 0));
    const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? null : 0);
    const avgWin = wins.length > 0 ? grossProfit / wins.length : 0;
    const avgLoss = losses.length > 0 ? grossLoss / losses.length : 0;
    const expectancy = closed.length > 0 ? (winRate * avgWin) - ((1 - winRate) * avgLoss) : 0;

    return {
      initial_capital: this.initial,
      capital: Math.round(this.capital * 100) / 100,
      equity: Math.round(equity * 100) / 100,
      peak_equity: Math.round(this.peakCapital * 100) / 100,
      total_return: Math.round(totalReturn * 10000) / 10000,
      total_return_pct: Math.round(totalReturn * 10000) / 100,
      sharpe: Math.round(sharpe * 100) / 100,
      sortino: Math.round(sortino * 100) / 100,
      win_rate: Math.round(winRate * 10000) / 10000,
      win_rate_pct: Math.round(winRate * 10000) / 100,
      max_dd: Math.round(mdd * 10000) / 10000,
      max_dd_pct: Math.round(mdd * 10000) / 100,
      profit_factor: profitFactor !== null ? Math.round(profitFactor * 100) / 100 : null,
      avg_win: Math.round(avgWin * 100) / 100,
      avg_loss: Math.round(avgLoss * 100) / 100,
      expectancy: Math.round(expectancy * 100) / 100,
      total_trades: this.trades.length,
      closed_trades: closed.length,
      winning_trades: wins.length,
      losing_trades: losses.length,
      open_positions: this.positions.length,
      unrealized_pnl: Math.round((this._unrealized || 0) * 100) / 100,
      status: this.positions.length > 0 ? 'IN_MARKET' : 'CASH',
    };
  }
}

let paperTrader = null;

async function initPaperTrading() {
  // Analysis-only: paper trading runs browser-local, no server state.
  paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL);
}

function processSignalFromSFC(d) {
  if (!paperTrader) return;

  // Restore paper log if render() wiped it — check if only placeholder remains
  const _log = document.getElementById('paperLog');
  if (_log && _log.children.length <= 1 && paperTrader._initialized) {
    _log.innerHTML = '';
    // Allow server state logging to re-run if it was already logged
    if (paperTrader._serverStateLoaded) {
      paperTrader._serverStateLogged = false;
    } else {
      addPaperLog('🟢 Paper trading initialized with $50,000 capital');
      addPaperLog('⏳ Waiting for first trade signal from SFC...');
    }
  }

  // Log server state on first processSignalFromSFC after server-load
  if (paperTrader._serverStateLoaded && !paperTrader._serverStateLogged) {
    paperTrader._serverStateLogged = true;
    const l = document.getElementById('paperLog');
    if (l) {
      l.innerHTML = '';
      addPaperLog('🟢 Paper trading — loaded server state');
      if (paperTrader.positions.length > 0) {
        const p = paperTrader.positions[0];
        addPaperLog(`🟢 [OPEN] LONG $${fmtNum(p.size,2)} at $${fmtNum(p.entry_price,2)} — ${p.reason}`);
      }
      const dayCount = Object.keys(paperTrader.dailySnapshots).length;
      addPaperLog(`📊 Day ${dayCount || 1} tracked · Equity: $${fmtNum(paperTrader.getEquity(), 2)}`);
    }
    updatePaperDisplay();
  }

  // First-call init: seed equityHistory so subsequent calls work
  if (!paperTrader._initialized) {
    paperTrader._initialized = true;
    paperTrader.equityHistory.push({
      ts: new Date().toISOString(),
      btc: d.btc || 0,
      equity: paperTrader.capital,
      capital: paperTrader.capital,
      unrealized: 0,
    });
    updatePaperDisplay();
    addPaperLog('🟢 Paper trading initialized with $50,000 capital');
    addPaperLog('⏳ Waiting for first trade signal from SFC...');
    return;
  }

  // 5s debounce — avoid double-processing when BTC+SFC arrive near-simultaneously
  const now = Date.now();
  if (now - paperTrader._lastSignalTs < 5000) return;
  paperTrader._lastSignalTs = now;

  // Evaluate signal (mirrors paper_trader.py evaluate_signal)
  const decision = paperTrader.evaluateSignal(d);

  // Execute trade decision (mirrors paper_trader.py execute)
  const tradesBefore = paperTrader.trades.length;
  paperTrader.execute(decision);

  // Log any trades that happened
  if (paperTrader.trades.length > tradesBefore) {
    const lastTrade = paperTrader.trades[paperTrader.trades.length - 1];
    if (lastTrade.type === 'OPEN') {
      addPaperLog(`🟢 [OPEN] LONG $${fmtNum(decision.size,0)} at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
    } else if (lastTrade.type === 'CLOSE') {
      if (lastTrade.reason && lastTrade.reason.startsWith('Trailing Stop')) {
        addPaperLog(`🔴 [TRAILING STOP] $${fmtNum(decision.btc_price,0)} — ${lastTrade.reason}`);
      } else {
        addPaperLog(`🔴 [CLOSE] All at $${fmtNum(decision.btc_price,0)} — ${decision.reason}`);
      }
    }
    // Auto-save to KV after any trade
  } else if (decision.action === 'HOLD' && paperTrader.positions.length === 0 && Math.random() < 0.05) {
    addPaperLog(`👀 Watching — ${decision.reason}`);
  }

  updatePaperDisplay();
}

  el('paperEquity').style.color = perf.total_return >= 0 ? 'var(--green)' : 'var(--red)';

  if (el('paperSortino')) {
    el('paperSortino').textContent = perf.sortino != null ? perf.sortino.toFixed(2) : '—';
    el('paperSortino').style.color = (perf.sortino || 0) > 1.5 ? 'var(--green)' : (perf.sortino || 0) > 0.5 ? 'var(--amber)' : 'var(--red)';
    setPerfTone('paperSortino', (perf.sortino || 0) > 1.5 ? 'good' : (perf.sortino || 0) > 0.5 ? 'neutral' : 'bad');

  el('paperWinRate').textContent = perf.win_rate_pct.toFixed(0) + '%';

  setPerfTone('paperWinRate', perf.win_rate_pct > 60 ? 'good' : 'neutral');
  if (el('paperProfitFactor')) {
    el('paperProfitFactor').textContent = perf.profit_factor != null ? perf.profit_factor.toFixed(2) : '—';
    el('paperProfitFactor').style.color = (perf.profit_factor || 0) > 1.5 ? 'var(--green)' : (perf.profit_factor || 0) > 1 ? 'var(--amber)' : 'var(--red)';
    setPerfTone('paperProfitFactor', (perf.profit_factor || 0) > 1.5 ? 'good' : (perf.profit_factor || 0) > 1 ? 'neutral' : 'bad');
  }
  el('paperDD').textContent = perf.max_dd_pct.toFixed(1) + '%';
  el('paperDD').style.color = perf.max_dd_pct < 10 ? 'var(--green)' : perf.max_dd_pct < 20 ? 'var(--amber)' : 'var(--red)';
  setPerfTone('paperDD', perf.max_dd_pct < 10 ? 'good' : perf.max_dd_pct < 20 ? 'neutral' : 'bad');
  if (el('paperAvgWin')) el('paperAvgWin').textContent = '$' + fmtNum(perf.avg_win || 0, 2);
  if (el('paperAvgLoss')) el('paperAvgLoss').textContent = '$' + fmtNum(perf.avg_loss || 0, 2);
  if (el('paperExpectancy')) {
    el('paperExpectancy').textContent = (perf.expectancy >= 0 ? '+$' : '-$') + fmtNum(Math.abs(perf.expectancy || 0), 2);
    el('paperExpectancy').style.color = (perf.expectancy || 0) >= 0 ? 'var(--green)' : 'var(--red)';
  }
  if (el('paperUnrealized')) {
    const upnl = perf.unrealized_pnl || 0;
    el('paperUnrealized').textContent = (upnl >= 0 ? '+$' : '-$') + fmtNum(Math.abs(upnl), 2);
    el('paperUnrealized').closest('.acct-item').className = 'acct-item ' + (upnl >= 0 ? 'acct-pos' : 'acct-neg');
    el('paperUnrealized').style.color = upnl >= 0 ? 'var(--green)' : 'var(--red)';
  }
  if (el('paperBuyingPower')) {
    el('paperBuyingPower').textContent = '$' + fmtNum(perf.capital || 0, 2);
  }
  el('paperTradeCount').textContent = perf.total_trades;

  // Open Position row
  const posRow = el('paperPositionRow');
  if (posRow) {
    const pos = paperTrader.positions && paperTrader.positions[0];
    if (pos) {
      posRow.style.display = 'flex';
      const isShort = pos.pos_type === 'SHORT' || pos.type === 'SHORT';
      posRow.className = 'position-row' + (isShort ? ' short' : '');
      const badge = el('paperPosSide');
      badge.textContent = isShort ? 'SHORT' : 'LONG';
      badge.className = 'position-badge' + (isShort ? ' short' : '');
      el('paperPosEntry').textContent = '$' + fmtNum(pos.entry_price, 2);
      const curPrice = paperTrader._lastPrice || pos.entry_price;
      el('paperPosCurrent').textContent = '$' + fmtNum(curPrice, 2);
      el('paperPosSize').textContent = '$' + fmtNum(pos.size, 2);
      const upnl = perf.unrealized_pnl || 0;
      const pnlEl = el('paperPosPnl');
      pnlEl.textContent = (upnl >= 0 ? '+$' : '-$') + fmtNum(Math.abs(upnl), 2);
      pnlEl.style.color = upnl >= 0 ? 'var(--green)' : 'var(--red)';
      if (pos.entry_time) {
        const heldMs = Date.now() - new Date(pos.entry_time).getTime();
        const heldHrs = heldMs / 3600000;
        el('paperPosTime').textContent = heldHrs < 1 ? Math.round(heldHrs * 60) + 'm' : heldHrs.toFixed(1) + 'h';
      } else {
        el('paperPosTime').textContent = '—';
      }
    } else {
      posRow.style.display = 'none';
    }
  }

  renderTradeBlotter();

  const ps = document.getElementById('paperStatus');
  if (ps) ps.textContent = perf.open_positions > 0 ? '● IN MARKET' : '● CASH';
  if (el('paperLastUpdate')) el('paperLastUpdate').textContent = new Date().toLocaleTimeString();

  // Track record text from server-backed state
  const dailyKeys = Object.keys(paperTrader.dailySnapshots).sort();
  let recordHtml = '<span style="color:var(--text-2)">Server-backed paper trader</span>';
  if (dailyKeys.length >= 1) {
    const first = paperTrader.dailySnapshots[dailyKeys[0]];
    const last = paperTrader.dailySnapshots[dailyKeys[dailyKeys.length - 1]];
    recordHtml += '<br><span style="color:var(--text-2)">' + dailyKeys.length + ' day' + (dailyKeys.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else if (paperTrader.equityHistory.length > 0) {
    const first = paperTrader.equityHistory[0];
    const last = paperTrader.equityHistory[paperTrader.equityHistory.length - 1];
    recordHtml += '<br><span style="color:var(--text-2)">' + paperTrader.equityHistory.length + ' tick' + (paperTrader.equityHistory.length !== 1 ? 's' : '') + ' tracked &middot; ';
    recordHtml += 'Start: $' + fmtNum(first.equity, 2) + ' &middot; ';
    recordHtml += 'Latest: $' + fmtNum(last.equity, 2) + '</span>';
  } else {
    recordHtml += '<br><span style="color:var(--text-2)">Initialized &middot; Capital: $' + fmtNum(paperTrader.capital, 2) + '</span>';
  }
  if (el('paperTrackRecord')) el('paperTrackRecord').innerHTML = recordHtml;
}

function renderTradeBlotter() {
  const tbody = document.getElementById('paperBlotterBody');
  if (!tbody || !paperTrader) return;

  // Trade records come as SEPARATE OPEN and CLOSE entries (not one combined
  // record with entry_price/exit_price) — both server (paper_trader.py) and
  // client (PaperTrader class here) write them this way. Since only 1
  // position is ever open at a time, pair each CLOSE with the most recent
  // preceding OPEN to build one blotter row per completed round-trip.
  const rawTrades = paperTrader.trades || [];
  const rows = [];
  let pendingOpen = null;
  for (const t of rawTrades) {
    if (t.type === 'OPEN') {
      pendingOpen = t;
    } else if (t.type === 'CLOSE' && t.pnl !== undefined && t.pnl !== null) {
      rows.push({
        entry_price: pendingOpen ? pendingOpen.price : null,
        entry_date: pendingOpen ? pendingOpen.date : null,
        exit_price: t.price,
        exit_date: t.date,
        size: t.size,
        pnl: t.pnl,
        pnl_pct: t.pnl_pct,
        direction: t.direction,
        reason: t.reason,
      });
      pendingOpen = null;
    }
  }

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-3);padding:14px">No closed trades yet</td></tr>';
    return;
  }

  const html = rows.slice().reverse().slice(0, 50).map(r => {
    const isShort = r.direction === 'SHORT';
    const sideCls = isShort ? 'side-short' : 'side-long';
    const pnlCls = (r.pnl >= 0) ? 'pnl-pos' : 'pnl-neg';
    const dateStr = r.exit_date ? new Date(r.exit_date).toLocaleString(undefined, {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    let durStr = '—';
    if (r.entry_date && r.exit_date) {
      const hrs = (new Date(r.exit_date) - new Date(r.entry_date)) / 3600000;
      durStr = hrs < 1 ? Math.round(hrs * 60) + 'm' : hrs.toFixed(1) + 'h';
    }
    return '<tr>' +
      '<td>' + dateStr + '</td>' +
      '<td><span class="side-pill ' + (isShort ? 'short' : 'long') + '">' + (isShort ? 'SHORT' : 'LONG') + '</span></td>' +
      '<td class="num">' + (r.entry_price != null ? '$' + fmtNum(r.entry_price, 2) : '—') + '</td>' +
      '<td class="num">' + (r.exit_price != null ? '$' + fmtNum(r.exit_price, 2) : '—') + '</td>' +
      '<td class="num">$' + fmtNum(r.size || 0, 0) + '</td>' +
      '<td class="num ' + pnlCls + '">' + (r.pnl >= 0 ? '+$' : '-$') + fmtNum(Math.abs(r.pnl), 2) + '</td>' +
      '<td class="num ' + pnlCls + '">' + (r.pnl_pct >= 0 ? '+' : '') + (r.pnl_pct || 0).toFixed(2) + '%</td>' +
      '<td class="num">' + durStr + '</td>' +
      '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis">' + (r.reason || '—') + '</td>' +
      '</tr>';
  }).join('');
  tbody.innerHTML = html;
}


function addPaperLog(msg) {
  const log = document.getElementById('paperLog');
  if (!log) return;
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
}

function resetPaperTrading() {
  paperTrader = new PaperTrader(PAPER_INITIAL_CAPITAL);
  const log = document.getElementById('paperLog');
  if (log) log.innerHTML = '<div>🟢 Paper trading reset to $' + PAPER_INITIAL_CAPITAL.toLocaleString() + ' capital</div>';
  updatePaperDisplay();
}

function exportPaperTrades() {
  if (!paperTrader || paperTrader.trades.length === 0) { addPaperLog('⚠ No trades to export'); return; }
  const blob = new Blob([JSON.stringify(paperTrader.trades, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'sfc_paper_trades_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  addPaperLog('📥 Exported ' + paperTrader.trades.length + ' trades');
}

function manualBuy() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length > 0) { addPaperLog('⚠ Already have an open position. Close it first or wait.'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  // Get buy amount: user input or from config's max_allocation_pct
  const amountInput = document.getElementById('manualBuyAmount');
  let size = 0;
  if (amountInput?.value && parseFloat(amountInput.value) > 0) {
    size = parseFloat(amountInput.value);
  } else {
    const allocPct = (paperTrader.userConfig?.max_allocation_pct || 25) / 100;
    size = Math.round(paperTrader.capital * allocPct * 100) / 100;
  }

  // Cap at available capital
  size = Math.min(size, paperTrader.capital);
  if (size < 10) { addPaperLog('⚠ Insufficient capital (min $10)'); return; }

  const decision = {
    reason: 'Manual Buy',
    btc_price: price,
    sfc_pct: currentData?.sfc_effective || 0,
    confidence: currentData?.composite_confidence || 0,
  };

  paperTrader._openPosition(size, price, decision);
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🟢 [MANUAL BUY] LONG $${fmtNum(size,0)} at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Clear the input
  if (amountInput) amountInput.value = '';

}

function manualSell() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length > 0) { addPaperLog('⚠ Already have an open position. Close it first or wait.'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  // Get sell amount: user input or from config's max_allocation_pct
  const amountInput = document.getElementById('manualBuyAmount');
  let size = 0;
  if (amountInput?.value && parseFloat(amountInput.value) > 0) {
    size = parseFloat(amountInput.value);
  } else {
    const allocPct = (paperTrader.userConfig?.max_allocation_pct || 25) / 100;
    size = Math.round(paperTrader.capital * allocPct * 100) / 100;
  }

  // Cap at available capital
  size = Math.min(size, paperTrader.capital);
  if (size < 10) { addPaperLog('⚠ Insufficient capital (min $10)'); return; }

  const decision = {
    reason: 'Manual Short',
    btc_price: price,
    sfc_pct: currentData?.sfc_effective || 0,
    confidence: currentData?.composite_confidence || 0,
  };

  paperTrader._openPosition(size, price, decision, 'SHORT');
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🔴 [MANUAL SHORT] SHORT $${fmtNum(size,0)} at $${fmtNum(price,0)}`);
  updatePaperDisplay();

  // Clear the input
  if (amountInput) amountInput.value = '';

}

function manualCloseAll() {
  if (!paperTrader) { addPaperLog('⚠ Paper trader not initialized'); return; }
  if (paperTrader.positions.length === 0) { addPaperLog('⚠ No open positions to close'); return; }

  const price = currentData?.btc;
  if (!price || price <= 0) { addPaperLog('⚠ No BTC price available'); return; }

  paperTrader._closeAllPositions(price, 'Manual Close');
  paperTrader._updatePnL(price);
  paperTrader._dailySnapshot();

  addPaperLog(`🔴 [MANUAL CLOSE] All at $${fmtNum(price,0)}`);
  updatePaperDisplay();

}

// Load initial data from SSE snapshot — full render ONCE
let _sseAvailable = false;

async function bootSFC() {
  // PRIORITY 1: Try /snapshot for SSE connection (fastest — local server)
  let initial = null;
  try {
    const r = await fetch('/snapshot', { signal: AbortSignal.timeout(5000) });
    if (r.ok) initial = await r.json();
  } catch (e) { /* snapshot not available */ }

  if (initial && (initial.sfc || initial.btc)) {
    _sseAvailable = true;
    const data = initial.sfc || initial;
    currentData = data;
    render(data);
  } else {
    // No SSE server — fetch data.json directly (10-15KB, fast)
    const _fetched = await fetchLiveData();
    // Fallback: if data.json empty/missing, render embedded data from HTML
    if (!_fetched && window.__EMBEDDED_DATA) {
      currentData = window.__EMBEDDED_DATA;
      render(window.__EMBEDDED_DATA);
    }
  }

  // Now init paper trader in background
  await initPaperTrading();

  // Ensure config panel visible and values set after any render path
  setTimeout(function() {
    if (paperTrader) {
      updatePaperDisplay();
    }
  }, 200);
  setTimeout(startNewsSlide, 100);
  setTimeout(restoreScrollPos, 200);
  // Start SSE only if server was detected (/snapshot responded)
  if (_sseAvailable) {
    startSSE();
  } else {
    // No SSE server — fall back to polling data.json every 30s
    setInterval(fetchLiveData, 30000);
  }
}

// ── COLLAPSIBLE CARDS — expand/collapse below-fold sections
function toggleCollapseCard(el) {
  const card = el.closest('.card') || el.parentElement.closest('.card');
  if (!card) return;
  card.classList.toggle('card-collapsed');
  const arrow = card.querySelector('.collapse-arrow');
  if (arrow) arrow.textContent = card.classList.contains('card-collapsed') ? '▶' : '▼';
}

// ── LAZY LOADING ── Cards below fold render only when visible
function initLazyCards() {
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const el = entry.target;
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
          observer.unobserve(el);
        }
      });
    }, { rootMargin: '200px' }); // start loading 200px before visible
    
    document.querySelectorAll('[data-lazy]').forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px)';
      el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      observer.observe(el);
    });
  }
}
// Run lazy observer after initial render (and after each re-render)
const origRender = render;
render = function(d) {
  origRender(d);
  // Delay observer until DOM is painted
  setTimeout(initLazyCards, 100);
};

// PUBLIC (safe to embed in client-side code), used by the browser's push
// service to verify the notification came from your server; the
// corresponding PRIVATE key stays server-side only (Cloudflare Worker
// secret), never in this file.
const VAPID_PUBLIC_KEY = 'BLLcSO4LTGvHIvmTru2wuDh4OqJYA5s7a4lPpj-fWgueUoJz9oVCwlzpx0tMacCqWGxGnyLZE-ENwT1fnJcmqm4';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function enablePushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    return;
  }
  if (VAPID_PUBLIC_KEY === 'REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY') {
    alert('Push notifications are not configured yet (missing VAPID key). See setup docs.');
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      console.log('[Push] Permission denied');
      return;
    }

    const reg = await navigator.serviceWorker.ready;
    let subscription = await reg.pushManager.getSubscription();
    if (!subscription) {
      subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true, // required by spec — every push must show a visible notification
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }

    // Send the subscription to the Cloudflare Worker for storage — the
    // worker's Cron Trigger reads these back out to know WHO to notify
    // when a BUY signal appears (see worker/index.js).
    const resp = await fetch('/api/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription }),
      credentials: 'include', // send session cookie so the worker can associate this with the logged-in user
    });

    if (resp.ok) {
      console.log('[Push] Subscribed successfully');
      const btn = document.getElementById('pushEnableBtn');
      if (btn) { btn.textContent = '✓ Notifications On'; btn.disabled = true; }
    } else {
      console.log('[Push] Server rejected subscription:', resp.status);
    }
  } catch (err) {
    console.log('[Push] Subscription failed:', err);
    alert('Could not enable notifications: ' + err.message);
  }
}

// Reflect current permission/subscription state on page load, so the
// button doesn't say "Enable" if the user already granted it earlier.
(async function initPushButtonState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    const btn = document.getElementById('pushEnableBtn');
    if (existing && btn) {
      btn.textContent = '✓ Notifications On';
      btn.disabled = true;
    }
  } catch (e) { /* ignore — button just stays in default "Enable" state */ }
})();

// ── Global tooltip positioning ────────────────────────────────────
// Single shared popup appended to <body> so it is never clipped by a
// card's overflow:hidden. Prefers opening BELOW the trigger; flips
// above when there isn't room, and clamps horizontally so it can never
// run off the left/right edge of the viewport.
(function () {
  var tip = document.createElement('div');
  tip.id = 'globalTip';
  document.body.appendChild(tip);
  var current = null;

  function place(el) {
    var text = el.getAttribute('data-tip');
    if (!text) return;
    tip.textContent = text;
    tip.classList.add('show');

    var r = el.getBoundingClientRect();
    var t = tip.getBoundingClientRect();
    var pad = 8;

    // Vertical: below by default, flip above if it would overflow bottom
    var top = r.bottom + 7;
    if (top + t.height > window.innerHeight - pad) {
      var above = r.top - t.height - 7;
      if (above >= pad) top = above;
      else top = Math.max(pad, window.innerHeight - t.height - pad);
    }

    // Horizontal: align to trigger, clamp inside viewport
    var left = r.left;
    if (left + t.width > window.innerWidth - pad) left = window.innerWidth - t.width - pad;
    if (left < pad) left = pad;

    // Final clamp — guarantees the popup stays fully on-screen even if the
    // trigger itself is partially scrolled out of view.
    top = Math.max(pad, Math.min(top, window.innerHeight - t.height - pad));

    tip.style.top = top + 'px';
    tip.style.left = left + 'px';
  }

  function show(e) {
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el || el === current) return;
    current = el;
    place(el);
  }

  function hide() {
    current = null;
    tip.classList.remove('show');
  }

  document.addEventListener('mouseover', show);
  document.addEventListener('mouseout', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (el && el === current) hide();
  });
  document.addEventListener('focusin', show);
  document.addEventListener('focusout', hide);
  // Touch: tap to toggle
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (el) { if (el === current) hide(); else { current = el; place(el); } }
    else hide();
  });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();

// ── Card verdict summaries ────────────────────────────────────────
// Each function turns a card's raw numbers into one plain-English
// sentence, so the card can be understood at a glance without knowing
// the underlying terminology. Tone (good/warn/bad) drives the accent
// colour. All values are read live from the data object — nothing here
// is hardcoded commentary.
function cardSum(tone, html) {
  return '<div class="card-summary ' + tone + '">' + html + '</div>';
}
function _n(v, dp) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(dp === undefined ? 1 : dp); }

var SUM = {
  sfc: function (d, eff) {
    var z = eff >= 45 ? 'bad' : eff >= 25 ? 'warn' : 'good';
    var w = eff >= 45 ? 'Systemic stress is <b>high</b> — defensive positioning warranted.'
          : eff >= 25 ? 'Stress is <b>elevated</b> but not critical — stay alert.'
          : 'Conditions are <b>calm</b> — no systemic crisis signals.';
    return cardSum(z, 'Composite stress <b>' + _n(eff) + '%</b> (' + (d.zone || '—') + '). ' + w);
  },
  floor: function (d) {
    var buf = d.floor_buffer, tot = d.floor_total, px = d.btc;
    if (!buf || !tot || !px) return cardSum('', 'Floor estimate unavailable this cycle.');
    var pct = (buf / tot) * 100;
    var t = pct >= 15 ? 'good' : pct >= 5 ? 'warn' : 'bad';
    return cardSum(t, 'BTC sits <b>$' + Math.round(buf).toLocaleString() + '</b> above the model floor ($' +
      Math.round(tot).toLocaleString() + ') — a <b>' + _n(pct) + '%</b> cushion' +
      (pct < 5 ? '. Historically stretched.' : pct < 15 ? '. Moderate room left.' : '. Comfortable room below.'));
  },
  momentum: function (d, rsi) {
    var s = d.sopr_proxy, sig = (d.sopr_signal || '').replace(/_/g, ' ').toLowerCase();
    var rTxt = rsi <= 30 ? 'oversold' : rsi >= 70 ? 'overbought' : 'neutral';
    var t = (rsi <= 30 || rsi >= 70) ? 'warn' : 'good';
    return cardSum(t, 'RSI <b>' + _n(rsi) + '</b> (' + rTxt + '), holders at <b>' + _n(s, 4) + '</b> (' + (sig || 'n/a') +
      '). ' + ((rsi > 30 && rsi < 70) ? 'No strong momentum edge either way.' : 'Momentum is at an extreme — watch for reversal.'));
  },
  liquidation: function (d) {
    var cr = (d.cascade_risk || 0) * 100, p = (d.liq_pressure || '—').replace(/_/g, ' ').toLowerCase();
    var t = cr >= 60 ? 'bad' : cr >= 35 ? 'warn' : 'good';
    return cardSum(t, 'Pressure <b>' + p + '</b>, cascade risk <b>' + _n(cr) + '%</b>. ' +
      (cr >= 60 ? 'A sharp move could trigger chain liquidations.' : cr >= 35 ? 'Some leverage is vulnerable.' : 'Leverage looks well absorbed.'));
  },
  confidence: function (d, conf) {
    var c = conf * 100, ag = (d.method_agreement || 0) * 100;
    var t = c >= 60 ? 'good' : c >= 30 ? 'warn' : 'bad';
    return cardSum(t, 'Confidence <b>' + _n(c) + '%</b> with <b>' + _n(ag) + '%</b> method agreement. ' +
      (c >= 60 ? 'High conviction — signals are dependable.' : c >= 30 ? 'Moderate conviction — size positions carefully.' :
       'Low conviction — methods disagree and/or execution risk is high. Treat signals cautiously.'));
  },
  signal: function (d) {
    var k = (d.kelly_fraction || 0) * 100, tr = (d.transition_risk || 0) * 100;
    var t = k > 0 ? 'good' : 'warn';
    return cardSum(t, (k > 0 ? 'Kelly suggests <b>' + _n(k) + '%</b> allocation — a positive edge exists.'
                            : 'Kelly is <b>0%</b> — no positive edge, model favours staying in <b>cash</b>.') +
      ' Regime-change risk <b>' + _n(tr) + '%</b>' + (tr >= 50 ? ' — a shift looks likely.' : '.'));
  },
  q10: function (d) {
    var w = d.q10_whale_pressure, v = d.q10_onchain_value, b = d.q10_buying_power, m = d.q10_market_structure;
    var avg = [w, v, b, m].filter(function (x) { return x != null; });
    avg = avg.length ? avg.reduce(function (a, x) { return a + x; }, 0) / avg.length : null;
    var t = avg == null ? '' : avg >= 60 ? 'good' : avg >= 40 ? 'warn' : 'bad';
    return cardSum(t, 'Whales <b>' + _n(w, 0) + '</b>, value flow <b>' + _n(v, 0) + '</b>, buying power <b>' + _n(b, 0) +
      '</b>, structure <b>' + _n(m, 0) + '</b> (0–100). ' +
      (avg == null ? '' : avg >= 60 ? 'On-chain behaviour is broadly supportive.' : avg >= 40 ? 'Mixed on-chain picture.' : 'On-chain behaviour is pressuring price.'));
  },
  ensemble: function (d, agree) {
    var a = agree * 100;
    var t = a >= 60 ? 'good' : a >= 30 ? 'warn' : 'bad';
    return cardSum(t, 'The six methods are <b>' + _n(a) + '%</b> aligned. ' +
      (a >= 60 ? 'Strong consensus — the signal is trustworthy.' : a >= 30 ? 'Partial consensus — weight the signal moderately.' :
       'Methods disagree sharply — treat this reading with scepticism.'));
  },
  kelly: function (d) {
    var k = (d.kelly_fraction || 0) * 100;
    return cardSum(k > 0 ? 'good' : 'warn', k > 0
      ? 'Recommended allocation <b>' + _n(k) + '%</b> of capital (half-Kelly is the practical variant).'
      : 'Kelly is <b>zero or negative</b> — the model sees no positive edge, so the suggested allocation is <b>nil</b>.');
  },
  wfv: function (d) {
    var g = d.wfv_gap_30d;
    if (g == null) return cardSum('', 'Walk-forward validation has not been run yet.');
    return cardSum(g < 0 ? 'good' : 'warn', 'Over 30 days, stress readings preceded returns <b>' + _n(Math.abs(g)) +
      'pp ' + (g < 0 ? 'worse' : 'better') + '</b> than calm readings — tested out-of-sample on data since 2014. ' +
      (g < 0 ? 'The signal works in the expected direction.' : 'Direction is inverted — investigate.'));
  },
  liqIntel: function (d) {
    var g = d.glf_score, s = d.sli_score, m = d.mpi_score;

    var t = avg == null ? '' : avg >= 60 ? 'good' : avg >= 45 ? 'warn' : 'bad';
    return cardSum(t, 'GLF <b>' + _n(g, 0) + '</b>, SLI <b>' + _n(s, 0) + '</b>, MPI <b>' + _n(m, 0) + '</b> (0–100). ' +
      (avg == null ? '' : avg >= 60 ? 'Liquidity backdrop is supportive of risk assets.' : avg >= 45 ? 'Liquidity is broadly neutral.' : 'Liquidity is tightening — a headwind for risk assets.'));
  },
  macroLiq: function (d) {
    var m2 = d.m2_yoy, lm = d.lm_score, lbl = (d.lm_label || '').replace(/_/g, ' ').toLowerCase();
    var t = (lm != null && lm >= 2) ? 'good' : (lm != null && lm <= -2) ? 'bad' : 'warn';
    return cardSum(t, 'M2 growing <b>' + _n(m2) + '%</b> YoY; liquidity momentum <b>' + _n(lm) + ' pts</b> (' + (lbl || 'n/a') + '). ' +
      ((lm != null && lm >= 2) ? 'Macro liquidity is expanding — a tailwind.' : (lm != null && lm <= -2) ? 'Macro liquidity is draining — a headwind.' : 'Macro liquidity is roughly flat.'));
  },
  stableLiq: function (d) {
    var s = d.sli_score;
    var t = s == null ? '' : s >= 60 ? 'good' : s >= 45 ? 'warn' : 'bad';
    return cardSum(t, 'Stablecoin liquidity index <b>' + _n(s, 0) + '</b>/100. ' +
      (s == null ? '' : s >= 60 ? 'Dry powder is building — buying capacity is entering crypto.' : s >= 45 ? 'Stablecoin flows are neutral.' : 'Stablecoin supply is contracting — buying capacity is leaving.'));
  },
  macroCtx: function (d) {
    var dxy = d.dxy, fng = d.fng;
    var t = (fng != null && (fng <= 25 || fng >= 75)) ? 'warn' : 'good';
    return cardSum(t, 'Dollar index <b>' + _n(dxy, 2) + '</b>, Fear &amp; Greed <b>' + _n(fng, 0) + '</b>. ' +
      (fng == null ? '' : fng <= 25 ? 'Extreme fear — historically a contrarian buy zone, but volatile.' :
       fng >= 75 ? 'Extreme greed — crowded positioning, elevated reversal risk.' : 'Sentiment is in normal range.'));
  },
  onchain: function (d) {
    var s = d.sopr_proxy, sig = (d.sopr_signal || '').replace(/_/g, ' ').toLowerCase();
    var t = s == null ? '' : s < 0.97 ? 'good' : s > 1.03 ? 'warn' : '';
    return cardSum(t, 'SOPR <b>' + _n(s, 4) + '</b> (' + (sig || 'n/a') + '). ' +
      (s == null ? '' : s < 0.97 ? 'Holders are selling at a loss — capitulation territory, often near bottoms.' :
       s > 1.03 ? 'Holders are taking healthy profits — distribution, often near tops.' : 'Holders are around breakeven — no strong conviction either side.'));
  },
  behavioral: function (d) {
    var b = d.behavioral_divergence_score, det = d.behavioral_divergence_detail || {};
    var reg = (det.regime || '').replace(/_/g, ' ').toLowerCase();
    var t = b == null ? '' : b >= 40 ? 'warn' : '';
    return cardSum(t, 'Divergence score <b>' + _n(b) + '</b>/100' + (reg ? ' (' + reg + ')' : '') + '. ' +
      (b == null ? '' : b >= 40 ? 'Institutional flow is meaningfully disagreeing with price — worth watching.' :
       'Institutional flow and price are broadly in step — no notable divergence.'));
  },
  marketStructure: function (d) {
    var m = d.q10_market_structure, det = d.q10_details || {};
    var fr = (det.funding_rates || {}).value, nf = (det.exchange_netflow || {}).score;
    var t = m == null ? '' : m >= 60 ? 'good' : m >= 40 ? 'warn' : 'bad';
    var parts = [];
    if (fr != null) parts.push('funding ' + (fr > 0 ? '<b>positive</b> (longs paying shorts)' : fr < 0 ? '<b>negative</b> (shorts paying longs)' : '<b>flat</b>'));
    if (nf != null) parts.push('exchange flow score <b>' + _n(nf, 0) + '</b>');
    return cardSum(t, 'Derivatives structure <b>' + _n(m, 0) + '</b>/100' + (parts.length ? ' — ' + parts.join(', ') : '') + '. ' +
      (m == null ? '' : m >= 60 ? 'Positioning looks healthy, leverage is not overly crowded.' :
       m >= 40 ? 'Positioning is mixed — some crowding building.' :
       'Leverage is crowded on one side and vulnerable to a squeeze.'));
  },
  ml: function (d) {
    var h = d.hmm_regime || '—', x = d.xgb_meta_prediction, mtf = d.mtf_alignment_score;
    var t = (h === 'CRISIS' || h === 'BEAR') ? 'bad' : (h === 'BULL') ? 'good' : 'warn';
    return cardSum(t, 'ML regime <b>' + h + '</b>' + (x != null ? ', XGBoost stress <b>' + _n(x) + '%</b>' : '') +
      (mtf != null ? ', timeframe alignment <b>' + _n(mtf, 2) + '</b>' : '') + '. ' +
      ((h === 'CRISIS' || h === 'BEAR') ? 'Models favour a defensive stance.' : (h === 'BULL') ? 'Models favour risk-on.' : 'Models see no decisive trend.'));
  }
