<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
<title>SFC Terminal | quantitative apex v.3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #080b11;
  --bg-secondary: #0c0f16;
  --bg-card: #11151f;
  --bg-card-hover: #171d2b;
  --border-subtle: rgba(255,255,255,0.05);
  --border-active: rgba(0,230,255,0.2);
  --text-primary: #f0f4f8;
  --text-secondary: #8892a8;
  --text-muted: #5a6478;
  --accent-green: #00e68a;
  --accent-green-dim: rgba(0,230,138,0.12);
  --accent-red: #ff3355;
  --accent-red-dim: rgba(255,51,85,0.12);
  --accent-yellow: #ffb347;
  --accent-yellow-dim: rgba(255,179,71,0.12);
  --accent-blue: #4a9eff;
  --accent-cyan: #00e6ff;
  --accent-purple: #a855f7;
  --grad-green: linear-gradient(135deg, #00e68a 0%, #00c4a0 100%);
  --grad-red: linear-gradient(135deg, #ff3355 0%, #cc2244 100%);
  --grad-yellow: linear-gradient(135deg, #ffb347 0%, #ff8c00 100%);
  --grad-cyan: linear-gradient(135deg, #00e6ff 0%, #0099ff 100%);
  --glow-green: 0 0 20px rgba(0,230,138,0.08);
  --glow-red: 0 0 20px rgba(255,51,85,0.08);
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

.app {
  max-width: 1600px;
  margin: 0 auto;
  padding: 16px 20px;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.logo-group {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-badge {
  width: 40px;
  height: 40px;
  background: var(--grad-cyan);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  color: #080b11;
  box-shadow: 0 0 24px rgba(0,230,255,0.12);
}
.logo-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.logo-name span { color: var(--accent-cyan); }
.logo-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  letter-spacing: 0.3px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.topbar-item {
  text-align: right;
}
.topbar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
}
.topbar-value {
  font-size: 13px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.topbar-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-buy { background: var(--accent-green-dim); color: var(--accent-green); }
.badge-watch { background: var(--accent-yellow-dim); color: var(--accent-yellow); }
.badge-cash { background: var(--accent-red-dim); color: var(--accent-red); }

/* ── STATUS BAR ── */
.status-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.status-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 6px;
}
.dot-green { background: var(--accent-green); box-shadow: 0 0 6px rgba(0,230,138,0.4); }
.dot-red { background: var(--accent-red); box-shadow: 0 0 6px rgba(255,51,85,0.4); }
.dot-yellow { background: var(--accent-yellow); box-shadow: 0 0 6px rgba(255,179,71,0.4); }
.dot-blue { background: var(--accent-blue); box-shadow: 0 0 6px rgba(74,158,255,0.4); }

/* ── KPI GRID ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--bg-card);
  border-radius: 14px;
  padding: 16px 14px;
  border: 1px solid var(--border-subtle);
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  opacity: 0.6;
}
.kpi-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-active);
}
.kpi-card.accent-green::before { background: var(--grad-green); }
.kpi-card.accent-red::before { background: var(--grad-red); }
.kpi-card.accent-yellow::before { background: var(--grad-yellow); }
.kpi-card.accent-cyan::before { background: var(--grad-cyan); }
.kpi-card.accent-blue::before { background: linear-gradient(135deg, #4a9eff, #6366f1); }
.kpi-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.kpi-value {
  font-size: 22px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 2px;
}
.kpi-sub {
  font-size: 10px;
  color: var(--text-secondary);
}
.kpi-sub.up { color: var(--accent-green); }
.kpi-sub.down { color: var(--accent-red); }
.kpi-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 600;
  margin-top: 4px;
}
.kpi-badge-green { background: var(--accent-green-dim); color: var(--accent-green); }
.kpi-badge-red { background: var(--accent-red-dim); color: var(--accent-red); }
.kpi-badge-yellow { background: var(--accent-yellow-dim); color: var(--accent-yellow); }

/* ── MAIN GRID ── */
.col2-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.col4-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.full-row {
  grid-column: 1 / -1;
}

.card {
  background: var(--bg-card);
  border-radius: 18px;
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  transition: all 0.2s ease;
}
.card:hover {
  border-color: var(--border-active);
}
.card-hd {
  padding: 16px 20px 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.card-bd {
  padding: 18px 20px;
}

/* ── SFC INDEX ── */
.sfc-hero {
  text-align: center;
  padding: 10px 0 18px 0;
}
.sfc-number {
  font-size: 64px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.03em;
  line-height: 1;
}
.sfc-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.sfc-zone {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-top: 10px;
  letter-spacing: 0.3px;
}
.zone-critical { background: var(--accent-red-dim); color: var(--accent-red); }
.zone-high { background: rgba(255,80,80,0.1); color: #ff6b8a; }
.zone-elevated { background: var(--accent-yellow-dim); color: var(--accent-yellow); }
.zone-normal { background: var(--accent-green-dim); color: var(--accent-green); }

.progress-track {
  background: rgba(255,255,255,0.05);
  border-radius: 100px;
  height: 6px;
  overflow: hidden;
  margin: 16px 0;
}
.progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.6s ease;
}
.fill-green { background: var(--grad-green); }
.fill-red { background: var(--grad-red); }
.fill-yellow { background: var(--grad-yellow); }

/* ── FACTOR BARS ── */
.factor-bar-row {
  display: flex;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.factor-bar-row:last-child { border-bottom: none; }
.factor-label {
  font-size: 12px;
  font-weight: 600;
  width: 28px;
  font-family: 'JetBrains Mono', monospace;
}
.factor-track {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.04);
  border-radius: 6px;
  margin: 0 10px;
  overflow: hidden;
  position: relative;
}
.factor-fill-bar {
  height: 100%;
  border-radius: 6px;
  transition: width 0.5s ease;
}
.factor-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  width: 56px;
  text-align: right;
}

/* ── METHOD BAR CHART ── */
.methods-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.method-cell {
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.method-name {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.method-val {
  font-size: 16px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.consensus-box {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.consensus-ring {
  width: 48px;
  height: 48px;
  border-radius: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.consensus-label {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ── INFO ROWS ── */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 12px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--text-muted); }
.info-val {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

/* ── DUAL METRICS (RSI + SOPR) ── */
.dual-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.metric-center {
  text-align: center;
  padding: 8px;
}
.metric-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* RSI Gauge */
.gauge-ring {
  width: 100px;
  height: 100px;
  margin: 0 auto 8px;
  position: relative;
}
.gauge-val {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 22px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.sopr-big {
  font-size: 26px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 2px;
}

/* ── SIGNAL BADGE ── */
.signal-hero {
  display: inline-block;
  padding: 8px 20px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
}
.signal-buy { background: var(--accent-green-dim); color: var(--accent-green); }
.signal-watch { background: var(--accent-yellow-dim); color: var(--accent-yellow); }
.signal-cash { background: var(--accent-red-dim); color: var(--accent-red); }

/* ── CHART CONTAINER (Dribbble-inspired) ── */
.chart-wrap {
  position: relative;
  width: 100%;
  background: linear-gradient(180deg, rgba(33,24,53,0.3) 0%, transparent 100%);
  border-radius: 12px;
  padding: 8px 4px 4px 4px;
}
.chart-wrap canvas {
  width: 100% !important;
  height: auto !important;
  max-height: 260px;
}
.chart-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  pointer-events: none;
  border: 1px solid rgba(121,112,158,0.06);
}

/* ── NEWS SLIDE BAR ── */
.news-ticker {
  margin-bottom: 20px;
}
.news-slide-viewport {
  position: relative;
  height: 68px;
  overflow: hidden;
  border-radius: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
}
.news-slide-track {
  position: relative;
  height: 100%;
}
.news-slide-item {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.5;
  opacity: 0;
  transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.45s ease;
  will-change: transform, opacity;
  cursor: default;
}
.news-slide-item.active {
  opacity: 1;
  transform: translateY(0);
}
.news-slide-item.exit {
  opacity: 0;
  transform: translateY(-100%);
}
.news-slide-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-top: 8px;
}
.news-slide-dot {
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: var(--text-muted);
  opacity: 0.3;
  transition: opacity 0.3s, width 0.3s;
  cursor: pointer;
}
.news-slide-dot.active {
  opacity: 1;
  width: 18px;
  background: var(--accent-cyan);
}
.news-slide-dot:hover {
  opacity: 0.7;
}

/* ── CYBER SECURITY ── */
.security-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.security-chip.critical { background: rgba(255,51,85,0.15); color: #ff3355; border: 1px solid rgba(255,51,85,0.3); }
.security-chip.high { background: rgba(255,179,71,0.15); color: #ffb347; border: 1px solid rgba(255,179,71,0.3); }
.security-chip.medium { background: rgba(255,179,71,0.08); color: #ffb347; border: 1px solid rgba(255,179,71,0.15); }
.security-chip.safe { background: rgba(0,230,138,0.1); color: #00e68a; border: 1px solid rgba(0,230,138,0.2); }
.security-event-text {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 6px;
  padding: 8px 10px;
  background: rgba(255,51,85,0.05);
  border-radius: 8px;
  border-left: 2px solid var(--accent-red);
}

/* ── PAPER TRADING ── */
.paper-section {
  background: var(--bg-card);
  border-radius: 18px;
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  margin-bottom: 20px;
  grid-column: 1 / -1;
  transition: border-color 0.2s ease;
}
.paper-section:hover { border-color: var(--border-active); }
.paper-hd {
  padding: 16px 20px 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
}
.paper-badge {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 3px 10px;
  border-radius: 100px;
  background: rgba(0,230,138,0.1);
  color: var(--accent-green);
}
.paper-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  padding: 16px 20px;
}
.paper-stat {
  text-align: center;
  padding: 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
}
.paper-stat-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.paper-stat-val {
  font-size: 20px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.paper-log {
  background: rgba(0,0,0,0.25);
  border-radius: 10px;
  margin: 0 20px 14px 20px;
  padding: 10px;
  height: 140px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  line-height: 1.6;
}
.paper-log div {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--text-secondary);
}
.paper-log div:last-child { border-bottom: none; }
.paper-ctrl {
  display: flex;
  gap: 10px;
  padding: 0 20px 14px 20px;
}
.paper-btn {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid rgba(0,230,138,0.3);
  background: rgba(0,230,138,0.08);
  color: var(--accent-green);
}
.paper-btn:hover { background: var(--accent-green); color: #080b11; }
.paper-btn.danger {
  border-color: rgba(255,51,85,0.3);
  background: rgba(255,51,85,0.08);
  color: var(--accent-red);
}
.paper-btn.danger:hover { background: var(--accent-red); color: #080b11; }

/* ── FOOTER ── */
.footer {
  margin-top: 24px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  flex-wrap: wrap;
  gap: 8px;
}
.footer-links {
  display: flex;
  gap: 16px;
}
.footer-link {
  cursor: pointer;
  transition: opacity 0.2s;
}
.footer-link:hover { opacity: 0.7; }

/* ── HELP PANEL ── */
.help-panel {
  margin-top: 14px;
  background: var(--bg-secondary);
  border-radius: 14px;
  padding: 18px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.help-panel h4 {
  color: var(--text-primary);
  margin-bottom: 10px;
  font-size: 13px;
}
.help-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.help-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 12px;
  break-inside: avoid;
}
.help-card.full-width {
  grid-column: 1 / -1;
}
.help-title {
  font-weight: 600;
  font-size: 12px;
  margin-bottom: 8px;
}
.help-body {
  font-size: 10px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.help-body ul, .help-body ol {
  margin: 4px 0;
  padding-left: 16px;
}
.help-body li {

let newsSlideInterval = null;

function goToNewsSlide(idx) {
  const track = document.getElementById('newsTrack');
  if (!track) return;
  const items = track.querySelectorAll('.news-slide-item');
  if (idx < 0 || idx >= items.length) return;
  const prev = newsSlideIndex;
  if (prev === idx) return;
  items[prev].classList.remove('active');
  items[prev].classList.add('exit');
  items[idx].classList.remove('exit');
  items[idx].classList.add('active');
  newsSlideIndex = idx;
  const dots = document.getElementById('newsDots');
  if (dots) {
    dots.querySelectorAll('.news-slide-dot').forEach((el, i) => el.classList.toggle('active', i === idx));
  }
  restartNewsSlide();
}

function nextNewsSlide() {
  const track = document.getElementById('newsTrack');
  if (!track) return;
  const items = track.querySelectorAll('.news-slide-item');
  if (!items.length) return;
  const next = (newsSlideIndex + 1) % items.length;
  goToNewsSlide(next);
}

function startNewsSlide() {
  stopNewsSlide();
  const track = document.getElementById('newsTrack');
  if (!track) return;
  const items = track.querySelectorAll('.news-slide-item');
  if (items.length < 2) return;
  newsSlideInterval = setInterval(nextNewsSlide, 5000);
}

function stopNewsSlide() {
  if (newsSlideInterval) {
    clearInterval(newsSlideInterval);
    newsSlideInterval = null;
  }
}

function restartNewsSlide() {
  stopNewsSlide();
  const track = document.getElementById('newsTrack');
  if (!track) return;
  const items = track.querySelectorAll('.news-slide-item');
  if (items.length < 2) return;
  newsSlideInterval = setInterval(nextNewsSlide, 5000);
}

// Clean up exit class after transition
document.addEventListener('transitionend', function(e) {
  if (e.target.classList.contains('news-slide-item') && e.target.classList.contains('exit')) {
    e.target.classList.remove('exit');
  }
});

                <li><strong>Signal Confidence</strong> — probability the signal is correct (Bayesian prior)</li>
                <li><strong>Max Allocation</strong> — Kelly-optimal position size. 0% = no edge, stay in cash</li>
                <li><strong>Safe Allocation</strong> — half-Kelly, a conservative bet that reduces variance</li>
              </ul>
              <strong>CASH (0%)</strong> when no edge exists — do not force a trade.
            </div>
          </div>

          <div class="help-card">
            <div class="help-title" style="color:#00e6ff">📊 Walk-Forward Backtest</div>
            <div class="help-body">
              <strong>Out-of-sample validation of SFC signal performance.</strong> Walk-forward analysis with expanding windows.
              <ul>
                <li><strong>Sharpe Ratio</strong> — risk-adjusted return. &gt;1.5 = good, &gt;1.0 = acceptable</li>
                <li><strong>Win Rate</strong> — percentage of profitable signals. 95% confidence interval shown</li>
                <li><strong>Max Drawdown</strong> — worst peak-to-trough loss in backtest</li>
                <li><strong>Signal Stability</strong> — consistency of signal quality across windows</li>
              </ul>
              <em>Results are upper-bound estimates due to limited stress events in the training window.</em>
            </div>
          </div>

          <div class="help-card">
            <div class="help-title" style="color:#a855f7">🧠 QLSTM Feature Importance</div>
            <div class="help-body">
              <strong>What drives the quantum LSTM prediction.</strong> Permutation importance analysis on the QLSTM model.
              <ul>
                <li><strong>Importance %</strong> — how much each feature influences the QLSTM forecast</li>
                <li><strong>Direction</strong> — <span style="color:#00e68a">↓ negative</span> = higher feature value <em>lowers</em> SFC; <span style="color:#ff3355">↑ positive</span> = <em>raises</em> SFC</li>
                <li><strong>Hybrid SFC</strong> — QLSTM prediction + GARCH(1,1) residual correction</li>
                <li><strong>ProAdapt Weight</strong> — adaptive blend between QLSTM and GARCH, updated online</li>
              </ul>
              Features with high importance are the dominant risk drivers in the quantum model.
            </div>
          </div>

          <div class="help-card">
            <div class="help-title" style="color:#ffb347">📈 Paper Trading</div>
            <div class="help-body">
              <strong>Signal-driven simulator with $10,000 starting capital.</strong>
              <ul>
                <li>Executes trades based on SFC signal, Kelly allocation, and dynamic floor</li>
                <li>Tracks equity, return, Sharpe ratio, win rate, and max drawdown</li>
                <li>All trades logged with timestamps and rationale</li>
                <li>Use <strong>Reset</strong> to restart or <strong>Export</strong> to download CSV</li>
              </ul>
              Paper trading is client-side only — no data is saved to the server.
            </div>
          </div>

        </div>
      </div>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  buildFactorChart(d);
  buildMethodChart(d);
  updatePriceChart();
  processSignalFromSFC(d);
}

/* ── PAPER TRADING ENGINE ── */
class PaperTrader {
  constructor(capital = 10000) {
    this.capital = capital;
    this.initial = capital;
    this.positions = [];
    this.trades = [];
    this.pnlHistory = [];
    this.status = 'IDLE';
  }
  decide(signal) {
    const { action, confidence, winProb } = signal;
    if (confidence < 20 || (winProb || 0) < 0.3) return { action: 'CASH', size: 0, reason: 'Low confidence' };
    if (action === 'CASH') return { action: 'CASH', size: 0, reason: 'Signal says cash' };
    const kelly = Math.max(0, Math.min(0.25, ((winProb||0.5) * 2 - (1-(winProb||0.5))) / 2));
    const size = this.capital * kelly;
    if (size < 10) return { action: 'CASH', size: 0, reason: 'Size too small' };
    return { action: action === 'BUY' ? 'LONG' : 'SHORT', size, reason: `${confidence}% conf, ${((winProb||0)*100).toFixed(0)}% win` };
  }
  execute(decision, price) {
    if (decision.size <= 0) return;
    const trade = { id: this.trades.length+1, date: new Date(), action: decision.action, size: decision.size, price, reason: decision.reason };
    this.trades.push(trade);
    this.positions.push({ type: decision.action, entryPrice: price, size: decision.size, entryDate: new Date() });
    if (decision.action === 'LONG') this.capital -= decision.size;
    else this.capital += decision.size;
    this.status = 'IN_MARKET';
    return trade;
  }
  closeAll(price) {
    for (const pos of [...this.positions]) {
      let pnl = 0;
      if (pos.type === 'LONG') { pnl = (price - pos.entryPrice) / pos.entryPrice * pos.size; this.capital += pos.size + pnl; }
      else { pnl = (pos.entryPrice - price) / pos.entryPrice * pos.size; this.capital -= pos.size - pnl; }
      const closed = { ...pos, exitPrice: price, exitDate: new Date(), pnl: Math.round(pnl*100)/100 };
      this.trades.push(closed);
    }
    this.positions = [];
    this.status = 'IDLE';
  }
  updatePnL(price) {
    let unrealized = 0;
    for (const p of this.positions) {
      if (p.type === 'LONG') unrealized += (price - p.entryPrice) / p.entryPrice * p.size;
      else unrealized += (p.entryPrice - price) / p.entryPrice * p.size;
    }
    const equity = this.capital + unrealized;
    this.pnlHistory.push({ date: new Date(), equity, unrealized });
    return equity;
  }
  getPerf() {
    const equity = this.pnlHistory.length > 0 ? this.pnlHistory[this.pnlHistory.length-1].equity : this.initial;
    const totalRet = (equity - this.initial) / this.initial;
    const closed = this.trades.filter(t => t.pnl !== undefined);
    const wins = closed.filter(t => t.pnl > 0);
    const rets = this.pnlHistory.map(h => (h.equity - this.initial) / this.initial);
    const mean = rets.reduce((a,b)=>a+b,0) / (rets.length||1);
    const std = Math.sqrt(rets.map(r => (r-mean)**2).reduce((a,b)=>a+b,0) / (rets.length||1));
    let peak = this.initial;
    let mdd = 0;
    for (const h of this.pnlHistory) {
      if (h.equity > peak) peak = h.equity;
      mdd = Math.max(mdd, (peak - h.equity) / peak);
    }
    return { equity, totalReturn: totalRet, sharpe: std > 0 ? mean/std * Math.sqrt(252) : 0, winRate: closed.length > 0 ? wins.length/closed.length : 0, maxDD: mdd, trades: this.trades.length, status: this.status };
  }
}

// Global paper trader instance
let paperTrader = null;

function initPaperTrading() {
  paperTrader = new PaperTrader(10000);
  // Restore from localStorage if available
  try {
    const saved = localStorage.getItem('sfc_paper_trades');
    if (saved) {
      const data = JSON.parse(saved);
      paperTrader.capital = data.capital || 10000;
      paperTrader.positions = data.positions || [];
      paperTrader.trades = data.trades || [];
      paperTrader.pnlHistory = data.pnlHistory || [];
      paperTrader.status = data.status || 'IDLE';
    }
  } catch(e) {}
  // DON'T update DOM here — render() hasn't run yet
}

function processSignalFromSFC(d) {
  if (!paperTrader) return;
  
  // First run — init display
  if (paperTrader.pnlHistory.length === 0 && paperTrader.trades.length === 0) {
    updatePaperDisplay({ equity: paperTrader.capital });
    addPaperLog('🟢 Paper trading initialized with $10,000 capital');
    addPaperLog('⏳ Waiting for signal from SFC model...');
  }
  
  const price = d.btc || 60000;
  const sfc = (d.sfc_effective || 0) / 100;
  const conf = (d.composite_confidence || 0.3);
  const winProb = Math.min(0.9, Math.max(0.1, (1 - sfc) * 0.4 + conf * 0.4 + 0.2));
  
  let action = 'CASH';
  if (sfc > 0.4 && conf < 0.3) action = 'CASH';
  else if (sfc > 0.35) action = 'CASH';
  else if (sfc < 0.15 && conf > 0.3) action = 'BUY';
  else action = 'CASH';
  
  const signal = { action, confidence: Math.round(conf * 100), winProb: Math.round(winProb * 100) / 100 };
  const decision = paperTrader.decide(signal);
  
  // Check if need to close positions
  if (decision.action === 'CASH' && paperTrader.positions.length > 0) {
    paperTrader.closeAll(price);
    addPaperLog(`🔴 [CLOSE] All positions at $${fmtNum(price,0)} — signal says cash`);
    document.getElementById('paperStatus').textContent = '● CASH';
  }
  // Open new position if idle
  else if (decision.action !== 'CASH' && paperTrader.positions.length === 0) {
    const trade = paperTrader.execute(decision, price);
    if (trade) {
      addPaperLog(`🟢 [OPEN] ${decision.action} $${fmtNum(decision.size,0)} at $${fmtNum(price,0)} — ${decision.reason}`);
      document.getElementById('paperStatus').textContent = '● IN MARKET';
    }
  }
  
  // Update PnL
  const equity = paperTrader.updatePnL(price);
  updatePaperDisplay({ equity, price });
  
  // Save state
  try { localStorage.setItem('sfc_paper_trades', JSON.stringify({ capital: paperTrader.capital, positions: paperTrader.positions, trades: paperTrader.trades.slice(-200), pnlHistory: paperTrader.pnlHistory.slice(-500), status: paperTrader.status })); } catch(e) {}
}

function updatePaperDisplay(state) {
  if (!paperTrader) return;
  const perf = paperTrader.getPerf();
  const el = id => document.getElementById(id);
  el('paperEquity').textContent = '$' + fmtNum(Math.round(perf.equity), 0);
  el('paperEquity').style.color = perf.totalReturn >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
  el('paperReturn').textContent = (perf.totalReturn * 100).toFixed(1) + '%';
  el('paperReturn').style.color = perf.totalReturn >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
  if (perf.trades > 0) {
    el('paperSharpe').textContent = perf.sharpe.toFixed(2);
    el('paperSharpe').style.color = perf.sharpe > 1.5 ? 'var(--accent-green)' : perf.sharpe > 0.5 ? 'var(--accent-yellow)' : 'var(--accent-red)';
    el('paperWinRate').textContent = (perf.winRate * 100).toFixed(0) + '%';
    el('paperWinRate').style.color = perf.winRate > 0.6 ? 'var(--accent-green)' : 'var(--accent-yellow)';
    el('paperDD').textContent = (perf.maxDD * 100).toFixed(1) + '%';
    el('paperDD').style.color = perf.maxDD < 0.1 ? 'var(--accent-green)' : perf.maxDD < 0.2 ? 'var(--accent-yellow)' : 'var(--accent-red)';
  }
}

function addPaperLog(msg) {
  const log = document.getElementById('paperLog');
  if (!log) return;
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  // Keep last 100
  while (log.children.length > 100) log.removeChild(log.firstChild);
}

function resetPaperTrading() {
  paperTrader = new PaperTrader(10000);
  try { localStorage.removeItem('sfc_paper_trades'); } catch(e) {}
  document.getElementById('paperLog').innerHTML = '<div>🟢 Paper trading reset to $10,000 capital</div>';
  document.getElementById('paperStatus').textContent = '● IDLE';
  updatePaperDisplay({ equity: 10000 });
}

function exportPaperTrades() {
  if (!paperTrader || paperTrader.trades.length === 0) { addPaperLog('⚠ No trades to export'); return; }
  const dataStr = JSON.stringify(paperTrader.trades, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sfc_paper_trades_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  addPaperLog('📥 Trades exported (' + paperTrader.trades.length + ' entries)');
}

/* ── HISTORY FUNCTIONS ── */
let historyPoints = [];
function loadHistory() {
  try { const s = sessionStorage.getItem('sfc_history'); if (s) historyPoints = JSON.parse(s); } catch(e) {}
}
function pushHistory(btc, floor) {
  historyPoints.push({ t: Date.now(), btc, floor });
  if (historyPoints.length > 200) historyPoints = historyPoints.slice(-200);
  try { sessionStorage.setItem('sfc_history', JSON.stringify(historyPoints)); } catch(e) {}
}

loadHistory();
initPaperTrading();

  render(__EMBEDDED_DATA);
  setTimeout(startNewsSlide, 100);
} else if (window.__EMBEDDED_DATA) {
  render(window.__EMBEDDED_DATA);
  setTimeout(startNewsSlide, 100);
} else {
  fetchLiveData().then(() => setTimeout(startNewsSlide, 100));
}
setInterval(fetchLiveData, 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW failed:', e));
