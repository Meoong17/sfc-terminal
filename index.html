  border-radius: 20px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width: 1200px) {
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }

@media (max-width: 768px) {

  .col4-grid { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; text-align: center; }
  .topbar-right { justify-content: center; }
  .methods-grid { grid-template-columns: repeat(2, 1fr); }
  .dual-block { grid-template-columns: 1fr; }
  .help-grid { grid-template-columns: 1fr; }
  .sfc-number { font-size: 48px; }
}
</style>

function sfcKpiAccent(s) { if (s >= 50) return 'accent-red'; if (s >= 25) return 'accent-yellow'; return 'accent-green'; }

/* ── CHART HELPERS ── */
function pushHistory(btc, floor) {
  if (!btc || !floor) return;
  const last = historyPoints[historyPoints.length - 1];
  if (last && last.btc === btc && last.floor === floor) return;
  historyPoints.push({ t: Date.now(), btc, floor });
  if (historyPoints.length > 100) historyPoints.shift();
  sessionStorage.setItem('sfc_history', JSON.stringify(historyPoints));
  updatePriceChart();
}
function loadHistory() {
  try { const s = sessionStorage.getItem('sfc_history'); if (s) historyPoints = JSON.parse(s); } catch(e) {}
}

let _chartDefaults = {
  responsive: true,
  maintainAspectRatio: true,
  plugins: {
    legend: { labels: { color: '#8892a8', font: { family: 'Inter', size: 10 }, boxWidth: 12, padding: 12 } },
    tooltip: { mode: 'index', intersect: false, backgroundColor: '#171d2b', titleColor: '#f0f4f8', bodyColor: '#8892a8', borderColor: 'rgba(255,255,255,0.06)', borderWidth: 1, padding: 10, cornerRadius: 8 }
  },
  scales: {
    x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#5a6478', font: { family: 'Inter', size: 10 } } },
    y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#5a6478', font: { family: 'Inter', size: 10 } } }
  }
};

function buildFactorChart(d) {
  const canvas = document.getElementById('factorChart');
  if (!canvas) return;
  if (factorChart) factorChart.destroy();
  const factors = d.factors || {};
  const keys = ['Lt', 'St', 'Rt', 'Ft', 'Sc'];
  const labels = ['Liquidity', 'Structural', 'Sentiment', 'Systemic', 'External'];
  const raw = keys.map(k => factors[k] ?? 0);
  const colors = raw.map(v => v >= 0 ? 'rgba(0,230,138,0.7)' : 'rgba(255,51,85,0.7)');
  const borderColors = raw.map(v => v >= 0 ? '#00e68a' : '#ff3355');

  factorChart = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Factor Score',
        data: raw,
        backgroundColor: colors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 4,
        barThickness: 20
      }]
    },
    options: {
      ..._chartDefaults,
      indexAxis: 'y',
      plugins: {
        ..._chartDefaults.plugins,
        legend: { display: false }
      },
      scales: {
        x: {
          ..._chartDefaults.scales.x,
          min: -3,
          max: 3,
          ticks: { ..._chartDefaults.scales.x.ticks, callback: v => v.toFixed(1) }
        },
        y: {
          ..._chartDefaults.scales.y,
          grid: { display: false }
        }
      }
    }
  });
}

function buildMethodChart(d) {
  const canvas = document.getElementById('methodChart');
  if (!canvas) return;
  if (methodChart) methodChart.destroy();

  const vals = [
    d.m1_klr ?? d.sfc_base * 0.9 ?? 10,
    d.m2_logit ?? d.sfc_base * 1.1 ?? 15,
    d.m3_bayes ?? d.sfc_base * 0.85 ?? 12,
    d.m4_ewc ?? d.sfc_base * 0.7 ?? 8,
    d.m5_qreg ?? 10,
    d.m6_regime_score ?? 1.2
  ];
  const colors = ['rgba(0,230,138,0.7)', 'rgba(74,158,255,0.7)', 'rgba(168,85,247,0.7)', 'rgba(255,179,71,0.7)', 'rgba(0,230,255,0.7)', 'rgba(255,51,85,0.7)'];
  const borders = ['#00e68a', '#4a9eff', '#a855f7', '#ffb347', '#00e6ff', '#ff3355'];

  methodChart = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: ['KLR', 'LOGIT', 'BAYES', 'EWC', 'QREG', 'REGIME'],
      datasets: [{
        label: 'Stress Probability',
        data: vals,
        backgroundColor: colors,
        borderColor: borders,
        borderWidth: 1,
        borderRadius: 4,
        barThickness: 22
      }]
    },
    options: {
      ..._chartDefaults,
      plugins: {
        ..._chartDefaults.plugins,
        legend: { display: false }
      },
      scales: {
        y: {
          ..._chartDefaults.scales.y,
          beginAtZero: true,
          ticks: { ..._chartDefaults.scales.y.ticks, callback: v => v.toFixed(0) + '%' }
        }
      }
    }
  });
}

function updatePriceChart() {
  const canvas = document.getElementById('priceChart');
  if (!canvas) return;
  if (priceChart) priceChart.destroy();
  if (historyPoints.length < 1) return;

  const labels = historyPoints.map(p => new Date(p.t).toLocaleTimeString());
  const btcP = historyPoints.map(p => p.btc);
  const flrP = historyPoints.map(p => p.floor);

  priceChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'BTC Price',
          data: btcP,
          borderColor: '#00e68a',
          backgroundColor: 'rgba(0,230,138,0.06)',
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          fill: true,
          tension: 0.3
        },
        {
          label: 'SFC Floor',
          data: flrP,
          borderColor: '#ff3355',
          backgroundColor: 'rgba(255,51,85,0.04)',
          borderWidth: 1.5,
          borderDash: [5, 5],
          pointRadius: 0,
          fill: false,
          tension: 0.3
        }
      ]
    },
    options: {
      ..._chartDefaults,
      plugins: {
        ..._chartDefaults.plugins,
        legend: { ..._chartDefaults.plugins.legend, position: 'top' }
      },
      scales: {
        x: { ..._chartDefaults.scales.x, grid: { display: false } },
        y: { ..._chartDefaults.scales.y, ticks: { ..._chartDefaults.scales.y.ticks, callback: v => '$' + fmtNum(v) } }
      }
    }
  });
}

    <div class="card full-row news-ticker">
      <div class="card-hd">
        <span class="card-title"><span class="card-title-icon">📰</span>News Sentiment <span style="font-weight:400;color:${(d.news_sentiment || 0) < 0 ? '#ff3355' : '#00e68a'}">${d.news_sentiment > 0 ? '+' : ''}${fmtNum(d.news_sentiment, 2)}</span></span>
        <span class="card-title" style="font-size:10px;font-weight:400">${d.news_stats?.total_articles || 0} articles · ${d.news_stats?.sources_hit || 0} sources</span>
      </div>
      <div class="card-bd">
        <div class="news-scroll">
          ${headlines.map(h => `<div class="news-item">${h.replace(/^[^[]*?\[/,'[')}</div>`).join('')}
        </div>
      </div>
    </div>` : ''}

    <div class="footer">
      <span>SFC·Terminal v2.1 &mdash; Quantitative Stress Index</span>
      <div class="footer-links">
        <span class="footer-link" onclick="fetchLiveData()">⟳ Refresh</span>
        <span class="footer-link" onclick="toggleHelp()">📖 Help</span>
      </div>
    </div>

    <div id="helpPanel" style="display:${helpVisible ? 'block' : 'none'}">
      <div class="help-panel">
        <h4>📖 How to Read SFC Terminal</h4>
        <div class="help-grid">
          <div><strong style="color:#00e68a">SFC Stress Index</strong><br>0-100% composite. &lt;25% Normal, 25-50% Elevated, &gt;50% Critical.</div>
          <div><strong style="color:#00e68a">DVOL</strong><br>Deribit implied volatility. &gt;100% indicates panic/capitulation.</div>
          <div><strong style="color:#00e68a">Floor Price</strong><br>Mathematical support level based on ATH + market conditions.</div>
          <div><strong style="color:#00e68a">RSI-14</strong><br>Relative Strength Index. &lt;30 oversold, &gt;70 overbought.</div>
          <div><strong style="color:#00e68a">SOPR</strong><br>Spent Output Profit Ratio. &lt;0.97 capitulation, &gt;1.03 distribution.</div>
          <div><strong style="color:#00e68a">Composite Confidence</strong><br>Signal strength from all 6 methods + technicals.</div>
          <div><strong style="color:#00e68a">Method Consensus</strong><br>How strongly the 6 models agree on the stress level.</div>
          <div><strong style="color:#00e68a">Liquidation Heatmap</strong><br>Derived from DVOL, SOPR, and RSI to gauge squeeze risk.</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  buildFactorChart(d);
  buildMethodChart(d);
  updatePriceChart();
}

/* ── CHART VISIBILITY ── */
let chartVisible = true;
function toggleChartVisibility() {
  chartVisible = !chartVisible;
  const c = document.getElementById('chartContainer');
  if (c) c.style.display = chartVisible ? 'block' : 'none';
}

/* ── FETCH ── */
async function fetchLiveData() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    window.__EMBEDDED_DATA = data;
    render(data);
    return true;
  } catch (e) {
    console.log('Fetch failed:', e);
    return false;
  }
}

function toggleHelp() {
  helpVisible = !helpVisible;
  const p = document.getElementById('helpPanel');
  if (p) p.style.display = helpVisible ? 'block' : 'none';
}

/* ── INIT ── */
loadHistory();
if (window.__EMBEDDED_DATA) {
  render(window.__EMBEDDED_DATA);
} else {
  fetchLiveData();
}
setInterval(fetchLiveData, 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW failed:', e));
}
</script>
</body>
</html>
