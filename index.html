<!DOCTYPE html>
<!-- b=1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com https://sfc-terminal.meoong17.workers.dev; base-uri 'self'; form-action 'self'">
<title>SFC Terminal | Quantitative Stress Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SFC TERMINAL v4 — Redesigned Design System
   Dark-mode, Linear-inspired precision with crypto-accent purple
══════════════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void:      #07080d;
  --bg-base:      #0b0d15;
  --bg-card:      #0e111a;
  --bg-raise:     #131723;
  --bg-float:     #1a1f2e;
  --bg-hover:     #1f2436;

  --border-0:    rgba(255,255,255,0.03);
  --border-1:    rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.09);
  --border-3:    rgba(255,255,255,0.14);

  --text-1: #edf1f7;
  --text-2: #8892a8;
  --text-3: #49536b;
  --text-4: #2a3347;

  --purple:   #7864ff;
  --purple2:  #5d4ae0;
  --purple-dim: rgba(120,100,255,0.12);
  --purple-glow: rgba(120,100,255,0.2);
  --purple-border: rgba(120,100,255,0.3);

  --cyan:     #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.1);
  --green:    #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --red:      #ff4060;
  --red-dim:   rgba(255,64,96,0.1);
  --amber:    #f0b429;
  --amber-dim: rgba(240,180,41,0.1);
  --blue:     #4a9eff;
  --blue-dim:  rgba(74,158,255,0.1);

  --grad-purple:  linear-gradient(135deg,#7864ff,#5d4ae0);
  --grad-cyan:    linear-gradient(135deg,#00d4ff,#0099e6);
  --grad-green:   linear-gradient(135deg,#00f5a0,#00c87b);
  --grad-red:     linear-gradient(135deg,#ff4060,#cc1a35);
  --grad-amber:   linear-gradient(135deg,#f0b429,#d48a00);
  --border-red: #ff4060;
  --border-green: #00f5a0;

  --glow-purple: 0 0 30px rgba(120,100,255,0.15);
  --glow-cyan:   0 0 30px rgba(0,212,255,0.12);
  --glow-green:  0 0 30px rgba(0,245,160,0.12);
  --glow-red:    0 0 30px rgba(255,64,96,0.12);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --nav-h: 56px;
  --band-h: 36px;
  --bottom-nav-h: 60px;

  /* Premium elevation system — layered shadows for true depth */
  --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.02);
  --shadow-card-hover: 0 2px 4px rgba(0,0,0,0.45), 0 16px 40px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  --shadow-raised: 0 4px 16px -4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

html { height: 100%; }

body {
  background: var(--bg-void);
  color: var(--text-1);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(120,100,255,0.45), rgba(0,212,255,0.35));
  border-radius: 6px;
  border: 1px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, rgba(120,100,255,0.7), rgba(0,212,255,0.55));
  background-clip: padding-box;
}
::-webkit-scrollbar-corner { background: transparent; }
html { scrollbar-color: rgba(120,100,255,0.45) transparent; scrollbar-width: thin; }

/* ══════════════════════════════════════════
   LOADING SCREEN
══════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
.loading-logo {
  width: 56px; height: 56px;
  border-radius: var(--r-md);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.loading-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border-2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: var(--nav-h);
  background: rgba(8,9,15,0.98);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border-bottom: 1px solid var(--border-1);
  box-shadow: 0 1px 0 rgba(255,255,255,0.02);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 10px;
  color: #fff;
  box-shadow: var(--glow-purple), inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 6px rgba(0,0,0,0.3);
}
.nav-wordmark { display: flex; flex-direction: column; }
.nav-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}
.nav-title span { color: var(--purple); }
.nav-sub {
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 1px;
}

.nav-center {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255,255,255,0.03);
  padding: 3px;
  border-radius: 9px;
  border: 1px solid var(--border-1);
}
.nav-tab {
  padding: 6px 13px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.18s var(--ease-out);
  white-space: nowrap;
}
.nav-tab:hover { color: var(--text-1); background: rgba(255,255,255,0.05); }
.nav-tab.active { color: #fff; background: var(--purple-dim); box-shadow: inset 0 0 0 1px var(--purple-border), 0 1px 4px rgba(120,100,255,0.15); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-meta { display: flex; flex-direction: column; align-items: flex-end; }
.nav-meta-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.sync-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  transition: background 0.2s;
}
.sync-dot.is-syncing {
  background: var(--cyan);
  animation: syncPulse 0.9s ease-in-out infinite;
}
@keyframes syncPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.4); }
}
.nav-meta-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-1);
}
.nav-pill {
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.pill-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.pill-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--border-red); }

/* ══════════════════════════════════════════
   STATUS BAND
══════════════════════════════════════════ */
.status-band {
  display: flex;
  gap: 6px;
  padding: 6px 24px;
  height: var(--band-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-1);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.status-band::-webkit-scrollbar { display: none; }
.s-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid var(--border-1);
  background: var(--bg-card);
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}
.s-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.dot-g { background: var(--green); box-shadow: 0 0 5px rgba(0,245,160,0.5); }
.dot-r { background: var(--red);   box-shadow: 0 0 5px rgba(255,64,96,0.5); }
.dot-a { background: var(--amber); box-shadow: 0 0 5px rgba(240,180,41,0.5); }
.dot-b { background: var(--blue);  box-shadow: 0 0 5px rgba(74,158,255,0.5); }
.dot-c { background: var(--cyan);  box-shadow: 0 0 5px rgba(0,212,255,0.5); }
.dot-p { background: var(--purple);box-shadow: 0 0 5px rgba(120,100,255,0.5); }

/* ══════════════════════════════════════════
   BOTTOM NAV (mobile only)
══════════════════════════════════════════ */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  height: var(--bottom-nav-h);
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: rgba(9,10,17,0.98);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border-top: 1px solid var(--border-1);
  box-shadow: 0 -8px 24px -8px rgba(0,0,0,0.5);
}
.bottom-nav-track {
  display: flex;
  align-items: stretch;
  height: var(--bottom-nav-h);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.bottom-nav-track::-webkit-scrollbar { display: none; }
.bnav-item {
  flex: 1 0 0;
  min-width: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-3);
  cursor: pointer;
  position: relative;
  transition: color 0.18s var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.bnav-item svg { display: block; transition: transform 0.18s var(--ease-out); }
.bnav-item-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.bnav-item.active { color: var(--purple); }
.bnav-item.active svg { transform: translateY(-1px); filter: drop-shadow(0 0 6px rgba(120,100,255,0.5)); }
.bnav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 28px; height: 2px;
  border-radius: 0 0 3px 3px;
  background: var(--grad-purple);
  box-shadow: 0 0 8px rgba(120,100,255,0.6);
}
.bnav-item:active { color: var(--text-1); }

/* ══════════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════════ */
.main {
  padding: 20px 24px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* Section heading bar — groups related cards within a tab */
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 28px 0 14px;
}
.section-head:first-child { margin-top: 0; }
.section-head-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-2), transparent);
}
.section-head-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-2);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 7px;
}
.section-head-label::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--purple);
  box-shadow: 0 0 6px rgba(120,100,255,0.6);
}
.section-head-meta {
  font-size: 9px;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

/* ══════════════════════════════════════════
   KPI ROW
══════════════════════════════════════════ */
.kpi-row {
  display: grid;
  grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  position: relative;
  transition: border-color 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), transform 0.25s var(--ease-out);
  box-shadow: var(--shadow-card);
}
.kpi:hover {
  border-color: var(--border-2);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-1px);
}

.kpi-hero {
  border-color: var(--purple-border);
  background: linear-gradient(135deg, rgba(120,100,255,0.08) 0%, var(--bg-card) 100%);
}
.kpi-hero:hover {
  border-color: rgba(120,100,255,0.45);
  box-shadow: var(--glow-purple), var(--shadow-card-hover);
}

/* Gradient top accent for all KPIs */
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 2px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  opacity: 0.7;
}
.kpi-hero::before { background: var(--grad-purple); }

/* Pulse highlight when a value updates via count-up animation */
@keyframes pulseUpdate {
  0% { box-shadow: var(--shadow-card), 0 0 0 0 rgba(0,212,255,0); border-color: var(--border-1); }
  20% { box-shadow: var(--shadow-card), 0 0 0 1px rgba(0,212,255,0.5), 0 0 20px -2px rgba(0,212,255,0.35); border-color: rgba(0,212,255,0.5); }
  100% { box-shadow: var(--shadow-card), 0 0 0 0 rgba(0,212,255,0); border-color: var(--border-1); }
}
.pulse-update { animation: pulseUpdate 0.9s var(--ease-out); }

.kpi-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.kpi-label.info-tip, .stat-label.info-tip, .info-k.info-tip, .metric-label.info-tip {
  display: inline-flex;
  border-bottom: none;
  cursor: help;
}
.kpi-label.info-tip::after, .stat-label.info-tip::after, .info-k.info-tip::after, .metric-label.info-tip::after { text-transform: none; letter-spacing: 0; font-size: 10px; }
.metric-label.info-tip { justify-content: center; width: 100%; }

/* ── CSS-only tooltip ──
   Usage: <span class="info-tip" data-tip="Explanation text">Label</span>
   Pure CSS, no JS listeners — shows on hover/focus, positions above the trigger. */
.info-tip {
  position: relative;
  cursor: help;
  border-bottom: 1px dotted var(--text-4);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.info-tip::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 2px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  border: 5px solid transparent;
  border-top-color: rgba(14,16,24,0.98);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s var(--ease-out), transform 0.15s var(--ease-out);
  pointer-events: none;
  z-index: 300;
}
.info-tip::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: rgba(14,16,24,0.98);
  border: 1px solid var(--border-2);
  color: var(--text-1);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1.4;
  padding: 7px 10px;
  border-radius: 7px;
  width: max-content;
  max-width: 220px;
  white-space: normal;
  box-shadow: 0 8px 24px -4px rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s var(--ease-out), transform 0.15s var(--ease-out);
  pointer-events: none;
  z-index: 300;
}
.info-tip:hover::after, .info-tip:hover::before,
.info-tip:focus::after, .info-tip:focus::before {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
.info-tip-icon {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--bg-raise);
  color: var(--text-3);
  font-size: 8px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.kpi-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 3px;
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
}
.kpi-hero .kpi-num {
  font-size: 33px;
  background: linear-gradient(135deg, #fff 0%, #c8c2ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.kpi-aux {
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
}
.kpi-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 3px;
}
.kb-g { background: var(--green-dim); color: var(--green); }
.kb-r { background: var(--red-dim); color: var(--red); }
.kb-a { background: var(--amber-dim); color: var(--amber); }

.kpi-spark {
  position: absolute;
  right: 12px;
  bottom: 12px;
  opacity: 0.85;
  pointer-events: none;
  transition: opacity 0.2s;
}
.kpi:hover .kpi-spark { opacity: 1; }
.kpi-spark .sparkline { display: block; width: 56px; height: 22px; }
.kpi-hero .kpi-spark { right: 16px; bottom: 16px; opacity: 0.7; }
.kpi-hero .kpi-spark .sparkline { width: 90px; height: 32px; }

.chg-p { color: var(--green); }
.chg-n { color: var(--red); }
.chg-z { color: var(--text-2); }

/* ══════════════════════════════════════════
   GRID LAYOUTS
══════════════════════════════════════════ */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.span-full { grid-column: 1 / -1; }

/* ══════════════════════════════════════════
   CARD
══════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: border-color 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), transform 0.25s var(--ease-out);
  position: relative;
  box-shadow: var(--shadow-card);
}
.card:hover {
  border-color: var(--border-2);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-1px);
}

/* Gradient top accent bar for all cards */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 1.5px;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: linear-gradient(90deg, transparent, rgba(120,100,255,0.35), transparent);
  opacity: 0.5;
  transition: opacity 0.25s var(--ease-out);
  z-index: 1;
}
.card:hover::before { opacity: 0.85; }

.card-head {
  padding: 13px 18px 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-1);
  gap: 8px;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-2);
}
.card-icon {
  width: 21px; height: 21px;
  border-radius: 6px;
  background: var(--bg-raise);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.3);
}
.card-icon svg { display: block; }
.card-badge {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
}
.card-body { padding: 18px; }
.card-collapsed .card-body { display: none; }
.card-collapsed .card-head { cursor: pointer; }
.card-collapsed .card-head:hover { background: var(--bg-hover); }
.card-collapsed .card-head .collapse-arrow { transition: transform 0.2s; }
.card-collapsed .card-head .collapse-arrow { transform: rotate(-90deg); }
.card-body-sm { padding: 12px 18px; }

/* Headline card — visually elevated treatment for the most important card in a tab
   (e.g. SFC Stress Index, BTC Price chart). Distinguishes "the answer" from supporting detail. */
.card-headline {
  border-color: var(--purple-border);
  background: linear-gradient(165deg, rgba(120,100,255,0.06) 0%, var(--bg-card) 28%);
}
.card-headline::before {
  background: linear-gradient(90deg, transparent, rgba(120,100,255,0.6), transparent);
  height: 2px;
  opacity: 0.7;
}
.card-headline:hover::before { opacity: 1; }
.card-headline .card-title {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-1);
}
.card-headline:hover {
  border-color: rgba(120,100,255,0.45);
  box-shadow: var(--glow-purple), var(--shadow-card-hover);
}

/* ══════════════════════════════════════════
   SFC STRESS HERO (Arc Gauge)
══════════════════════════════════════════ */
.sfc-hero-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 18px;
}
.sfc-arc-container {
  position: relative;
  width: 170px;
  height: 95px;
  margin-bottom: 6px;
}
.sfc-arc-container svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sfc-big-num {
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}
.sfc-desc {
  font-size: 9px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.sfc-zone-pill {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}
.zone-normal   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.zone-elevated { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.zone-critical { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }

/* Progress bar */
.prog-track {
  height: 3px;
  background: var(--bg-raise);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
}
.prog-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.pf-green  { background: var(--grad-green); }
.pf-red    { background: var(--grad-red); }
.pf-amber  { background: var(--grad-amber); }
.pf-cyan   { background: var(--grad-cyan); }
.pf-purple { background: var(--grad-purple); }

/* ══════════════════════════════════════════
   METHOD ENSEMBLE GRID
══════════════════════════════════════════ */
.method-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 12px;
}
.method-cell {
  background: var(--bg-raise);
  border-radius: var(--r-sm);
  padding: 7px 5px;
  text-align: center;
  border: 1px solid var(--border-1);
  transition: border-color 0.15s;
}
.method-cell:hover { border-color: var(--border-2); }
.method-cell-name {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.method-cell-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
}

/* ══════════════════════════════════════════
   CONSENSUS
══════════════════════════════════════════ */
.consensus-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 0;
  border-top: 1px solid var(--border-1);
  margin-top: 6px;
}
.consensus-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.consensus-info { flex: 1; }
.consensus-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 1px;
}
.consensus-sub {
  font-size: 8px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ══════════════════════════════════════════
   CHART
══════════════════════════════════════════ */
.chart-shell {
  position: relative;
  border-radius: var(--r-md);
  padding: 3px;
  background: linear-gradient(135deg, rgba(120,100,255,0.04) 0%, transparent 60%);
  overflow: hidden;
}
.chart-shell canvas {
  display: block;
  width: 100% !important;
  max-height: 220px;
}

/* ══════════════════════════════════════════
   INFO TABLE ROWS
══════════════════════════════════════════ */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
  font-size: 11px;
}
.info-row:last-child { border-bottom: none; }
.info-k {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 500;
}
.info-v {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 11px;
}

/* ══════════════════════════════════════════
   GAUGE RINGS
══════════════════════════════════════════ */
.gauge-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 4px;
}
.gauge-wrap svg { width: 100%; height: 100%; }
.gauge-center-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 16px;
}
.metric-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: center;
  margin-bottom: 6px;
}
.sopr-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 6px 0 3px;
}
.dual-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.metric-center { text-align: center; padding: 4px; }

/* ══════════════════════════════════════════
   SIGNAL BLOCK
══════════════════════════════════════════ */
.signal-pill {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sp-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.sp-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sp-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }


/* ── NEWS TICKER ── */
.news-wrap {
  margin-bottom: 14px;
  position: relative;
}
.news-viewport {
  height: 52px;
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  position: relative;
}
.news-viewport::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent 0%, var(--bg-card) 100%);
  pointer-events: none;
  z-index: 1;
}
.news-track { position: relative; height: 100%; }
.news-item {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 10px;
  color: var(--text-2);
  opacity: 0;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  will-change: transform, opacity;
  line-height: 1.5;
}
.news-item::before {
  content: '';
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--purple);
  flex-shrink: 0;
  margin-right: 8px;
}
.news-item.active  { opacity: 1; transform: translateY(0); }
.news-item.exit    { opacity: 0; transform: translateY(-100%); }
.news-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
}
.news-dot {
  height: 2px;
  width: 10px;
  border-radius: 2px;
  background: var(--text-4);
  cursor: pointer;
  transition: background 0.2s, width 0.2s;
}
.news-dot.active { background: var(--purple); width: 18px; }

/* ══════════════════════════════════════════
   KELLY / BACKTEST PANELS
══════════════════════════════════════════ */
.stat-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat-6 {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
@media (max-width: 640px) {
  .stat-6 { grid-template-columns: repeat(2, 1fr); }
}
.stat-box {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.stat-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}
.stat-note {
  font-size: 8px;
  color: var(--text-3);
  margin-top: 3px;
}

.stat-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

/* ══════════════════════════════════════════
   XAI FEATURES
══════════════════════════════════════════ */
.xai-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
}
.xai-bar-row:last-child { border-bottom: none; }
.xai-name {
  font-size: 10px;
  font-weight: 600;
  width: 100px;
  flex-shrink: 0;
  color: var(--text-1);
}
.xai-track {
  flex: 1;
  height: 5px;
  background: var(--bg-raise);
  border-radius: 5px;
  overflow: hidden;
}
.xai-fill { height: 100%; border-radius: 5px; }
.xai-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.xai-dir {
  font-size: 10px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.xai-note {
  padding: 6px 10px;
  background: rgba(120,100,255,0.04);
  border-left: 2px solid var(--purple);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
  margin-top: 10px;
}

/* ══════════════════════════════════════════
   PAPER TRADING
══════════════════════════════════════════ */
.paper-stats {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 12px 18px;
}
.paper-stat {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.paper-stat-label {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.paper-stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}
.paper-log {
  background: rgba(0,0,0,0.3);
  border-radius: var(--r-md);
  margin: 0 18px 10px;
  padding: 8px 10px;
  height: 100px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  line-height: 1.6;
  color: var(--text-2);
  border: 1px solid var(--border-1);
}
.paper-log div {
  padding: 1px 0;
  border-bottom: 1px solid rgba(255,255,255,0.015);
}

/* ── Account Summary strip (statement-style) ── */
/* ── Account Summary — vivid card grid (exchange-terminal style) ── */
.acct-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 18px 0;
}
.acct-item {
  padding: 12px 14px;
  border-radius: var(--r-lg);
  background: var(--bg-raise);
  border: 1px solid var(--border-1);
}
.acct-item.acct-pos { background: var(--green-dim); border-color: var(--border-green); }
.acct-item.acct-neg { background: var(--red-dim); border-color: var(--border-red); }
.acct-label {
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.acct-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}

/* ── Open Position — bold live card ── */
.position-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 10px 18px 0;
  padding: 12px 16px;
  border-radius: var(--r-xl);
  background: var(--grad-green);
  box-shadow: var(--glow-green);
  position: relative;
  overflow: hidden;
}
.position-row.short { background: var(--grad-red); box-shadow: var(--glow-red); }
.position-badge {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 5px 12px;
  border-radius: 100px;
  background: rgba(0,0,0,0.25);
  color: #fff;
}
.position-badge.short { background: rgba(0,0,0,0.25); }
.position-field { display: flex; flex-direction: column; gap: 2px; }
.pf-label {
  font-size: 6.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.55);
}
.pf-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: #0a0d14;
}

/* ── Performance Metrics — rounded chip grid ── */
.perf-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 6px;
  margin: 10px 18px 0;
}
.perf-cell {
  background: var(--bg-raise);
  border: 1px solid var(--border-1);
  border-radius: var(--r-md);
  padding: 8px 4px;
  text-align: center;
}
.perf-cell.perf-good { background: var(--green-dim); border-color: var(--border-green); }
.perf-cell.perf-neutral { background: var(--amber-dim); border-color: rgba(240,180,41,0.3); }
.perf-cell.perf-bad { background: var(--red-dim); border-color: var(--border-red); }
.perf-label {
  font-size: 6px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
  white-space: nowrap;
}
.perf-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}

/* ── Trade Blotter — rounded, pill badges (Binance-style) ── */
.blotter-wrap {
  margin: 10px 18px 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--bg-raise);
  border: 1px solid var(--border-1);
}
.blotter-head {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 10px 14px 6px;
}
.blotter-scroll { max-height: 220px; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.blotter-table {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
}
.blotter-table thead th {
  position: sticky; top: 0;
  background: var(--bg-float);
  color: var(--text-3);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-2);
}
.blotter-table th.num, .blotter-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.blotter-table td {
  padding: 7px 10px;
  color: var(--text-2);
  white-space: nowrap;
}
.blotter-table tbody tr:nth-child(odd) { background: rgba(255,255,255,0.012); }
.blotter-table tbody tr:hover { background: var(--bg-hover); }
.side-pill {
  display: inline-block;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 100px;
}
.side-pill.long { background: var(--green); color: #04140d; }
.side-pill.short { background: var(--red); color: #1a0509; }
.blotter-table .pnl-pos { color: var(--green); font-weight: 700; }
.blotter-table .pnl-neg { color: var(--red); font-weight: 700; }

/* ── System log (subdued status strip, was the old prominent paper-log) ── */
.sys-log {
  background: rgba(0,0,0,0.2);
  border-radius: var(--r-md);
  margin: 10px 18px 0;
  padding: 6px 10px;
  max-height: 60px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  line-height: 1.6;
  color: var(--text-3);
  border: 1px solid var(--border-0);
}
.sys-log div {
  padding: 1px 0;
}

/* ── Mobile responsive breakpoint ── */
@media (max-width: 640px) {
  .acct-summary {
    grid-template-columns: repeat(2, 1fr);
  }
  .acct-item:nth-child(2) { border-right: none; }
  .acct-item:nth-child(3), .acct-item:nth-child(4) { border-top: 1px solid var(--border-1); }
  .acct-val { font-size: 13px; }

  .perf-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .perf-val { font-size: 10px; }

  .position-row { flex-wrap: wrap; row-gap: 8px; }

  .blotter-table { font-size: 9px; }
  .blotter-table th, .blotter-table td { padding: 5px 6px; }

  .card-title { flex-wrap: wrap; }
  .card-title > span { flex-basis: 100%; margin-left: 0 !important; }

  .paper-controls { flex-wrap: wrap; }
  .paper-btn { flex: 1 1 auto; white-space: nowrap; }
}

.paper-controls {
  display: flex;
  gap: 6px;
  padding: 0 18px 12px;
}
.paper-btn {
  padding: 5px 12px;
  border-radius: var(--r-sm);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Space Grotesk', sans-serif;
  border: none;
}
.pb-green {
  background: var(--green-dim);
  border: 1px solid rgba(0,245,160,0.2);
  color: var(--green);
}
.pb-green:hover { background: var(--green); color: #07080d; }
.pb-red {
  background: var(--red-dim);
  border: 1px solid rgba(255,64,96,0.2);
  color: var(--red);
}
.pb-red:hover { background: var(--red); color: #07080d; }

.paper-collapse {
  cursor: pointer;
  padding: 2px 0;
  font-size: 8px;
  color: var(--text-3);
  text-align: center;
  user-select: none;
}
.paper-collapse:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   HELP PANEL
══════════════════════════════════════════ */
.help-panel {
  margin-top: 12px;
  background: var(--bg-base);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  padding: 18px;
}
.help-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.help-card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 12px;
}
.help-card-full { grid-column: 1 / -1; }
.help-card-title {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 6px;
}
.help-body {
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}
.help-body ul, .help-body ol { margin: 3px 0; padding-left: 12px; }
.help-body li { margin-bottom: 1px; }
.help-body code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  background: var(--purple-dim);
  padding: 1px 4px;
  border-radius: 2px;
  color: var(--purple);
}
.help-body strong { color: var(--text-1); font-weight: 600; }

/* ══════════════════════════════════════════
   SECURITY CHIPS
══════════════════════════════════════════ */
.sec-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sc-critical { background: rgba(255,64,96,0.12); color: var(--red); border: 1px solid rgba(255,64,96,0.2); }
.sc-high     { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sc-safe     { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.sec-event-text {
  margin-top: 6px;
  padding: 6px 10px;
  background: rgba(255,64,96,0.03);
  border-left: 2px solid var(--red);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border-1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--text-3);
  flex-wrap: wrap;
  gap: 6px;
}
.footer-links { display: flex; gap: 12px; }
.footer-link {
  cursor: pointer;
  transition: color 0.2s;
  font-weight: 500;
}
.footer-link:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   CALIBRATION NOTE
══════════════════════════════════════════ */
.calib-note {
  padding: 6px 8px;
  background: var(--amber-dim);
  border-left: 2px solid var(--amber);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 8px;
  color: var(--text-2);
  margin-top: 8px;
}

/* ══════════════════════════════════════════
   MISC UTILITIES
══════════════════════════════════════════ */
.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mt-4  { margin-top: 4px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.text-center { text-align: center; }
.mono { font-family: 'JetBrains Mono', monospace; }
.text-sm { font-size: 9px; color: var(--text-3); }
.text-xs { font-size: 8px; color: var(--text-3); }

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media (max-width: 1400px) {
  .kpi-row { grid-template-columns: 2fr 1fr 1fr 1fr; }
}
@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .help-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-4 { grid-template-columns: repeat(2, 1fr); }
  .nav-meta { display: none; }
  .nav-sub { display: none; }
  nav.nav { padding: 0 16px; gap: 10px; }
  .nav-center { gap: 1px; }
  .nav-tab { padding: 6px 10px; font-size: 10.5px; }
}
@media (max-width: 768px) {
  nav.nav { padding: 0 14px; height: 56px; }
  .nav-center { display: none; }
  .nav-sub { display: none; }
  .nav-meta { display: none; }
  .main { padding: 14px; padding-bottom: calc(var(--bottom-nav-h) + 20px); }
  .card-title { font-size: 9.5px; letter-spacing: 0.04em; }
  .card-head { flex-wrap: wrap; gap: 4px 8px; }
  .card-badge { font-size: 8.5px; }
  .section-head-meta { display: none; }
  .status-band { padding: 6px 14px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .kpi-hero .kpi-num { font-size: 24px; }
  .kpi-num { font-size: 18px; }
  .kpi-hero { grid-column: 1 / -1; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr; }
  .paper-stats { grid-template-columns: repeat(4, 1fr); }
  .help-grid { grid-template-columns: 1fr; }
  .dual-cols { grid-template-columns: 1fr; }
  .stat-3 { grid-template-columns: 1fr 1fr; }
  .sfc-big-num { font-size: 36px; }
  .stat-4 { grid-template-columns: repeat(2, 1fr); }
  .chart-shell canvas { height: 160px !important; }
  .bottom-nav { display: block; }
  .footer { padding-bottom: calc(var(--bottom-nav-h) + 14px); }
  .donate-card { display: none; }
}
@media (max-width: 480px) {
  .kpi-hero .kpi-num { font-size: 18px; }
  .kpi-num { font-size: 15px; }
  .kpi-row { gap: 6px; }
  .kpi { padding: 10px; }
}

/* TAB PANELS */
.tab-panel { display: none; animation: tabFadeIn 0.25s ease; }
.tab-panel.active { display: block; }
@keyframes tabFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Donation widget ─── */
.donate-card {
  background: var(--bg-raise);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 14px 18px;
  max-width: 340px;
  margin: 10px auto;
  text-align: left;
}
.donate-card__label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.donate-card__label::before {
  content: "\25CF";
  color: var(--purple);
  font-size: 9px;
}
.donate-card__network {
  color: var(--text-3);
  font-size: 9px;
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}
.donate-card__row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-void);
  border: 1px solid var(--border-1);
  border-radius: 6px;
  padding: 8px 10px;
}
.donate-card__address {
  color: var(--purple);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  user-select: all;
}
.donate-card__copy-btn {
  background: transparent;
  border: 1px solid var(--purple-border);
  color: var(--purple);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.donate-card__copy-btn:hover {
  background: var(--purple-dim);
  color: #fff;
}
.donate-card__copy-btn.copied {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}
.donate-card__note {
  color: var(--text-3);
  font-size: 9px;
  margin-top: 8px;
  text-align: center;
  letter-spacing: 0.03em;
}
</style>

const urlParams = new URLSearchParams(window.location.search);
let currentUser = urlParams.get('user') || localStorage.getItem('sfc_username');
if (!currentUser && !window.__EMBEDDED_DATA) {
  // Only redirect to login if not in embedded/static mode
  window.location.href = '/login.html';
}
if (currentUser) {
  localStorage.setItem('sfc_username', currentUser);
}

// Fungsi untuk mengambil state dari KV
async function loadUserState() {
  if (!currentUser) return null;
  try {
    const res = await fetch('/user/' + encodeURIComponent(currentUser) + '/state', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const state = await res.json();
    if (paperTrader) {
      paperTrader.capital = state.capital || paperTrader.capital;
      paperTrader.initial = state.initial_capital || paperTrader.initial;
      paperTrader.peakCapital = state.peak_capital || paperTrader.peakCapital;
      paperTrader.positions = state.positions || [];
      paperTrader.trades = state.trades || [];
      paperTrader.equityHistory = state.equity_history || [];
      paperTrader.dailySnapshots = state.daily_snapshots || {};
      paperTrader.userConfig = state.config || {};
      paperTrader.status = (state.positions || []).length > 0 ? 'IN_MARKET' : 'IDLE';
      paperTrader._initialized = true;
      paperTrader._serverStateLoaded = true;
      paperTrader._serverStateLogged = false;
      addPaperLog('👤 Loaded state for ' + currentUser);
      updatePaperDisplay();
    }
    return state;
  } catch (e) {
    console.warn('Multi-user load failed', e);
    return null;
  }
}

// Fungsi untuk menyimpan state ke KV
async function saveUserState() {
  if (!currentUser || !paperTrader) return;
  const pt = paperTrader;
  const state = {
    user_id: currentUser,
    capital: pt.capital,
    initial_capital: pt.initial,
    peak_capital: pt.peakCapital || pt.capital,
    positions: pt.positions,
    trades: (pt.trades || []).slice(-500),
    equity_history: (pt.equityHistory || []).slice(-1000),
    daily_snapshots: pt.dailySnapshots || {},
    config: pt.userConfig || {},
    last_update: new Date().toISOString(),
  };
  try {
    const res = await fetch('/user/' + encodeURIComponent(currentUser) + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state),
    });
    // Silent fail — no need to bother user
  } catch (e) { /* offline — will retry next tick */ }
}

// Fungsi untuk menyimpan konfigurasi
async function saveUserConfig() {
  if (!currentUser || !paperTrader) return;
  const newModal = parseFloat(document.getElementById('userModal')?.value) || 50000;
  const config = {
    modal: newModal,
    max_allocation_pct: parseFloat(document.getElementById('userMaxAlloc')?.value) || 25,
    take_profit_pct: parseFloat(document.getElementById('userTP')?.value) || 0,
    trailing_stop_pct: parseFloat(document.getElementById('userTrail')?.value) || 15,
    // NOTE: previously used `parseFloat(...) || 8` here, but that has a
    // classic JS falsy-zero bug — if the user deliberately types 0 to
    // disable stop-loss, `0 || 8` evaluates to 8 (0 is falsy in JS),
    // silently overriding their explicit choice. isNaN() check
    // distinguishes "field genuinely empty/invalid" (→ default 8) from
    // "user explicitly set 0" (→ respect that as 0/disabled).
    stop_loss_pct: (() => {
      const v = parseFloat(document.getElementById('userSL')?.value);
      return isNaN(v) ? 8 : v;
    })(),
    risk_per_trade: parseFloat(document.getElementById('userRisk')?.value) || 2,
  };
  paperTrader.userConfig = { ...(paperTrader.userConfig || {}), ...config };

  // If modal changed, reset paper trader with new capital
  if (newModal !== paperTrader.initial) {
    paperTrader = new PaperTrader(newModal);
    paperTrader.userConfig = config;
    updatePaperDisplay();
    addPaperLog('🔄 Capital reset to $' + fmtNum(newModal, 0) + ' — old history cleared');
  }

  await saveUserState();
  addPaperLog('⚙️ Strategy saved: $' + fmtNum(newModal, 0) + ' · TP ' + config.take_profit_pct + '% · SL ' + config.stop_loss_pct + '% · Trail ' + config.trailing_stop_pct + '%');
}

// Load config from state into form fields
function loadConfigToForm(config) {
  if (!config) return;
  const setVal = (id, val) => {

function fmtNum(n, d2) {
  if (n === null || n === undefined) return '—';
  if (typeof n === 'number') return d2 === 0 ? n.toLocaleString('en-US') : n.toLocaleString('en-US', { minimumFractionDigits: d2, maximumFractionDigits: d2 });
  return n;
}

/* ── COUNT-UP NUMBER ANIMATION ──
   Animates an element's displayed number from its previous value to a new one.
   formatFn(value) -> string, used to render each animation frame.
   Skips animation on first run (no prior value stored) to avoid counting up from 0 on initial render. */
const _animFrames = new WeakMap();
function animateNumber(el, newValue, formatFn, opts) {
  if (!el || typeof newValue !== 'number' || isNaN(newValue)) return;
  opts = opts || {};
  const duration = opts.duration || 600;
  const prevValue = el.dataset.rawValue !== undefined ? parseFloat(el.dataset.rawValue) : null;
  el.dataset.rawValue = newValue;

  if (prevValue === null || isNaN(prevValue)) {
    // First render — set immediately, no animation
    el.textContent = formatFn(newValue);
    return;
  }
  if (prevValue === newValue) return;

  // Cancel any in-flight animation on this element
  const existing = _animFrames.get(el);
  if (existing) cancelAnimationFrame(existing);

  const start = performance.now();
  const delta = newValue - prevValue;

  function frame(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    const current = prevValue + delta * eased;
    el.textContent = formatFn(current);
    if (t < 1) {
      _animFrames.set(el, requestAnimationFrame(frame));
    } else {
      el.textContent = formatFn(newValue);
      _animFrames.delete(el);
    }
  }
  _animFrames.set(el, requestAnimationFrame(frame));

  // Pulse the parent card/kpi to draw attention to the change
  const pulseTarget = el.closest('.kpi, .card');
  if (pulseTarget) {
    pulseTarget.classList.remove('pulse-update');
    void pulseTarget.offsetWidth; // restart animation if already applied
    pulseTarget.classList.add('pulse-update');
    setTimeout(() => pulseTarget.classList.remove('pulse-update'), 900);
  }
}

let historyPoints = [];

}
function pushHistory(btc, floor, extra) {
  // Skip exact duplicates (same btc + same floor as last point)
  const last = historyPoints[historyPoints.length - 1];
  if (last && last.btc === btc && last.floor === floor) return;
  const point = { t: Date.now(), btc, floor };
  if (extra) Object.assign(point, extra);
  historyPoints.push(point);
  if (historyPoints.length > 200) historyPoints = historyPoints.slice(-200);
  try { sessionStorage.setItem('sfc_history', JSON.stringify(historyPoints)); } catch(e) {}
}

/* ── SPARKLINE SVG GENERATOR ──
   Renders a tiny inline SVG line+area chart from an array of numbers.
   No dependencies — pure SVG string, safe to inject via innerHTML. */
function sparklineSVG(values, opts) {
  opts = opts || {};
  const w = opts.width || 100, h = opts.height || 28;
  const color = opts.color || '#00d4ff';
  const vals = (values || []).filter(v => typeof v === 'number' && !isNaN(v));
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pad = 2;
  const stepX = (w - pad * 2) / (vals.length - 1);
  const pts = vals.map((v, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - (v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const lastPt = pts[pts.length - 1];
  const gid = 'sg' + Math.random().toString(36).slice(2,8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="sparkline" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

let newsSlideIndex = 0;

function startNewsSlide() {
  clearInterval(newsSlideTimer);
  const items = document.querySelectorAll('.news-item');
  const dots  = document.querySelectorAll('.news-dot');
  if (!items.length) return;
  function showSlide(i) {
    items.forEach((el, idx) => {
      el.classList.remove('active','exit');
      if (idx === i) el.classList.add('active');
      else if (idx === (i - 1 + items.length) % items.length) el.classList.add('exit');
    });
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    newsSlideIndex = i;
  }
  showSlide(0);
  newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000);
  dots.forEach((d, i) => d.addEventListener('click', () => { clearInterval(newsSlideTimer); showSlide(i); newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000); }));
}

/* ── RENDER ── */
function render(d) {
  const prevData = currentData; // snapshot before overwrite, used for count-up baselines
  currentData = d;
  const sfcEff  = d.sfc_effective || 0;
  const btcChg  = d.btc_24h || 0;
  const agree   = d.method_agreement || 0;
  const conf    = d.composite_confidence || 0.5;
  const rsi     = d.rsi_14 || 50;
  const signal  = d.signal || 'Standard allocation';
  const state   = d.state || 'NORMAL OSCILLATION';

  // Compute ADV regime label with condition context
  const isExtremeFear = (d.fng||50) < 15;
  const hasCascade = (d.cascade_risk||0) > 0.5;
  const advRegime = d.adv_regime || 'BULL';
  let advLabel = advRegime;
  let advDotColor = (advRegime === 'BEAR' || advRegime === 'CRISIS' || advRegime === 'CAPITULATION') ? 'dot-r' : 'dot-g';
  if (isExtremeFear && advRegime === 'BULL') {
    advLabel = 'BULL (CAUTIOUS)';
    advDotColor = 'dot-a';
  } else if (hasCascade && advRegime === 'BULL') {
    advLabel = 'BULL (CASCADE)';
    advDotColor = 'dot-r';
  }
  // Pill reason subtitle
  let pillReason = '';
  if ((d.kelly_fraction||0) <= 0) {
    if (d.kelly_override_reason === 'TRANSITION_RISK_OVER_60') pillReason = 'Transition Risk >60% · Forced CASH';
    else if (isExtremeFear) pillReason = 'FNG ' + d.fng + ' · ' + (d.fng_cls||'EXTREME FEAR');
    else if (hasCascade) pillReason = 'Cascade Risk ' + ((d.cascade_risk||0)*100).toFixed(0) + '%';
    else pillReason = 'No edge';
  } else {
    pillReason = 'Kelly ' + ((d.kelly_fraction||0)*100).toFixed(1) + '%';
  }

  // Determine signal class
  // Regime-aware signal thresholds (same multiplier as zone)
  const _SIG_MULT = {CRISIS: 0.6, BEAR: 0.72, BULL: 1.2, SIDEWAYS: 1.0, NORMAL: 1.0, STRESS: 0.8};
  const _sigMult = _SIG_MULT[String(d.regime).toUpperCase()] || 1.0;
  const _buyThreshold = 25 * _sigMult;
  const _cashThreshold = 50 * _sigMult;

  let sigClass = 'sp-watch';
  if ((d.kelly_fraction || 0) > 0 && sfcEff < _buyThreshold) sigClass = 'sp-buy';
  else if (sfcEff >= _cashThreshold || (d.kelly_fraction || 0) <= 0) sigClass = 'sp-cash';

  let topPillClass = 'pill-watch', topPillText = 'WATCH';
  if (sigClass === 'sp-buy')  { topPillClass = 'pill-buy';  topPillText = 'BUY'; }
  else if (sigClass === 'sp-cash') { topPillClass = 'pill-cash'; topPillText = 'CASH'; }

  const regimeColor = d.regime === 'CAPITULATION' || d.regime === 'CRISIS' ? 'var(--red)' : d.regime === 'STRESS' || d.regime === 'BEAR' ? 'var(--amber)' : 'var(--green)';

  // ── GLF contribution breakdown (NEW) ──
  // The backend's glf_component_detail already has {z_score, weight, raw}
  // per component (global_liquidity_engine.py) — this converts that into
  // the same "points contributed to the 0-100 GLF score" view suggested
  // as a dashboard improvement, computed client-side from data already
  // present rather than requiring a backend change. Formula matches
  // compute_global_liquidity_factor() exactly: glf_score = 55 + (Σ z·w /
  // total_w) × 17.5, so each component's point contribution is
  // (z·w / total_w) × 17.5 — verified by hand against a real snapshot
  // (sum of contributions + 55 reproduced the actual glf_score to within
  // rounding).
  const glfContributions = (() => {
    const detail = d.glf_component_detail;
    if (!detail || typeof detail !== 'object') return [];
    const totalW = Object.values(detail).reduce((sum, c) => sum + (c.weight || 0), 0);
    if (totalW <= 0) return [];
    const labels = { fed: 'Fed', ecb: 'ECB', jpn: 'BOJ', china: 'China', m2: 'M2', tga: 'TGA', rrp: 'RRP', dxy: 'DXY' };
    return Object.entries(detail)
      .map(([key, c]) => ({
        label: labels[key] || key.toUpperCase(),
        points: (c.z_score * c.weight / totalW) * 17.5,
      }))
      .sort((a, b) => Math.abs(b.points) - Math.abs(a.points)); // most impactful first
  })();

  // SLI and MPI already have a pre-computed "contribution" field per
  // component in the backend (stablecoin_intelligence.py /
  // market_positioning_index.py) — unlike GLF, no z_score*weight math
  // needed here, just the right SCALE FACTOR to convert that stored
  // value into "points contributed to the final 0-100 score":
  //   SLI: sli_score = 55 + sli_z*62.5, where sli_z = Σ(contribution field)
  //        → points = contribution * 62.5
  //   MPI: mpi_score = (1 - mpi_raw)*100, where mpi_raw = 0.5 + Σ(contribution field)
  //        → points = -contribution * 100  (note the sign flip — MPI's
  //        score is INVERTED relative to its raw weighted average,
  //        unlike SLI/GLF which aren't; verified against a real
  //        snapshot: contribution sum -0.06 → mpi_score 56.0 via
  //        50 - (-0.06*100), confirming the -100 factor before this was
  //        shipped, not assumed)
  const sliContributions = (() => {
    const detail = d.sli_components;
    if (!detail || typeof detail !== 'object') return [];
    const labels = { dominance: 'Dominance', exchange_flow: 'ExFlow', growth_divergence: 'GrowthDiv', reserve_ratio: 'Reserve', ssr: 'SSR', supply_growth: 'Supply', velocity: 'Velocity' };
    return Object.entries(detail)
      .map(([key, c]) => ({ label: labels[key] || key, points: (c.contribution || 0) * 62.5 }))
      .sort((a, b) => Math.abs(b.points) - Math.abs(a.points));
  })();

  const mpiContributions = (() => {
    const detail = d.mpi_components;
    if (!detail || typeof detail !== 'object') return [];
    const labels = { funding_rate: 'Funding', put_call: 'P/C', liquidation: 'Liq', basis: 'Basis', open_interest: 'OI' };
    return Object.entries(detail)
      .map(([key, c]) => ({ label: labels[key] || key, points: -(c.contribution || 0) * 100 }))
      .sort((a, b) => Math.abs(b.points) - Math.abs(a.points));
  })();

  // ── Q10 on-chain contribution breakdown (NEW) ──
  // Each of Q10's 4 composite scores (whale_pressure, onchain_value,
  // buying_power, market_structure) is a straight weighted average of
  // several sub-metric scores — formula confirmed from onchain_fetch.py:
  //   group_score = Σ(sub_score_i * weight_i) / Σweight_i
  // so each sub-metric's point contribution is simply
  // (sub_score_i * weight_i / Σweight_i) — no offset or inversion needed
  // here, unlike GLF (which has a "55 +" base) or MPI (which inverts).
  // Group membership + weights below are copied directly from
  // onchain_fetch.py's factor_groups/weights_map — if that file's
  // groupings change, this must be updated to match, or the breakdown
  // shown here will silently misrepresent what's actually driving each
  // Q10 score.
  //
  // UPDATED: exchange_netflow / stablecoin_exchange_netflow removed from
  // whale_pressure / buying_power respectively — confirmed these are
  // mathematically identical to (inflow - outflow) for the same group,
  // not independent signals (verified: stored netflow value matched
  // inflow-outflow to within floating point rounding). Remaining weights
  // renormalized — see onchain_fetch.py's own comment for the full
  // reasoning.
  const Q10_GROUPS = {
    whale_pressure: {
      metrics: ["whale_ratio", "exchange_supply_ratio", "funding_rates", "exchange_inflow_total", "exchange_outflow_total"],
      weights: [0.25, 0.1875, 0.125, 0.25, 0.1875],
      labels: { whale_ratio: "WhaleRatio", exchange_supply_ratio: "SupplyRatio", funding_rates: "Funding", exchange_inflow_total: "Inflow", exchange_outflow_total: "Outflow" },
    },
    onchain_value: {
      metrics: ["mvrv_ratio", "puell_multiple", "miners_position", "miner_netflow_total"],
      weights: [0.30, 0.25, 0.25, 0.20],
      labels: { mvrv_ratio: "MVRV", puell_multiple: "Puell", miners_position: "MinerPos", miner_netflow_total: "MinerFlow" },
    },
    buying_power: {

    <div class="tab-panel" data-tab="help">
    <div class="help-panel">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">How to Read SFC Terminal</div>
        <div style="font-size:10px;color:var(--text-3)">Complete reference for every dashboard component &mdash; all indicators, signals, and tools explained</div>
        <div class="help-grid">

          <!-- 1. NAVIGATION & LAYOUT -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--cyan)">Navigation &amp; Layout</div>
            <div class="help-body"><strong>Dashboard tabs</strong> organise the main content:<ul><li><strong>Overview</strong> — SFC gauge, factor chart, momentum, confidence, price chart</li><li><strong>Risk</strong> — liquidation, cascade, transition risk, on-chain panels</li><li><strong>Ensemble</strong> — 6-method bar chart, consensus ring, model scores</li><li><strong>Macro</strong> — liquidity intelligence, global macro &amp; stablecoin flows</li><li><strong>On-Chain</strong> — behavioral signals, ML models, XAI breakdown</li><li><strong>Trading</strong> — walk-forward backtest, paper trading simulator</li></ul>The <strong>Status Band</strong> at top shows live chips: Regime, Liquidation Pressure, SOPR Signal, RSI, DVOL, ADV, Shock alerts. The <strong>KPI Row</strong> below gives BTC price, SFC %, DVOL, Fear &amp; Greed, Confidence, and BTC Dominance.</div>
          </div>

          <!-- 2. SFC STRESS INDEX -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--cyan)">SFC Stress Index</div>
            <div class="help-body"><strong>0&ndash;100% composite stress probability.</strong> Combines 6 core methods + 22+ institutional models into a single score.<ul><li><span style="color:var(--green)">Normal</span> (0-25%) &mdash; calm, standard allocation</li><li><span style="color:var(--amber)">Elevated</span> (25-50%) &mdash; caution warranted</li><li><span style="color:var(--red)">Critical</span> (50-100%) &mdash; hedge or move to cash</li></ul>Effective SFC = Base + News Stress&Delta; + Liquidation Modifier. The arc gauge and progress bar give a quick visual read. Below the gauge, the <strong>Factor Chart</strong> breaks down stress into its underlying components (Lt/St/Rt/Ft/Sc).</div>
          </div>

          <!-- 3. 6-METHOD ENSEMBLE -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--green)">6-Method Ensemble</div>
            <div class="help-body">Six independent models, each estimating stress probability from different angles:<ul><li><strong>KLR</strong> &mdash; Kernel Logistic Regression</li><li><strong>Logit</strong> &mdash; Logistic regression z-score</li><li><strong>Bayes</strong> &mdash; Bayesian prior + multiplier</li><li><strong>EWC</strong> &mdash; Equal-Weighted Composite</li><li><strong>QREG</strong> &mdash; Quantile Regression (tail behaviour)</li><li><strong>Regime</strong> &mdash; Extreme condition detector</li></ul><strong>Consensus</strong> shows how many methods agree: &gt;60% = strong signal, &lt;30% = unreliable. The consensus ring and bar chart update in real time. Also displays active method count (M7&ndash;M31 institutional stack).</div>
          </div>

          <!-- 4. SIGNAL & ACTION PILL -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Signal &amp; Action Pill</div>
            <div class="help-body"><strong>The coloured pill in the nav bar and Signal card shows the recommended action.</strong><ul><li><span style="color:var(--green)">BUY</span> &mdash; positive edge, Kelly &gt; 0</li><li><span style="color:var(--amber)">WATCH</span> &mdash; neutral zone, no strong signal</li><li><span style="color:var(--red)">CASH</span> &mdash; Kelly &le; 0 or negative edge, stay out</li></ul>Underlying metrics: <strong>Transition Risk</strong> (&gt;50% = regime shift likely), <strong>Readiness Score</strong> (how favourable conditions are for entry/exit), and <strong>BTC vs Floor %</strong> (distance from dynamic floor &mdash; closer = safer entry zone).</div>
          </div>

          <!-- 5. BTC PRICE & DYNAMIC FLOOR -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--blue)">BTC Price &amp; Dynamic Floor</div>
            <div class="help-body"><strong>Dynamic Floor</strong> = Price &times; (1 &minus; SFC% &times; 0.6).<ul><li>0% stress: floor = price (no discount)</li><li>50% stress: floor = price &times; 0.70</li><li>Price approaching the floor signals a risk-off zone &mdash; potential buying opportunity</li></ul>The <strong>Price Chart</strong> plots BTC vs Floor over recent history. ATH and current floor values are shown in the KPI row. Toggle chart visibility with the Show/Hide button in the status band.</div>
          </div>

          <!-- 6. MOMENTUM & ON-CHAIN -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--purple)">Momentum &amp; On-Chain</div>
            <div class="help-body"><strong>RSI-14M (monthly):</strong> <span style="color:var(--green)">&lt;30</span> Oversold &middot; <span style="color:var(--text-2)">30-70</span> Neutral &middot; <span style="color:var(--red)">&gt;70</span> Overbought<br><strong>SOPR Proxy:</strong> <span style="color:var(--green)">&lt;0.97</span> Capitulation (potential bottom) &middot; <span style="color:var(--red)">&gt;1.03</span> Distribution (potential top)<br><strong>DVOL</strong> = Deribit implied volatility index.<br><strong>On-Chain panel:</strong> GARCH volatility, Value-at-Risk (VaR 95%), Expected Shortfall (ES 95%), Jump Risk probability, and Order Book Imbalance (OBI). OBI &lt; &minus;0.3 = sell pressure, &gt; +0.3 = buy pressure.</div>
          </div>

          <!-- 7. LIQUIDATION & RISK -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--red)">Liquidation &amp; Cascade Risk</div>
            <div class="help-body"><strong>Pressure direction:</strong><ul><li><span style="color:var(--red)">Long Squeeze</span> &mdash; shorts pressing longs, cascading liquidations likely</li><li><span style="color:var(--green)">Short Squeeze</span> &mdash; longs pressing shorts, sharp upside possible</li><li><span style="color:var(--amber)">Balanced</span> &mdash; no directional pressure</li></ul><strong>Cascade Risk</strong> &gt;50% = systemic liquidation chain possible. <strong>P/C OI &amp; Vol</strong> &gt;1.0 signals bearish options positioning. 24-hour liquidation volume from OKX broken into Long/Short sides.</div>
          </div>

          <!-- 8. COMPOSITE CONFIDENCE -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--green)">Composite Confidence</div>
            <div class="help-body"><strong>How much to trust the SFC signal.</strong> Base 30% with 11 components stacked:<ul><li>Method agreement (+15%), SFC health (+8%)</li><li>Penalties: cascade &gt;50% (&minus;10%), RSI extreme (&minus;8%), FNG extreme (&minus;6%), SOPR cap (&minus;5%), regime shift (&minus;5%)</li><li>Additional: low stress boost, squeeze penalty, news penalty, vol penalty, transition penalty</li></ul>Each component is shown in the Confidence card with its sign and magnitude. Below 30% = extreme caution; above 60% = high conviction.</div>
          </div>

          <!-- 9. KELLY POSITION SIZING -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Kelly Position Sizing</div>
            <div class="help-body"><strong>Translates confidence &rarr; position size.</strong><ul><li><strong>Max Allocation</strong> = full Kelly fraction (aggressive)</li><li><strong>Safe Allocation</strong> = &frac12; Kelly (conservative, reduced variance)</li><li><strong>0%</strong> = no edge, stay cash</li></ul><strong>Alert Window:</strong> ~48h advance notice before stress events. <strong>Timing Precision:</strong> HIGH or LOW based on signal consistency. Never exceed the max allocation recommendation &mdash; it is derived from the Kelly criterion for optimal long-term growth.</div>
          </div>

          <!-- 10. BACKTEST METRICS (ESTIMATED) -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--amber)">Backtest Metrics (Estimated)</div>
            <div class="help-body">⚠ <strong>These are heuristic estimates, not a walk-forward validated backtest.</strong> They're derived from current signal quality (method agreement, confidence, implied volatility) rather than a simulated trade history &mdash; see the amber warning banner on the card itself for the full caveat.<ul><li><strong>Sharpe Ratio</strong> (labeled with ~) &mdash; higher generally better, but treat as directional only</li><li><strong>Win Rate</strong> (~) &mdash; estimated proportion of favorable outcomes, not from actual trade simulation</li><li><strong>Max Drawdown</strong> &mdash; derived from implied volatility (DVOL), not observed portfolio history</li><li><strong>Stability</strong> &mdash; signal consistency proxy</li></ul>The <strong>calibration note</strong> under the numbers explicitly states these are upper-bound estimates due to limited stress events in the training window. Use these for rough directional reference, not as a substitute for real paper-trading results &mdash; the <strong>Paper Trading</strong> card below reflects actual simulated execution instead.</div>
          </div>

          <!-- 11. ADVANCED ML MODELS -->
          <div class="help-card">
            <div class="help-card-title" style="color:var(--purple)">Advanced ML Models</div>
            <div class="help-body"><strong>Five complementary ML layers that refine the SFC stress estimate.</strong><ul><li><strong>Feature Engineering (AFE)</strong> &mdash; 14 quality technical indicators computed from daily BTC klines: RSI-14, MACD, EMA crossover, Bollinger Bands width, ATR, VWAP, OBV, Chaikin Money Flow. Hovering near extremes confirms stress signals.</li><li><strong>XGBoost Meta-Ensemble</strong> &mdash; a gradient-boosted tree trained on 31 method scores from git history. It learns which methods best predict stress in different conditions and blends into the final SFC at 0-30% weight.</li><li><strong>HMM Regime Detection</strong> &mdash; Hidden Markov Model with 4 states (BULL, BEAR, SIDEWAYS, CRISIS) trained on BTC returns, DVOL, SFC, RSI, and F&G. Overrides the rule-based regime when it detects CRISIS or BEAR conditions that the rules miss.</li><li><strong>Multi-Timeframe Fusion (MTF)</strong> &mdash; fetches 1h, 4h, 1d, and 1w klines from Binance. Computes EMA cross, momentum, and RSI per timeframe. Alignment score (&minus;1 to +1) shows cross-timeframe consensus. Divergence (1h/4h vs 1d/1w) warns of conflicting trends.</li><li><strong>Online Learning (EWMA)</strong> &mdash; Exponentially Weighted Moving Average that adaptively corrects the stress estimate each cycle. Persisted between runs via models/ewma_state.json. Blends past baseline with new observations for smooth adaptation.</li></ul>All five modules are displayed in the <strong>Advanced ML Signals</strong> card on the Risk tab. Each shows its current value and availability status.</div>
          </div>

          <!-- 12. QLSTM, XAI & LEGACY ML -->

/* ── KPI ROW COUNT-UP ──
   After a full re-render, the KPI numbers are already painted with the new value.
   This rewinds each tracked KPI to its previous value then animates up to the new one,
   skipping entirely on first load (prevData is null). */
function animateKpiRow(prevData, d) {
  if (!prevData) return; // first render — no baseline, leave static
  const sfcEffNew = d.sfc_effective || 0;
  const sfcEffOld = prevData.sfc_effective || 0;
  const confNew = (d.composite_confidence ?? 0.5) * 100;
  const confOld = (prevData.composite_confidence ?? 0.5) * 100;

  const targets = [
    { sel: '#btcPriceKpi', from: prevData.btc, to: d.btc, fmt: v => '$' + fmtNum(v) },
    { sel: '.kpi-row .kpi:nth-child(2) .kpi-num', from: sfcEffOld, to: sfcEffNew, fmt: v => v.toFixed(1) + '%' },
    { sel: '.kpi-row .kpi:nth-child(3) .kpi-num', from: prevData.dvol, to: d.dvol, fmt: v => fmtNum(v,1) + '%' },
    { sel: '.kpi-row .kpi:nth-child(4) .kpi-num', from: prevData.fng, to: d.fng, fmt: v => Math.round(v).toString() },
    { sel: '.kpi-row .kpi:nth-child(5) .kpi-num', from: confOld, to: confNew, fmt: v => Math.round(v) + '%' },
    { sel: '.kpi-row .kpi:nth-child(6) .kpi-num', from: prevData.dom, to: d.dom, fmt: v => fmtNum(v,1) + '%' },
  ];
  targets.forEach(t => {
    const el = document.querySelector(t.sel);
    if (!el || typeof t.to !== 'number' || isNaN(t.to)) return;
    if (typeof t.from === 'number' && !isNaN(t.from)) {
      el.dataset.rawValue = t.from; // seed baseline so animateNumber animates instead of snapping
    }
    animateNumber(el, t.to, t.fmt);
  });
}

/* ── SSE CONNECTION ── */
let sseSource = null;
let sseReconnectTimer = null;

function startSSE() {
  // Close existing connection if any
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  if (sseReconnectTimer) {
    clearTimeout(sseReconnectTimer);
    sseReconnectTimer = null;
  }

  try {
    sseSource = new EventSource('/events');

    sseSource.addEventListener('btc_ticker', function(e) {
      try {
        const data = JSON.parse(e.data);
        partialUpdate(data);
      } catch (err) {
        console.log('[SSE] btc_ticker parse error:', err);
      }
    });

    sseSource.addEventListener('sfc_update', function(e) {
      try {
        const data = JSON.parse(e.data);
        if (data.btc != null || data.sfc_effective != null) {
          // Merge BTC ticker data from btc_ticker event into sfc data
          // to avoid stale BTC in the full render
          if (currentData) {
            Object.assign(data, { btc: data.btc || currentData.btc });
          }
          currentData = data;
          render(data);
          startNewsSlide();
          // Restore config panel after SSE render
          if (paperTrader) {
            loadConfigToForm(paperTrader.userConfig || {});
            updatePaperDisplay();
          }
        }
      } catch (err) {
        console.log('[SSE] sfc_update parse error:', err);
      }
    });

    sseSource.onerror = function() {
      console.log('[SSE] Connection lost — will retry');
      if (sseSource) {
        sseSource.close();
        sseSource = null;
      }
      // Reconnect after 5s
      sseReconnectTimer = setTimeout(startSSE, 5000);
    };
  } catch (e) {
    console.log('[SSE] Failed to create EventSource:', e);
    // Fallback: start polling after a delay
    sseReconnectTimer = setTimeout(startSSE, 10000);
  }
}
