<!DOCTYPE html>
<!-- b=1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com;">
<title>SFC Terminal | Quantitative Stress Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   SFC TERMINAL v4 — Redesigned Design System
   Dark-mode, Linear-inspired precision with crypto-accent purple
══════════════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void:      #07080d;
  --bg-base:      #0b0d15;
  --bg-card:      #0e111a;
  --bg-raise:     #131723;
  --bg-float:     #1a1f2e;
  --bg-hover:     #1f2436;

  --border-0:    rgba(255,255,255,0.03);
  --border-1:    rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.09);
  --border-3:    rgba(255,255,255,0.14);

  --text-1: #edf1f7;
  --text-2: #8892a8;
  --text-3: #49536b;
  --text-4: #2a3347;

  --purple:   #7864ff;
  --purple2:  #5d4ae0;
  --purple-dim: rgba(120,100,255,0.12);
  --purple-glow: rgba(120,100,255,0.2);
  --purple-border: rgba(120,100,255,0.3);

  --cyan:     #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.1);
  --green:    #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --red:      #ff4060;
  --red-dim:   rgba(255,64,96,0.1);
  --amber:    #f0b429;
  --amber-dim: rgba(240,180,41,0.1);
  --blue:     #4a9eff;
  --blue-dim:  rgba(74,158,255,0.1);

  --grad-purple:  linear-gradient(135deg,#7864ff,#5d4ae0);
  --grad-cyan:    linear-gradient(135deg,#00d4ff,#0099e6);
  --grad-green:   linear-gradient(135deg,#00f5a0,#00c87b);
  --grad-red:     linear-gradient(135deg,#ff4060,#cc1a35);
  --grad-amber:   linear-gradient(135deg,#f0b429,#d48a00);

  --glow-purple: 0 0 30px rgba(120,100,255,0.15);
  --glow-cyan:   0 0 30px rgba(0,212,255,0.12);
  --glow-green:  0 0 30px rgba(0,245,160,0.12);
  --glow-red:    0 0 30px rgba(255,64,96,0.12);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --nav-h: 52px;
  --band-h: 36px;
}

html { height: 100%; }

body {
  background: var(--bg-void);
  color: var(--text-1);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ══════════════════════════════════════════
   LOADING SCREEN
══════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
.loading-logo {
  width: 56px; height: 56px;
  border-radius: var(--r-md);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.loading-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border-2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.shell { display: flex; flex-direction: column; min-height: 100vh; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: var(--nav-h);
  background: rgba(7,8,13,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-1);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: var(--grad-purple);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 10px;
  color: #fff;
  box-shadow: var(--glow-purple);
}
.nav-wordmark { display: flex; flex-direction: column; }
.nav-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}
.nav-title span { color: var(--purple); }
.nav-sub {
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 1px;
}

.nav-center {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255,255,255,0.03);
  padding: 2px;
  border-radius: 8px;
}
.nav-tab {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text-1); background: rgba(255,255,255,0.04); }
.nav-tab.active { color: #fff; background: var(--purple-dim); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-meta { display: flex; flex-direction: column; align-items: flex-end; }
.nav-meta-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}
.nav-meta-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-1);
}
.nav-pill {
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.pill-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.pill-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--border-red); }

/* ══════════════════════════════════════════
   STATUS BAND
══════════════════════════════════════════ */
.status-band {
  display: flex;
  gap: 6px;
  padding: 6px 24px;
  height: var(--band-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-1);
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.status-band::-webkit-scrollbar { display: none; }
.s-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid var(--border-1);
  background: var(--bg-card);
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}
.s-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
}
.dot-g { background: var(--green); box-shadow: 0 0 5px rgba(0,245,160,0.5); }
.dot-r { background: var(--red);   box-shadow: 0 0 5px rgba(255,64,96,0.5); }
.dot-a { background: var(--amber); box-shadow: 0 0 5px rgba(240,180,41,0.5); }
.dot-b { background: var(--blue);  box-shadow: 0 0 5px rgba(74,158,255,0.5); }
.dot-c { background: var(--cyan);  box-shadow: 0 0 5px rgba(0,212,255,0.5); }
.dot-p { background: var(--purple);box-shadow: 0 0 5px rgba(120,100,255,0.5); }

/* ══════════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════════ */
.main {
  padding: 20px 24px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* Section heading bar */
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.section-head-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-2), transparent);
}
.section-head-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
}

/* ══════════════════════════════════════════
   KPI ROW
══════════════════════════════════════════ */
.kpi-row {
  display: grid;
  grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.kpi:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

.kpi-hero {
  border-color: var(--purple-border);
  background: linear-gradient(135deg, rgba(120,100,255,0.06) 0%, var(--bg-card) 100%);
}
.kpi-hero:hover {
  border-color: rgba(120,100,255,0.4);
  box-shadow: var(--glow-purple);
}

/* Gradient top accent for all KPIs */
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 2px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  opacity: 0.6;
}
.kpi-hero::before { background: var(--grad-purple); }

.kpi-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.kpi-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 3px;
}
.kpi-hero .kpi-num { font-size: 32px; }
.kpi-aux {
  font-size: 9px;
  font-weight: 500;
  color: var(--text-2);
}
.kpi-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 3px;
}
.kb-g { background: var(--green-dim); color: var(--green); }
.kb-r { background: var(--red-dim); color: var(--red); }
.kb-a { background: var(--amber-dim); color: var(--amber); }

.chg-p { color: var(--green); }
.chg-n { color: var(--red); }
.chg-z { color: var(--text-2); }

/* ══════════════════════════════════════════
   GRID LAYOUTS
══════════════════════════════════════════ */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.span-full { grid-column: 1 / -1; }

/* ══════════════════════════════════════════
   CARD
══════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.card:hover {
  border-color: var(--border-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.015);
}

/* Gradient top accent bar for all cards */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 1px; right: 1px;
  height: 1.5px;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: linear-gradient(90deg, transparent, rgba(120,100,255,0.2), transparent);
  opacity: 0.4;
  z-index: 1;
}

.card-head {
  padding: 12px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-1);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-2);
}
.card-icon {
  width: 20px; height: 20px;
  border-radius: 5px;
  background: var(--bg-raise);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { display: block; }
.card-badge {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
}
.card-body { padding: 18px; }
.card-body-sm { padding: 12px 18px; }

/* ══════════════════════════════════════════
   SFC STRESS HERO (Arc Gauge)
══════════════════════════════════════════ */
.sfc-hero-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 18px;
}
.sfc-arc-container {
  position: relative;
  width: 170px;
  height: 95px;
  margin-bottom: 6px;
}
.sfc-arc-container svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sfc-big-num {
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}
.sfc-desc {
  font-size: 9px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.sfc-zone-pill {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}
.zone-normal   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.zone-elevated { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.zone-critical { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }

/* Progress bar */
.prog-track {
  height: 3px;
  background: var(--bg-raise);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
}
.prog-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.pf-green  { background: var(--grad-green); }
.pf-red    { background: var(--grad-red); }
.pf-amber  { background: var(--grad-amber); }
.pf-cyan   { background: var(--grad-cyan); }
.pf-purple { background: var(--grad-purple); }

/* ══════════════════════════════════════════
   METHOD ENSEMBLE GRID
══════════════════════════════════════════ */
.method-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 12px;
}
.method-cell {
  background: var(--bg-raise);
  border-radius: var(--r-sm);
  padding: 7px 5px;
  text-align: center;
  border: 1px solid var(--border-1);
  transition: border-color 0.15s;
}
.method-cell:hover { border-color: var(--border-2); }
.method-cell-name {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.method-cell-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
}

/* ══════════════════════════════════════════
   CONSENSUS
══════════════════════════════════════════ */
.consensus-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 0;
  border-top: 1px solid var(--border-1);
  margin-top: 6px;
}
.consensus-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.consensus-info { flex: 1; }
.consensus-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 1px;
}
.consensus-sub {
  font-size: 8px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ══════════════════════════════════════════
   CHART
══════════════════════════════════════════ */
.chart-shell {
  position: relative;
  border-radius: var(--r-md);
  padding: 3px;
  background: linear-gradient(135deg, rgba(120,100,255,0.04) 0%, transparent 60%);
  overflow: hidden;
}
.chart-shell canvas {
  display: block;
  width: 100% !important;
  max-height: 220px;
}

/* ══════════════════════════════════════════
   INFO TABLE ROWS
══════════════════════════════════════════ */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
  font-size: 11px;
}
.info-row:last-child { border-bottom: none; }
.info-k {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 500;
}
.info-v {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 11px;
}

/* ══════════════════════════════════════════
   GAUGE RINGS
══════════════════════════════════════════ */
.gauge-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 4px;
}
.gauge-wrap svg { width: 100%; height: 100%; }
.gauge-center-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 16px;
}
.metric-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: center;
  margin-bottom: 6px;
}
.sopr-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 6px 0 3px;
}
.dual-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.metric-center { text-align: center; padding: 4px; }

/* ══════════════════════════════════════════
   SIGNAL BLOCK
══════════════════════════════════════════ */
.signal-pill {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sp-buy   { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.25); }
.sp-watch { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sp-cash  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.2); }


/* ── NEWS TICKER ── */
.news-wrap {
  margin-bottom: 14px;
  position: relative;
}
.news-viewport {
  height: 52px;
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  position: relative;
}
.news-viewport::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, transparent 0%, var(--bg-card) 100%);
  pointer-events: none;
  z-index: 1;
}
.news-track { position: relative; height: 100%; }
}
.news-track { position: relative; height: 100%; }
.news-item {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 10px;
  color: var(--text-2);
  opacity: 0;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  will-change: transform, opacity;
  line-height: 1.5;
}
.news-item::before {
  content: '';
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--purple);
  flex-shrink: 0;
  margin-right: 8px;
}
.news-item.active  { opacity: 1; transform: translateY(0); }
.news-item.exit    { opacity: 0; transform: translateY(-100%); }
.news-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
}
.news-dot {
  height: 2px;
  width: 10px;
  border-radius: 2px;
  background: var(--text-4);
  cursor: pointer;
  transition: background 0.2s, width 0.2s;
}
.news-dot.active { background: var(--purple); width: 18px; }

/* ══════════════════════════════════════════
   KELLY / BACKTEST PANELS
══════════════════════════════════════════ */
.stat-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat-box {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.stat-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}
.stat-note {
  font-size: 8px;
  color: var(--text-3);
  margin-top: 3px;
}

.stat-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

/* ══════════════════════════════════════════
   XAI FEATURES
══════════════════════════════════════════ */
.xai-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-1);
}
.xai-bar-row:last-child { border-bottom: none; }
.xai-name {
  font-size: 10px;
  font-weight: 600;
  width: 100px;
  flex-shrink: 0;
  color: var(--text-1);
}
.xai-track {
  flex: 1;
  height: 5px;
  background: var(--bg-raise);
  border-radius: 5px;
  overflow: hidden;
}
.xai-fill { height: 100%; border-radius: 5px; }
.xai-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.xai-dir {
  font-size: 10px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.xai-note {
  padding: 6px 10px;
  background: rgba(120,100,255,0.04);
  border-left: 2px solid var(--purple);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
  margin-top: 10px;
}

/* ══════════════════════════════════════════
   PAPER TRADING
══════════════════════════════════════════ */
.paper-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 12px 18px;
}
.paper-stat {
  background: var(--bg-raise);
  border-radius: var(--r-md);
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--border-1);
}
.paper-stat-label {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 3px;
}
.paper-stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}
.paper-log {
  background: rgba(0,0,0,0.3);
  border-radius: var(--r-md);
  margin: 0 18px 10px;
  padding: 8px 10px;
  height: 100px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  line-height: 1.6;
  color: var(--text-2);
  border: 1px solid var(--border-1);
}
.paper-log div {
  padding: 1px 0;
  border-bottom: 1px solid rgba(255,255,255,0.015);
}
.paper-controls {
  display: flex;
  gap: 6px;
  padding: 0 18px 12px;
}
.paper-btn {
  padding: 5px 12px;
  border-radius: var(--r-sm);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Space Grotesk', sans-serif;
  border: none;
}
.pb-green {
  background: var(--green-dim);
  border: 1px solid rgba(0,245,160,0.2);
  color: var(--green);
}
.pb-green:hover { background: var(--green); color: #07080d; }
.pb-red {
  background: var(--red-dim);
  border: 1px solid rgba(255,64,96,0.2);
  color: var(--red);
}
.pb-red:hover { background: var(--red); color: #07080d; }

.paper-collapse {
  cursor: pointer;
  padding: 2px 0;
  font-size: 8px;
  color: var(--text-3);
  text-align: center;
  user-select: none;
}
.paper-collapse:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   HELP PANEL
══════════════════════════════════════════ */
.help-panel {
  margin-top: 12px;
  background: var(--bg-base);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  padding: 18px;
}
.help-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.help-card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 12px;
}
.help-card-full { grid-column: 1 / -1; }
.help-card-title {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 6px;
}
.help-body {
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}
.help-body ul, .help-body ol { margin: 3px 0; padding-left: 12px; }
.help-body li { margin-bottom: 1px; }
.help-body code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  background: var(--purple-dim);
  padding: 1px 4px;
  border-radius: 2px;
  color: var(--purple);
}
.help-body strong { color: var(--text-1); font-weight: 600; }

/* ══════════════════════════════════════════
   SECURITY CHIPS
══════════════════════════════════════════ */
.sec-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sc-critical { background: rgba(255,64,96,0.12); color: var(--red); border: 1px solid rgba(255,64,96,0.2); }
.sc-high     { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,180,41,0.2); }
.sc-safe     { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.sec-event-text {
  margin-top: 6px;
  padding: 6px 10px;
  background: rgba(255,64,96,0.03);
  border-left: 2px solid var(--red);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 9px;
  color: var(--text-2);
  line-height: 1.6;
}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border-1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--text-3);
  flex-wrap: wrap;
  gap: 6px;
}
.footer-links { display: flex; gap: 12px; }
.footer-link {
  cursor: pointer;
  transition: color 0.2s;
  font-weight: 500;
}
.footer-link:hover { color: var(--text-2); }

/* ══════════════════════════════════════════
   CALIBRATION NOTE
══════════════════════════════════════════ */
.calib-note {
  padding: 6px 8px;
  background: var(--amber-dim);
  border-left: 2px solid var(--amber);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 8px;
  color: var(--text-2);
  margin-top: 8px;
}

══════════════════════════════════════════ */
.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }

.text-center { text-align: center; }
.mono { font-family: 'JetBrains Mono', monospace; }
.text-sm { font-size: 9px; color: var(--text-3); }
.text-xs { font-size: 8px; color: var(--text-3); }

  btcGrad.addColorStop(0, 'rgba(0,212,255,0.2)');

  btcGrad.addColorStop(1, 'rgba(0,212,255,0.0)');

  priceChart = new Chart(canvas.getContext('2d'), {

/* ── HISTORY ── */
let historyPoints = [];
function loadHistory() {
  try { const s = sessionStorage.getItem('sfc_history'); if (s) historyPoints = JSON.parse(s); } catch(e) {}
}
function pushHistory(btc, floor) {
  // Skip exact duplicates (same btc + same floor as last point)
  const last = historyPoints[historyPoints.length - 1];
  if (last && last.btc === btc && last.floor === floor) return;
  historyPoints.push({ t: Date.now(), btc, floor });
  if (historyPoints.length > 200) historyPoints = historyPoints.slice(-200);
  try { sessionStorage.setItem('sfc_history', JSON.stringify(historyPoints)); } catch(e) {}
}

/* ── NEWS SLIDESHOW ── */
let newsSlideIndex = 0;
let newsSlideTimer = null;
function startNewsSlide() {
  clearInterval(newsSlideTimer);
  const items = document.querySelectorAll('.news-item');
  const dots  = document.querySelectorAll('.news-dot');
  if (!items.length) return;
  function showSlide(i) {
    items.forEach((el, idx) => {
      el.classList.remove('active','exit');
      if (idx === i) el.classList.add('active');
      else if (idx === (i - 1 + items.length) % items.length) el.classList.add('exit');
    });
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    newsSlideIndex = i;
  }
  showSlide(0);
  newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000);
  dots.forEach((d, i) => d.addEventListener('click', () => { clearInterval(newsSlideTimer); showSlide(i); newsSlideTimer = setInterval(() => showSlide((newsSlideIndex + 1) % items.length), 5000); }));
}

          <div class="method-grid">

              ['KLR',   '#00ff9d', fmtNum(d.m1_klr??d.sfc_base*0.9,1)+'%'],

              ['BAYES', '#9d7af8', fmtNum(d.m3_bayes,1)+'%'],
              ['EWC',   '#f0b429', fmtNum(d.m4_ewc,1)+'%'],
              ['QREG',  '#4a9eff', fmtNum(d.m5_qreg,1)+'%'],

              <div class="consensus-label">Method Consensus — ${agree>0.6?'Strong':agree>0.3?'Moderate':'Low'}</div>
              <div class="consensus-sub">${d.total_methods_active||28} active methods · ${d.inst_methods_active||12} institutional</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PRICE CHART -->
    <div class="card span-full mb-16" id="chartCardWrapper">
      <div class="card-head">
        <div class="card-title">
          <div class="card-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <polyline points="1,9 4,5 7,7 11,2" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      </div>
      <div class="card-body" id="chartContainer" style="display:${chartVisible?'block':'none'}">
        <div class="chart-shell">
          <canvas id="priceChart" width="900" height="240" style="width:100%;height:200px;max-height:240px"></canvas>
        </div>
      </div>
    </div>

    <!-- ROW 2: Momentum, Liquidation, Confidence, Signal -->
    <div id="riskSection" class="grid-4 mb-16">

      <!-- MOMENTUM -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <div class="card-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="6" r="4.5" stroke="#9d7af8" stroke-width="1.2" fill="none"/>
                <path d="M6 3v3.5" stroke="#9d7af8" stroke-width="1.4" stroke-linecap="round"/>
                <circle cx="6" cy="8" r="0.8" fill="#9d7af8"/>

            </div>
            Momentum
          </div>
        </div>
        <div class="card-body-sm">
          <div class="dual-cols">
            <div class="metric-center">
              <div class="metric-label">RSI-14</div>

                  <circle cx="44" cy="44" r="38" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="7"/>

            </div>
            <div class="metric-center">
              <div class="metric-label">SOPR Proxy</div>
              <div class="sopr-num" style="color:${(d.sopr_proxy||1)<0.97?'var(--green)':(d.sopr_proxy||1)>1.03?'var(--red)':'var(--amber)'}">${fmtNum(d.sopr_proxy,4)}</div>
              <div class="text-xs text-center mb-4">${(d.sopr_signal||'—').replace(/_/g,' ')}</div>
              <div class="prog-track">
                <div class="prog-fill pf-amber" style="width:${((d.sopr_score||0.5)*100).toFixed(0)}%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- LIQUIDATION -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <div class="card-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M6 1L8 5H11L8.5 7.5L9.5 11L6 9L2.5 11L3.5 7.5L1 5H4L6 1Z" stroke="#ff4060" stroke-width="1.2" stroke-linejoin="round" fill="rgba(255,64,96,0.15)"/>
              </svg>
            </div>
            Liquidation
          </div>
        </div>
        <div class="card-body-sm">
          <div class="info-row"><span class="info-k">Pressure</span><span class="info-v" style="color:${liqColor}">${liqLabel}</span></div>
          <div class="info-row"><span class="info-k">Density</span><span class="info-v">${fmtNum((d.liq_density||0)*100,1)}%</span></div>
          <div class="prog-track"><div class="prog-fill pf-red" style="width:${(d.liq_density||0)*100}%"></div></div>
          <div class="info-row"><span class="info-k">Cascade Risk</span><span class="info-v" style="color:${(d.cascade_risk||0)>0.5?'var(--red)':(d.cascade_risk||0)>0.25?'var(--amber)':'var(--green)'}">${fmtNum((d.cascade_risk||0)*100,0)}%</span></div>
          ${d.liq_total_24h ? `
          <div class="info-row"><span class="info-k">24h Vol (OKX)</span><span class="info-v" style="font-size:11px">$${fmtNum(d.liq_total_24h)}</span></div>
          <div class="info-row"><span class="info-k" style="font-size:9px">Long / Short</span><span class="info-v" style="font-size:10px"><span style="color:var(--green)">$${(d.liq_long_vol/1e6).toFixed(0)}M</span><span style="color:var(--text-3)"> / </span><span style="color:var(--red)">$${(d.liq_short_vol/1e6).toFixed(0)}M</span></span></div>
          ` : ''}
          <div class="info-row"><span class="info-k">P/C OI</span><span class="info-v">${fmtNum(d.pc_oi,2)}</span></div>
          <div class="info-row"><span class="info-k">P/C Vol</span><span class="info-v">${fmtNum(d.pc_vol,2)}</span></div>
        </div>
      </div>

      <!-- CONFIDENCE -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <div class="card-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6L5 9L10 3" stroke="#00ff9d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            Confidence
          </div>
        </div>
        <div class="card-body-sm" style="text-align:center">
          <div class="gauge-wrap" style="width:80px;height:80px">
            <svg viewBox="0 0 88 88">
              <circle cx="44" cy="44" r="38" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="7"/>
              <circle cx="44" cy="44" r="38" fill="none" stroke="${confColor}" stroke-width="7"
                stroke-dasharray="${confCirc}" stroke-dashoffset="${confOff}"
                stroke-linecap="round" transform="rotate(-90 44 44)"/>
            </svg>
            <div class="gauge-center-val" style="font-size:17px;color:${confColor}">${(conf*100).toFixed(0)}%</div>
          </div>
          <div class="text-xs mb-8">Execution Confidence</div>
          ${Object.entries(d.confidence_components||{}).map(([k,v])=>`
            <div class="info-row"><span class="info-k" style="font-size:9px">${k.replace(/_/g,' ').toUpperCase()}</span><span class="info-v" style="font-size:10px;color:${v>0?'var(--green)':v<0?'var(--red)':'var(--text-2)'}">${v>0?'+':''}${(v*100).toFixed(1)}%</span></div>
          `).join('')}
          <div class="prog-track mt-4">
            <div class="prog-fill pf-cyan" style="width:${(conf*100).toFixed(0)}%"></div>
          </div>
        </div>
      </div>

      <!-- SIGNAL -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <div class="card-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="10" r="1.5" fill="#f0b429"/>
                <path d="M3 7.5C3 5.015 4.343 3 6 3s3 2.015 3 4.5" stroke="#f0b429" stroke-width="1.3" stroke-linecap="round" fill="none"/>
                <path d="M1 5C1 2.239 3.239 0 6 0s5 2.239 5 5" stroke="rgba(240,180,41,0.4)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
            Signal &amp; Action
          </div>
        </div>
        <div class="card-body-sm" style="text-align:center">
          <div style="display:inline-block;margin-bottom:4px">
            <span class="signal-pill ${sigClass}">${(d.kelly_fraction||0)<=0?'CASH':signal}</span>
          </div>
          <div style="font-size:10px;color:var(--text-3);margin-bottom:14px;line-height:1.2">${pillReason}</div>
          <div class="info-row"><span class="info-k">Action</span><span class="info-v" style="color:${(d.kelly_fraction||0)<=0?'var(--red)':sigClass==='sp-buy'?'var(--green)':sigClass==='sp-cash'?'var(--red)':'var(--amber)'}">${(d.kelly_fraction||0)<=0?'⚠ CASH':signal}</span></div>
          <div class="info-row"><span class="info-k">BTC vs Floor</span><span class="info-v" style="color:${d.btc&&d.floor_total&&d.btc<=d.floor_total*1.05?'var(--green)':'var(--amber)'}">${d.btc&&d.floor_total?((d.btc/d.floor_total-1)*100).toFixed(1)+'% above':'—'}</span></div>
          <div class="info-row"><span class="info-k">Transition Risk</span><span class="info-v" style="color:${(d.transition_risk||0)>0.5?'var(--red)':(d.transition_risk||0)>0.25?'var(--amber)':'var(--green)'}">${fmtNum((d.transition_risk||0)*100,0)}%</span></div>
          <div class="info-row"><span class="info-k">Readiness</span><span class="info-v" style="color:${(d.readiness_score||0)>=0.8?'var(--green)':(d.readiness_score||0)>=0.5?'var(--amber)':'var(--text-2)'}">${((d.readiness_score||0)*100).toFixed(0)}%</span></div>
          <div class="prog-track">
            <div class="prog-fill pf-green" style="width:${((d.readiness_score||0)*100).toFixed(0)}%"></div>
          </div>
          <div style="font-size:8px;color:var(--text-3);margin-top:6px;line-height:1.5">Floor = Price × (1 − SFC% × 0.6)</div>
        </div>
      </div>
    </div>

    <!-- KELLY + MACRO row -->
    <div class="card span-full mb-16">
      <div class="card-head">
        <div class="card-title">
          <div class="card-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <rect x="1" y="1" width="4" height="4" rx="1" stroke="#f0b429" stroke-width="1.2"/>
              <rect x="7" y="1" width="4" height="4" rx="1" stroke="#4a9eff" stroke-width="1.2"/>
              <rect x="1" y="7" width="4" height="4" rx="1" stroke="#9d7af8" stroke-width="1.2"/>
              <rect x="7" y="7" width="4" height="4" rx="1" stroke="#00ff9d" stroke-width="1.2"/>
            </svg>
          </div>
          Kelly Position Sizing
        </div>
        <div class="card-badge">Allocation Guide</div>
      </div>
      <div class="card-body">
        <div class="stat-3 mb-12">
          <div class="stat-box">
            <div class="stat-label">Signal Confidence</div>
            <div class="stat-val" style="color:${(d.kelly_p_win||0)>0.6?'var(--green)':'var(--amber)'}">${((d.kelly_p_win||0.5)*100).toFixed(0)}%</div>
            <div class="stat-note">Bayesian signal trust</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Max Allocation</div>
            <div class="stat-val" style="color:${(d.kelly_fraction||0)>0.3?'var(--amber)':(d.kelly_fraction||0)>0?'var(--green)':'var(--text-3)'}">${((d.kelly_fraction||0)*100).toFixed(1)}%</div>
            <div class="stat-note">${(d.kelly_fraction||0)>0?'Optimal Kelly size':'No edge — stay cash'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Safe Allocation</div>
            <div class="stat-val" style="color:var(--green)">${((d.kelly_half||0)*100).toFixed(1)}%</div>
            <div class="stat-note">½ Kelly — reduced variance</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <div class="info-row"><span class="info-k">Alert Window</span><span class="info-v">~${d.alert_window_hours||48}h</span></div>
          <div class="info-row"><span class="info-k">Timing Precision</span><span class="info-v" style="color:${d.timing_precision==='HIGH'?'var(--green)':'var(--amber)'}">${d.timing_precision||'LOW'}</span></div>
          <div class="info-row"><span class="info-k">Signal Type</span><span class="info-v" style="color:${d.fng<15||(d.cascade_risk||0)>0.5?'var(--red)':'var(--green)'}">${d.fng<15?(d.fng_cls||'EXTREME FEAR'):(d.cascade_risk||0)>0.5?'CASCADE RISK':'NORMAL'}</span></div>
        </div>
      </div>
    </div>

    <!-- BACKTEST -->
    ${d.bt_sharpe != null ? `
    <div id="backtestSection" class="card span-full mb-16">
      <div class="card-head">
        <div class="card-title">
          <div class="card-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M1 11L4 7L7 9L11 2" stroke="#00d4ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <circle cx="4" cy="7" r="1" fill="#00d4ff"/>
              <circle cx="7" cy="9" r="1" fill="#00d4ff"/>
            </svg>
          </div>
          Walk-Forward Backtest
        </div>
        <div class="card-badge">${d.bt_label||'UPPER-BOUND'} · ${d.bt_periods||0} periods</div>
      </div>
      <div class="card-body">
        <div class="stat-4 mb-12">
          <div class="stat-box">
            <div class="stat-label">Sharpe Ratio</div>
            <div class="stat-val" style="color:${(d.bt_sharpe||0)>1.5?'var(--green)':(d.bt_sharpe||0)>0.5?'var(--amber)':'var(--red)'}">${fmtNum(d.bt_sharpe,2)}</div>
            <div class="stat-note">CI ${fmtNum(d.bt_sharpe_low,2)}–${fmtNum(d.bt_sharpe_high,2)} (95%)</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Win Rate</div>
            <div class="stat-val" style="color:var(--amber)">${((d.bt_win_rate||0)*100).toFixed(0)}%</div>
            <div class="stat-note">CI ${((d.bt_win_rate_low||0)*100).toFixed(0)}–${((d.bt_win_rate_high||0)*100).toFixed(0)}%</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Max Drawdown</div>
            <div class="stat-val" style="color:${(d.bt_max_dd||0)<0.1?'var(--green)':(d.bt_max_dd||0)<0.2?'var(--amber)':'var(--red)'}">${((d.bt_max_dd||0)*100).toFixed(1)}%</div>
            <div class="stat-note">Peak-to-trough</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Stability</div>
            <div class="stat-val" style="color:${(d.bt_stability||0)>0.7?'var(--green)':'var(--amber)'}">${((d.bt_stability||0)*100).toFixed(0)}%</div>
            <div class="stat-note">Signal consistency</div>
          </div>
        </div>
        ${d.bt_calibration_note ? `<div class="calib-note">⚠ ${d.bt_calibration_note}</div>` : ''}
      </div>
    </div>` : ''}

    <!-- XAI -->
    ${d.xai_top_features && d.xai_top_features.length ? `
    <div class="card span-full mb-16">
      <div class="card-head">
        <div class="card-title">
          <div class="card-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <circle cx="6" cy="3" r="2" stroke="#9d7af8" stroke-width="1.2"/>
              <circle cx="2" cy="9" r="1.5" stroke="#9d7af8" stroke-width="1.2"/>
              <circle cx="10" cy="9" r="1.5" stroke="#9d7af8" stroke-width="1.2"/>
              <path d="M4.5 4.5L3 7.5M7.5 4.5L9 7.5" stroke="rgba(157,122,248,0.5)" stroke-width="1"/>
            </svg>
          </div>
          QLSTM Feature Importance
        </div>
        <div class="card-badge">Permutation importance · XAI</div>
      </div>
      <div class="card-body">
        ${d.xai_top_features.map(f => {
          const barColor = f.direction === 'positive' ? 'var(--red)' : 'var(--green)';
          const dirIcon  = f.direction === 'positive' ? '↑' : f.direction === 'negative' ? '↓' : '→';
          return `
          <div class="xai-bar-row">
            <div class="xai-name">${f.name}</div>
            <div class="xai-track">
              <div class="xai-fill" style="width:${f.importance_pct}%;background:${f.direction==='positive'?'var(--red)':'var(--green)'}"></div>
            </div>
            <div class="xai-pct" style="color:${barColor}">${f.importance_pct}%</div>
            <div class="xai-dir" style="color:${barColor}">${dirIcon}</div>
          </div>`;
        }).join('')}
        <div class="xai-note">
          QLSTM hybrid SFC: <strong>${d.m32_hybrid_pred!=null?d.m32_hybrid_pred.toFixed(2)+'%':'—'}</strong>
          &nbsp;·&nbsp; ProAdapt weight: <strong>${d.m32_proadapt_weight!=null?(d.m32_proadapt_weight*100).toFixed(0)+'% QLSTM':'—'}</strong> vs ${d.m32_proadapt_weight!=null?((1-d.m32_proadapt_weight)*100).toFixed(0)+'% GARCH':'—'}.
          Features with high importance are the dominant risk drivers in the quantum model.
        </div>
      </div>
    </div>` : ''}

    <!-- PAPER TRADING -->
    <div class="card span-full mb-16" id="paperSection">
      <div class="card-head">
        <div class="card-title">
          <div class="card-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <rect x="1" y="3" width="10" height="8" rx="1.5" stroke="#00ff9d" stroke-width="1.2"/>
              <path d="M4 3V2a2 2 0 014 0v1" stroke="#00ff9d" stroke-width="1.2"/>
              <path d="M4 7h4M4 9h2" stroke="rgba(0,255,157,0.5)" stroke-width="1" stroke-linecap="round"/>
            </svg>
          </div>
          Paper Trading
          <span style="font-weight:400;color:var(--text-3);font-size:10px;text-transform:none;letter-spacing:0">— Signal-driven simulator · $10,000 starting capital</span>
        </div>
        <span id="paperStatus" style="font-size:9px;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--green-dim);color:var(--green);border:1px solid var(--border-green)">● IDLE</span>
        <span id="paperServerBadge" style="font-size:8px;font-weight:500;padding:2px 7px;border-radius:100px;background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,212,255,0.2);margin-left:6px">SERVER</span>

      <div id="paperBody" style="display:block">

          <div class="paper-stat-val" id="paperEquity">$10,000</div>
        </div>
        <div class="paper-stat">
          <div class="paper-stat-label">Return</div>
          <div class="paper-stat-val" id="paperReturn">0.0%</div>
        </div>
        <div class="paper-stat">
          <div class="paper-stat-label">Sharpe</div>
          <div class="paper-stat-val" id="paperSharpe">—</div>
        </div>
        <div class="paper-stat">
          <div class="paper-stat-label">Win Rate</div>
          <div class="paper-stat-val" id="paperWinRate">—</div>
        </div>
        <div class="paper-stat">
          <div class="paper-stat-label">Max DD</div>
          <div class="paper-stat-val" id="paperDD">—</div>
        </div>
        <div class="paper-stat">
          <div class="paper-stat-label">Trades</div>
          <div class="paper-stat-val" id="paperTradeCount">0</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;padding:0 18px 8px">
        <div style="flex:1">
          <div style="font-size:7px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:3px">Track Record</div>
          <div id="paperTrackRecord" style="font-size:8px;color:var(--text-3);line-height:1.7">Loading server track record...</div>
        </div>
        <div style="flex:0 0 auto">
          <div id="paperLastUpdate" style="font-size:7px;color:var(--text-4);text-align:right">—</div>
        </div>
      </div>
      <div class="paper-log" id="paperLog">
        <div style="color:var(--text-3)">Initializing paper trader...</div>
      </div>
      <div class="paper-controls">

        <button class="paper-btn pb-green" onclick="exportPaperTrades()">Export</button>
      </div>
      <div style="cursor:pointer;padding:2px 0;font-size:8px;color:var(--text-3);text-align:center" onclick="togglePaperSection()" id="paperToggle">&#x25b2; Hide</div>
      </div>
    </div>

    <!-- MACRO ROW -->
    <div class="grid-4 mb-16">

setInterval(function() {
  var el = document.getElementById('regimeDisplay_xyz');

/* ── SERVER PAPER TRADING TRACK RECORD ── */
async function fetchPaperTrackRecord() {
  try {
    const r = await fetch('paper_history.json?t=' + Date.now(), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const cur = data.current || {};
    const el = id => document.getElementById(id);
    const badge = el('paperServerBadge');
    if (badge) {
      badge.textContent = cur.status === 'IN_MARKET' ? '\u25cf IN MKT' : '\u25cb CASH';
      badge.style.background = cur.status === 'IN_MARKET' ? 'var(--green-dim)' : 'var(--cyan-dim)';
      badge.style.color = cur.status === 'IN_MARKET' ? 'var(--green)' : 'var(--cyan)';
    }
    if (el('paperEquity')) {
      el('paperEquity').textContent = '$' + fmtNum(Math.round(cur.equity || 10000), 0);
      el('paperEquity').style.color = (cur.total_return || 0) >= 0 ? 'var(--green)' : 'var(--red)';
    }
    if (el('paperReturn')) {
      el('paperReturn').textContent = (cur.total_return_pct || 0).toFixed(2) + '%';
      el('paperReturn').style.color = (cur.total_return_pct || 0) >= 0 ? 'var(--green)' : 'var(--red)';
    }
    if (el('paperSharpe')) el('paperSharpe').textContent = (cur.sharpe || 0).toFixed(2);
    if (el('paperSharpe')) el('paperSharpe').style.color = cur.sharpe > 1.5 ? 'var(--green)' : cur.sharpe > 0.5 ? 'var(--amber)' : 'var(--red)';
    if (el('paperWinRate')) el('paperWinRate').textContent = (cur.win_rate_pct || 0).toFixed(0) + '%';
    if (el('paperWinRate')) el('paperWinRate').style.color = (cur.win_rate_pct || 0) > 60 ? 'var(--green)' : 'var(--amber)';
    if (el('paperDD')) el('paperDD').textContent = (cur.max_dd_pct || 0).toFixed(1) + '%';
    if (el('paperDD')) el('paperDD').style.color = (cur.max_dd_pct || 0) < 10 ? 'var(--green)' : (cur.max_dd_pct || 0) < 20 ? 'var(--amber)' : 'var(--red)';
    if (el('paperTradeCount')) el('paperTradeCount').textContent = cur.total_trades || 0;

    // Track record text
    const days = data.daily ? data.daily.length : 0;
    let recordHtml = '<span style="color:var(--text-2)">Server-side paper trader</span>';
    if (data.daily && data.daily.length > 1) {
      const first = data.daily[0];
      const last = data.daily[data.daily.length - 1];
      recordHtml += '<br><span style="color:var(--text-2)">' + days + ' day' + (days>1?'s':'') + ' tracked &middot; ';
      recordHtml += 'Start: $' + fmtNum(Math.round(first.equity),0) + ' &middot; ';
      recordHtml += 'Latest: $' + fmtNum(Math.round(last.equity),0) + '</span>';
    }
    if (el('paperTrackRecord')) el('paperTrackRecord').innerHTML = recordHtml;
    if (el('paperLastUpdate')) el('paperLastUpdate').textContent = new Date().toLocaleTimeString();
    return data;
  } catch (e) {
    const el = document.getElementById('paperTrackRecord');
    if (el) el.innerHTML = '<span style="color:var(--text-3)">Server track record not available yet</span>';
    return null;
  }
}

/* ── PAPER TRADING ENGINE ── */
class PaperTrader {
  constructor(capital = 10000) {
    this.capital = capital;
    this.initial = capital;
    this.positions = [];
    this.trades = [];
    this.pnlHistory = [];
    this.status = 'IDLE';
  }
  decide(signal) {
    const { action, confidence, winProb } = signal;
    if (confidence < 15 || (winProb || 0) < 0.25) return { action: 'CASH', size: 0, reason: 'Low confidence' };
    if (action === 'CASH') return { action: 'CASH', size: 0, reason: 'Signal says cash' };
    if (action === 'HOLD') return { action: 'HOLD', size: 0, reason: 'Neutral zone — no edge' };
    const kelly = Math.max(0, Math.min(0.25, ((winProb||0.5) * 2 - (1-(winProb||0.5))) / 2));
    const size = this.capital * kelly;
    if (size < 10) return { action: 'CASH', size: 0, reason: 'Size too small' };
    return { action: action === 'BUY' ? 'LONG' : 'SHORT', size, reason: `${confidence}% conf, ${((winProb||0)*100).toFixed(0)}% win` };
  }
  execute(decision, price) {
    if (decision.size <= 0) return;
    const trade = { id: this.trades.length+1, date: new Date(), action: decision.action, size: decision.size, price, reason: decision.reason };
    this.trades.push(trade);
    this.positions.push({ type: decision.action, entryPrice: price, size: decision.size, entryDate: new Date() });
    if (decision.action === 'LONG') this.capital -= decision.size;
    else this.capital += decision.size;
    this.status = 'IN_MARKET';
    return trade;
  }
  closeAll(price) {
    for (const pos of [...this.positions]) {
      let pnl = 0;
      if (pos.type === 'LONG') { pnl = (price - pos.entryPrice) / pos.entryPrice * pos.size; this.capital += pos.size + pnl; }
      else { pnl = (pos.entryPrice - price) / pos.entryPrice * pos.size; this.capital -= pos.size - pnl; }
      this.trades.push({ ...pos, exitPrice: price, exitDate: new Date(), pnl: Math.round(pnl*100)/100 });
    }
    this.positions = [];
    this.status = 'IDLE';
  }
  updatePnL(price) {
    let unrealized = 0;
    for (const p of this.positions) {
      if (p.type === 'LONG') unrealized += (price - p.entryPrice) / p.entryPrice * p.size;
      else unrealized += (p.entryPrice - price) / p.entryPrice * p.size;
    }
    const equity = this.capital + unrealized;
    this.pnlHistory.push({ date: new Date(), equity, unrealized });
    return equity;
  }
  getPerf() {
    const equity = this.pnlHistory.length > 0 ? this.pnlHistory[this.pnlHistory.length-1].equity : this.initial;
    const totalRet = (equity - this.initial) / this.initial;
    const closed = this.trades.filter(t => t.pnl !== undefined);
    const wins   = closed.filter(t => t.pnl > 0);
    const rets   = this.pnlHistory.map(h => (h.equity - this.initial) / this.initial);
    const mean   = rets.reduce((a,b)=>a+b,0) / (rets.length||1);
    const std    = Math.sqrt(rets.map(r=>(r-mean)**2).reduce((a,b)=>a+b,0)/(rets.length||1));
    let peak = this.initial, mdd = 0;
    for (const h of this.pnlHistory) {
      if (h.equity > peak) peak = h.equity;
      mdd = Math.max(mdd, (peak-h.equity)/peak);
    }
    return { equity, totalReturn: totalRet, sharpe: std>0?mean/std*Math.sqrt(252):0, winRate: closed.length>0?wins.length/closed.length:0, maxDD: mdd, trades: this.trades.length, status: this.status };
  }
}

let paperTrader = null;

function initPaperTrading() {
  paperTrader = new PaperTrader(10000);
  try {
    const saved = localStorage.getItem('sfc_paper_trades');
    if (saved) {
      const data = JSON.parse(saved);
      paperTrader.capital = data.capital || 10000;
      paperTrader.positions = data.positions || [];
      paperTrader.trades = data.trades || [];
      paperTrader.pnlHistory = data.pnlHistory || [];
      paperTrader.status = data.status || 'IDLE';
    }
  } catch(e) {}
}

function processSignalFromSFC(d) {
  if (!paperTrader) return;
  if (paperTrader.pnlHistory.length === 0 && paperTrader.trades.length === 0) {
    updatePaperDisplay({ equity: paperTrader.capital });
    addPaperLog('🟢 Paper trading initialized with $10,000 capital');
    addPaperLog('⏳ Waiting for first trade signal from SFC...');
    return; // Don't process signal on first init call
  }
  const price   = d.btc || 60000;
  const sfc     = (d.sfc_effective || 0) / 100;
  const conf    = (d.composite_confidence || 0.3);
  const winProb = Math.min(0.9, Math.max(0.1, (1-sfc)*0.4 + conf*0.4 + 0.2));
  let action = 'CASH';
  if (sfc > 0.45) action = 'CASH';
  else if (sfc < 0.25 && conf > 0.15) action = 'BUY';
  else action = 'HOLD'; // Between 25-45% SFC — maintain existing positions
  const signal   = { action, confidence: Math.round(conf*100), winProb: Math.round(winProb*100)/100 };
  const decision = paperTrader.decide(signal);
  if (decision.action === 'CASH' && paperTrader.positions.length > 0) {
    paperTrader.closeAll(price);
    addPaperLog(`🔴 [CLOSE] All at $${fmtNum(price,0)} — signal cash`);
    const ps = document.getElementById('paperStatus');
    if (ps) ps.textContent = '● CASH';
  } else if ((decision.action === 'LONG' || decision.action === 'SHORT') && paperTrader.positions.length === 0) {
    const trade = paperTrader.execute(decision, price);
    if (trade) {
      addPaperLog(`🟢 [OPEN] ${decision.action} $${fmtNum(decision.size,0)} at $${fmtNum(price,0)} — ${decision.reason}`);
      const ps = document.getElementById('paperStatus');
      if (ps) ps.textContent = '● IN MARKET';
    }
  } else if (decision.action === 'HOLD' && paperTrader.positions.length === 0 && Math.random() < 0.05) {
    // Occasionally log that paper trader is watching but not trading
    addPaperLog(`👀 Watching — SFC ${(sfc*100).toFixed(0)}%, conf ${(conf*100).toFixed(0)}%, awaiting clear signal`);
  }
  const equity = paperTrader.updatePnL(price);
  updatePaperDisplay({ equity, price });
  try { localStorage.setItem('sfc_paper_trades', JSON.stringify({ capital: paperTrader.capital, positions: paperTrader.positions, trades: paperTrader.trades.slice(-200), pnlHistory: paperTrader.pnlHistory.slice(-500), status: paperTrader.status })); } catch(e) {}
}

function updatePaperDisplay(state) {
  if (!paperTrader) return;
  const perf = paperTrader.getPerf();
  const el = id => document.getElementById(id);
  if (!el('paperEquity')) return;
  el('paperEquity').textContent = '$' + fmtNum(Math.round(perf.equity), 0);
  el('paperEquity').style.color = perf.totalReturn >= 0 ? 'var(--green)' : 'var(--red)';
  el('paperReturn').textContent = (perf.totalReturn * 100).toFixed(1) + '%';
  el('paperReturn').style.color = perf.totalReturn >= 0 ? 'var(--green)' : 'var(--red)';
  if (perf.trades > 0) {
    el('paperSharpe').textContent = perf.sharpe.toFixed(2);
    el('paperSharpe').style.color = perf.sharpe > 1.5 ? 'var(--green)' : perf.sharpe > 0.5 ? 'var(--amber)' : 'var(--red)';
    el('paperWinRate').textContent = (perf.winRate * 100).toFixed(0) + '%';
    el('paperWinRate').style.color = perf.winRate > 0.6 ? 'var(--green)' : 'var(--amber)';
    el('paperDD').textContent = (perf.maxDD * 100).toFixed(1) + '%';
    el('paperDD').style.color = perf.maxDD < 0.1 ? 'var(--green)' : perf.maxDD < 0.2 ? 'var(--amber)' : 'var(--red)';
  }
}

function addPaperLog(msg) {
  const log = document.getElementById('paperLog');
  if (!log) return;
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
}

function resetPaperTrading() {
  paperTrader = new PaperTrader(10000);
  try { localStorage.removeItem('sfc_paper_trades'); } catch(e) {}
  const log = document.getElementById('paperLog');
  if (log) log.innerHTML = '<div>🟢 Paper trading reset to $10,000 capital</div>';
  const ps = document.getElementById('paperStatus');
  if (ps) ps.textContent = '● IDLE';
  updatePaperDisplay({ equity: 10000 });
}

function exportPaperTrades() {
  if (!paperTrader || paperTrader.trades.length === 0) { addPaperLog('⚠ No trades to export'); return; }
  const blob = new Blob([JSON.stringify(paperTrader.trades, null, 2)], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'sfc_paper_trades_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  addPaperLog('📥 Exported ' + paperTrader.trades.length + ' trades');
}

/* ── INIT ── */
loadHistory();
initPaperTrading();
fetchPaperTrackRecord();
setInterval(fetchPaperTrackRecord, 60000); // refresh track record every 60s
if (typeof __EMBEDDED_DATA !== 'undefined' && __EMBEDDED_DATA) {
  currentData = __EMBEDDED_DATA;
  render(__EMBEDDED_DATA);
  setTimeout(startNewsSlide, 100);
  setTimeout(restoreScrollPos, 200);
} else if (window.__EMBEDDED_DATA) {
  currentData = window.__EMBEDDED_DATA;
  render(window.__EMBEDDED_DATA);
  setTimeout(startNewsSlide, 100);
  setTimeout(restoreScrollPos, 200);
} else {
  fetchLiveData().then(() => setTimeout(startNewsSlide, 100));
}
setInterval(fetchLiveData, 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW failed:', e));
}
