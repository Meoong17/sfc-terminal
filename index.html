<!DOCTYPE html>
<!-- b=1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com https://sfc-terminal.meoong17.workers.dev; base-uri 'self'; form-action 'self'">
<title>SFC Terminal | Quantitative Stress Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SFC TERMINAL v4 — Redesigned Design System
   Dark-mode, Linear-inspired precision with crypto-accent purple
══════════════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-void:      #07080d;
  --bg-base:      #0b0d15;
  --bg-card:      #0e111a;
  --bg-raise:     #131723;
  --bg-float:     #1a1f2e;
  --bg-hover:     #1f2436;

  --border-0:    rgba(255,255,255,0.03);
  --border-1:    rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.09);
  --border-3:    rgba(255,255,255,0.14);

  --text-1: #edf1f7;
  --text-2: #8892a8;
  --text-3: #49536b;
  --text-4: #2a3347;

  --purple:   #7864ff;
  --purple2:  #5d4ae0;
  --purple-dim: rgba(120,100,255,0.12);
  --purple-glow: rgba(120,100,255,0.2);
  --purple-border: rgba(120,100,255,0.3);

  --cyan:     #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.1);
  --green:    #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --red:      #ff4060;
  --red-dim:   rgba(255,64,96,0.1);
  --amber:    #f0b429;
  --amber-dim: rgba(240,180,41,0.1);
  --blue:     #4a9eff;
  --blue-dim:  rgba(74,158,255,0.1);

  --grad-purple:  linear-gradient(135deg,#7864ff,#5d4ae0);
  --grad-cyan:    linear-gradient(135deg,#00d4ff,#0099e6);
  --grad-green:   linear-gradient(135deg,#00f5a0,#00c87b);
  --grad-red:     linear-gradient(135deg,#ff4060,#cc1a35);
  --grad-amber:   linear-gradient(135deg,#f0b429,#d48a00);
  --border-red: #ff4060;
  --border-green: #00f5a0;

  --glow-purple: 0 0 30px rgba(120,100,255,0.15);
  --glow-cyan:   0 0 30px rgba(0,212,255,0.12);
  --glow-green:  0 0 30px rgba(0,245,160,0.12);
  --glow-red:    0 0 30px rgba(255,64,96,0.12);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --nav-h: 52px;
  --band-h: 36px;
}

html { height: 100%; }

body {
  background: var(--bg-void);
  color: var(--text-1);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* ─── Loading screen ─── */
.loading-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 9999;
  background: var(--bg-void);
}
.loading-logo {
  font-size: 48px;
  font-weight: 800;
  background: var(--grad-purple);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -2px;
}
.loading-spinner {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border-2);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: var(--text-3);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

/* ─── Donation widget ─── */
.donate-wrapper {
  text-align: center;
  padding: 16px 20px 20px;
  margin-top: 4px;
}
.donate-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-3);
  margin-bottom: 10px;
}
.donate-card {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.donate-card:hover {
  border-color: var(--purple-border);
  box-shadow: var(--glow-purple);
}
.donate-card__icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--purple-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.donate-card__icon svg {
  width: 16px;
  height: 16px;
  fill: var(--purple);
}
.donate-card__info {
  text-align: left;
}
.donate-card__network {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  margin-bottom: 2px;
}
.donate-card__address {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--purple);
  user-select: all;
  cursor: copy;
}
.donate-card__copy-btn {
  background: var(--purple-dim);
  border: 1px solid var(--purple-border);
  color: var(--purple);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.donate-card__copy-btn:hover {
  background: var(--purple);
  color: #fff;
}
.donate-card__copy-btn.copied {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}
.donate-card__note {
  font-size: 9px;
  color: var(--text-4);
  margin-top: 8px;
  text-align: center;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  .donate-card { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<div id="app">
  <div class="loading-screen">
    <div class="loading-logo">SFC</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing SFC Terminal...</div>
  </div>
</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>
